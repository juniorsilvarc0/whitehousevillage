name: Deploy

# CD para a VPS: depois que o CI passa na main, entra por SSH e roda o MESMO
# infra/deploy.sh que se roda à mão — com as mesmas travas (porta ocupada por
# outro serviço para o deploy; nunca down/prune/--remove-orphans). Nenhum
# segredo da aplicação passa pelo GitHub: senha do banco e JWT ficam em
# infra/.env.production, só na VPS. O GitHub guarda apenas a chave SSH de um
# usuário de deploy e a impressão digital do servidor.
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   VPS_HOST          82.29.59.229
#   VPS_PORT          porta do SSH (opcional; vazio = 22)
#   VPS_USER          usuário de deploy (ver docs/infra.md §0, "CD")
#   VPS_SSH_KEY       chave privada desse usuário (ed25519, sem senha)
#   VPS_KNOWN_HOSTS   saída de `ssh-keyscan -t ed25519 82.29.59.229`, conferida
#                     contra o servidor — é o que impede um impostor de receber
#                     o deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Redeploy manual do que está na main, sem esperar commit novo.
  workflow_dispatch:

# Um deploy por vez, e o que chegou depois espera — nunca dois deploy.sh
# mexendo no mesmo stack ao mesmo tempo.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # CI vermelho não chega na VPS. push direto na main também passa por aqui:
    # o gatilho é o CI de `push` concluído com sucesso.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # O ambiente permite exigir aprovação manual em Settings → Environments.
    environment: producao
    timeout-minutes: 30
    steps:
      - name: Chave e servidor conhecidos
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy do commit que passou no CI
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          # O commit exato que o CI aprovou — não "o que estiver na main agora".
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "set -euo pipefail
              cd /opt/whv-gestao
              git fetch --quiet origin main
              git checkout --quiet --force --detach '$SHA'
              bash infra/deploy.sh"
