name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/api/go.sum
      - name: Formatação
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      # A segunda passada é a que importa: arquivo com `//go:build integration`
      # é INVISÍVEL para `go vet ./...`, `go build ./...` e `go test ./...`.
      # Sem ela, uma suíte de integração que nem compila atravessa este job — e
      # o erro só aparece lá no job `integration`, depois de subir um Postgres.
      # É o mesmo par que `make vet` roda; ter só um dos dois aqui era a
      # diferença entre o CI e o portão local.
      - name: Vet com a tag integration
        run: go vet -tags=integration ./...
      - name: Testes
        run: go test ./... -race -count=1

  # golangci-lint só rodava no `make lint` local: 11 apontamentos entraram em
  # commits da `main` (seis já publicados quando foram medidos) sem o CI acusar
  # nenhum, e foram zerados à mão em e0bc08e. Job próprio, e não passo do job
  # `api`, para lint vermelho não esconder o resultado dos testes e vice-versa.
  lint-go:
    name: Lint Go (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Versões das actions já em node24, como no PR das actions (c8037be):
      # checkout v5 e setup-go v6.
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: apps/api/go.sum
      # A versão sai do Makefile (GOLANGCI_LINT_VERSION): o número mora num lugar
      # só, e o `make lint` local confere a mesma.
      - name: Versão fixada do golangci-lint
        id: golangci
        run: echo "versao=$(make -s golangci-versao)" >> "$GITHUB_OUTPUT"
      # A action só INSTALA (e restaura/salva o cache de análise); quem roda é o
      # alvo do Makefile, com as mesmas flags (`--max-same-issues=0
      # --max-issues-per-linter=0`) da máquina do desenvolvedor.
      # v9 porque é a primeira em node24: o `runs.using` do action.yml é node20
      # nas tags v6, v7 e v8, e node24 na v9 (conferido em 02/10/2026).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.versao }}
          install-only: true
          working-directory: apps/api
      - name: golangci-lint
        run: make lint-golangci

  migrations:
    name: Migrations (up e down)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: whvtest
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    defaults:
      run:
        working-directory: apps/api
    env:
      # MIGRATIONS_PATH fica no padrão (./migrations), que a partir de apps/api
      # aponta para o diretório certo.
      DATABASE_URL: postgres://postgres:test@localhost:5432/whvtest?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/api/go.sum
      # Roda o NOSSO cmd/migrate, não o CLI externo: o que o CI valida tem de
      # ser exatamente a ferramenta que aplica schema na VPS.
      - name: Aplicar, reverter até zero e reaplicar
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate version
          go run ./cmd/migrate down -all
          go run ./cmd/migrate up
          go run ./cmd/migrate version

  integration:
    name: Testes de integração (Go + Postgres)
    runs-on: ubuntu-latest
    # Teto de tempo do job: a repetição do teste de concorrência espera pelo
    # `deadlock_timeout` do Postgres quando o defeito está presente, e job sem
    # teto queima hora de runner até o limite de 6 h. Medido: ~4 min o job
    # inteiro com as 10 repetições.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: whvintegration
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    # Sem `working-directory: apps/api` de propósito: as etapas abaixo chamam os
    # alvos do Makefile da raiz. Os comandos (flags, regex, número de
    # repetições) moram num lugar só — CI e `make test-integration` divergirem é
    # exatamente como um passo entra num lado e some do outro sem ninguém ver.
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/whvintegration?sslmode=disable
      TZ: America/Fortaleza
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/api/go.sum
      - name: Schema
        run: make it-schema
      # O seed NÃO é conveniência: sem ele a tabela `resources` fica vazia e todo
      # teste que concede permissão bate na FK `role_permissions_resource_code_fkey`
      # (23503). Além disso `TestPerfilCorretorSemeadoSalvaSemAlteracao` se PULA
      # quando não existe o perfil `corretor` — e teste pulado conta como verde,
      # que é cobertura perdida disfarçada de sucesso. Reproduzido em Postgres
      # real: sem seed, 12 testes de `internal/modules/users` vermelhos e 1
      # pulado; com seed, todos executam.
      - name: Seed
        run: make it-seed
      # -race porque é aqui que moram os testes de disputa.
      - name: Suíte com a tag integration
        run: make it-suite
      # POR QUE REPETIR, e não rodar uma vez: o defeito mais grave desta rodada
      # (a perdedora de uma disputa de datas recebendo 500 em vez de 409, porque
      # o Postgres devolve 40P01 no lugar de 23P01) é PROBABILÍSTICO — só
      # aparece quando duas transações se cruzam dentro da janela da constraint.
      # Medido em Postgres real nesta rodada: `-count=1` passou VERDE com o
      # defeito presente e `-count=10` reprovou. Foi assim que ele atravessou
      # duas revisões adversariais seguidas.
      # Com ~1/3 de chance de detecção por execução, 10 repetições deixam
      # (2/3)^10 ~ 2% de chance de a falha atravessar o CI; uma execução deixaria
      # 67%. Custo medido: ~75 s para os 6 testes de concorrência x 10.
      # O alvo falha se o regex de seleção não casar com nenhum teste — teste
      # renomeado vira erro, nunca etapa vazia e verde.
      # Roda mesmo com a suíte vermelha (`!cancelled()`): o sinal de concorrência
      # é o mais caro de obter e o mais fácil de perder. Se ele ficasse atrás de
      # um `needs` implícito, uma falha qualquer da suíte esconderia a disputa de
      # datas e a rodada seguinte descobriria tudo de novo do zero.
      - name: Concorrência, repetida (a falha intermitente não pode passar)
        if: ${{ !cancelled() }}
        run: make it-concorrencia

  admin:
    name: Painel (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile || pnpm install
      # O lint e os TESTES do painel não rodavam no CI — só `tsc` e `build`.
      # Eram 334 testes em 40 arquivos executados apenas por quem lembrasse de
      # digitar `make check`, e entre eles os que existem justamente para o CI
      # cobrar: `config/navigation.test.ts` varre `app/**/page.tsx` e reprova
      # item de menu sem tela (e tela existente ainda marcada como em
      # construção), e `lib/auth/*.test.ts` fixa o que cada perfil enxerga.
      # Guarda que não roda sozinha não é guarda.
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test --run
      - run: pnpm build

  smoke:
    name: Fumaça de aplicação (stack de pé)
    runs-on: ubuntu-latest
    # Teto porque o alvo constrói três imagens (API, painel e site) antes de
    # abrir o navegador.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile || pnpm install
        working-directory: apps/admin
      # O script prefere o Chrome da máquina e cai no Chromium do Playwright
      # quando ele não existe — este passo é o que garante o segundo.
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/admin
      # O compose lê `--env-file .env`, que não é versionado. Os valores de
      # exemplo bastam: APP_ENV=development, e a única checagem que endurece em
      # produção (JWT_SECRET de 32 bytes) não se aplica aqui.
      - name: Ambiente
        run: cp .env.example .env
      # Um alvo só, o MESMO que se roda na máquina: build das imagens, schema,
      # seed e a fumaça, nessa ordem. Repetir a sequência aqui é como um passo
      # entra num lado e some do outro — a mesma razão pela qual o job
      # `integration` chama os alvos do Makefile.
      # Desde 02/10/2026 o alvo também roda a fumaça do site (:3200) e confere
      # que o worker está de pé (`make worker-vivo`).
      - name: Subir o stack, migrar, semear, percorrer painel e site, conferir o worker
        run: make smoke-stack
      # Log do stack quando a fumaça reprova: sem ele o diagnóstico é "alguma
      # tela abriu com erro" e a investigação recomeça do zero na máquina de
      # alguém.
      - name: Logs do stack (só quando falha)
        if: failure()
        run: docker compose -f infra/docker-compose.yml --env-file .env logs --tail=200
      - name: Derrubar
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file .env down -v

  # O site como vai para produção: a IMAGEM, sem o volume do compose de dev por
  # cima. O job `smoke` já roda a fumaça do site, mas lá o public/ do repositório
  # é montado sobre o que a imagem copiou, então um COPY ou .dockerignore errado
  # passaria verde. Barato (nginx:alpine, sem build de front): roda em todo PR.
  site:
    name: Site público (imagem nginx + fumaça)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Node 22 fixado em vez do Node que vier na imagem do runner. A fumaça
      # não tem dependência nenhuma: `package-manager-cache: false` porque a v5
      # liga cache automático quando `cache:` está ausente, e aqui não há o que
      # cachear.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Construir a imagem do site, subir o container e rodar a fumaça
        run: make smoke-site-imagem

  build-images:
    name: Build das imagens
    runs-on: ubuntu-latest
    # Só em push para main: buildar imagem em todo PR custa minuto e não
    # acrescenta sinal — o build do Go e do Next já rodaram nos jobs acima.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, lint-go, admin, migrations, site]
    steps:
      - uses: actions/checkout@v4
      # Sem push para registry ainda: o objetivo aqui é provar que a Dockerfile
      # não quebrou. Publicar entra quando a VPS existir.
      - name: Imagem da API (api, worker, migrate, seed)
        run: docker build -f infra/api.Dockerfile -t whv-api:${{ github.sha }} .
      - name: Imagem do painel
        run: docker build -f infra/admin.Dockerfile -t whv-admin:${{ github.sha }} .
      # O nginx.conf do site usa set/ssi/error_page, e só o nginx:1.27-alpine da
      # imagem prova que ele vale lá. O job `site` já monta e testa esta imagem
      # em todo PR; aqui ela entra para o conjunto de imagens do commit ficar
      # completo quando o push para registry existir.
      - name: Imagem do site
        run: docker build -f apps/site/Dockerfile -t whv-site:${{ github.sha }} .
