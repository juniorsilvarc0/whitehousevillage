# Ambiente de desenvolvimento. Produção acrescenta infra/docker-compose.prod.yml
# (Traefik + labels + réplicas).
name: whitehousevillage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-America/Fortaleza}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # só em desenvolvimento; em produção não é publicado
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Passo EXPLÍCITO, sob demanda (`make migrate`). A API nunca aplica schema no
  # boot — migration silenciosa no startup é como se esconde erro de schema.
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    volumes:
      - ../apps/api/migrations:/migrations:ro
    entrypoint:
      ["migrate", "-path", "/migrations",
       "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
      target: build
    profiles: ["tools"]
    command: ["go", "run", "./cmd/seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ:-America/Fortaleza}
    working_dir: /src/apps/api
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: ${API_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-America/Fortaleza}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    command: ["/app/worker"]
    profiles: ["full"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-America/Fortaleza}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: infra/admin.Dockerfile
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-whv-session}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-White House Village}
      TZ: ${TZ:-America/Fortaleza}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
