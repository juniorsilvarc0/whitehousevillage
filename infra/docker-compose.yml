# Ambiente de desenvolvimento. Produção acrescenta infra/docker-compose.prod.yml
# (Traefik + labels + réplicas).
name: whitehousevillage

# api, worker, migrate e seed são a MESMA imagem, trocando só o entrypoint.
# Buildar uma vez e reaproveitar evita quatro builds idênticos por `make up`.
x-imagem-api: &imagem-api
  build:
    context: ..
    dockerfile: infra/api.Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-America/Fortaleza}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Porta do HOST configurável: 5432 costuma já estar tomada por outro
      # Postgres na máquina do desenvolvedor, e o stack não deve disputar a
      # porta padrão com projeto vizinho. Dentro da rede do compose continua 5432.
      - "${POSTGRES_PORT:-5433}:5432"          # só em desenvolvimento; em produção não é publicado
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Passo EXPLÍCITO, sob demanda (`make migrate`). A API nunca aplica schema no
  # boot — migration silenciosa no startup é como se esconde erro de schema.
  # Roda o nosso binário (apps/api/cmd/migrate), não a imagem migrate/migrate:
  # a ferramenta que aplica schema em produção precisa passar no nosso CI.
  migrate:
    <<: *imagem-api
    profiles: ["tools"]
    entrypoint: ["/app/migrate"]
    command: ["up"]
    volumes:
      # Só em dev: monta as migrations do repositório por cima das que vieram na
      # imagem, para uma migration nova valer sem rebuildar. Em produção o mount
      # não existe e vale a cópia de /migrations que a imagem carrega.
      - ../apps/api/migrations:/migrations:ro
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      MIGRATIONS_PATH: /migrations
      TZ: ${TZ:-America/Fortaleza}
    depends_on:
      postgres:
        condition: service_healthy

  # Idempotente por contrato: rodar de novo não duplica nada.
  seed:
    <<: *imagem-api
    profiles: ["tools"]
    entrypoint: ["/app/seed"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ:-America/Fortaleza}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *imagem-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Porta que o PROCESSO escuta dentro do container: fixa em 8080, de propósito.
      # Não sai de variável do .env — ver a nota em `ports`, logo abaixo.
      API_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-America/Fortaleza}
    ports:
      # Porta do HOST em variável PRÓPRIA. Até 02/10/2026 a MESMA `API_PORT` valia
      # para as duas pontas do mapeamento, e o custo medido nesta sessão foi:
      # trocar API_PORT no .env para liberar a 8080 do host fez a API escutar numa
      # porta que o mapeamento não publicava, o painel perdeu a API em
      # API_INTERNAL_URL=http://api:8080, e a sessão terminou com um arquivo de
      # override escrito à mão só para mover a porta do host.
      # O 8080 interno é contrato (painel, healthcheck, API_INTERNAL_URL); só o
      # lado de fora é negociável.
      - "${API_HOST_PORT:-8080}:8080"
    # A imagem é distroless (sem shell, sem curl), então o healthcheck só pode
    # ser o próprio binário. `cmd/api -healthcheck` sonda o /healthz local e sai
    # 0/1 sem abrir pool nem tentar escutar porta.
    #
    # Enquanto a flag não existiu, esta mesma linha caía no caminho normal do
    # binário: cada sonda SUBIA UMA SEGUNDA API, que morria em
    # `address already in use` e saía 1. O container passou a vida `unhealthy`
    # (272 falhas seguidas, medidas) e nenhum `depends_on: service_healthy`
    # apontado para a API teria liberado nada.
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *imagem-api
    entrypoint: ["/app/worker"]
    profiles: ["full"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-America/Fortaleza}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: infra/admin.Dockerfile
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-whv-session}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-White House Village}
      TZ: ${TZ:-America/Fortaleza}
    ports:
      # Mesma razão da porta do Postgres: 3000 é a porta padrão de todo projeto
      # Next da máquina, e o stack não deve disputá-la.
      - "${ADMIN_PORT:-3100}:3000"
    depends_on:
      - api
    restart: unless-stopped

  # Site público (apps/site): HTML/CSS/JS servido por nginx, SEM build de front.
  # Sem `depends_on: api` e sem variável de API: hoje ele não chama a API nenhuma
  # — tarifa, calendário e orçamento saem de public/scripts/data.js, no navegador.
  # Inventar API_BASE_URL aqui só criaria a ilusão de integração que não existe.
  site:
    build:
      context: ..
      dockerfile: apps/site/Dockerfile
    ports:
      - "${SITE_PORT:-3200}:80"
    volumes:
      # Só em dev: o conteúdo do repositório por cima do que a imagem copiou, para
      # editar um arquivo e dar F5 sem rebuildar — é como o MVP original era usado.
      # Em produção o mount não existe e vale o COPY da imagem.
      - ../apps/site/public:/usr/share/nginx/html:ro
    environment:
      TZ: ${TZ:-America/Fortaleza}
    # nginx:alpine não tem curl; tem o wget do busybox. `--spider` não baixa o
    # corpo e falha com status != 2xx, que é exatamente o que se quer sondar.
    #
    # 127.0.0.1 e não `localhost`: dentro do container `localhost` resolve primeiro
    # para ::1 e o `listen 80` do nosso nginx.conf só sobe em IPv4 — a primeira
    # versão desta linha deixou o container `unhealthy` com
    # "can't connect to remote host: Connection refused" enquanto o site servia 200
    # na porta publicada. Medido aqui, 4 falhas seguidas.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
