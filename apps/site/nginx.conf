# Site público (apps/site). O Dockerfile copia este arquivo para
# /etc/nginx/conf.d/default.conf — ele NÃO é montado como volume no dev, então
# qualquer mudança aqui pede rebuild da imagem.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── WhatsApp de reservas: o ÚNICO lugar do número no site inteiro ──
    # Número oficial de reservas, informado pelo dono em 03/10/2026:
    # (86) 99425-9816. Formato de wa.me: DDI 55 + DDD + número, só dígitos.
    # Trocar o número é editar esta linha e rebuildar a imagem; HTML e JS não
    # repetem o número.
    # As páginas recebem o valor por SSI (<!--# echo var='whv_whatsapp' -->), então
    # os botões funcionam sem JavaScript; o link do orçamento, montado em JS, lê
    # o mesmo valor do <meta name="whv:whatsapp">.
    set $whv_whatsapp "5586994259816";

    # ssi_types padrão é só text/html: CSS, JS, fontes e vídeo não passam pelo parser.
    ssi on;

    add_header Cache-Control "no-store" always;

    # 404 de verdade. O fallback antigo (`... $uri.html /index.html`) devolvia a
    # home com 200 para QUALQUER caminho: /admin/ continuaria "existindo" depois de
    # apagado, e cada link quebrado virava uma cópia da home para o buscador.
    # Saiu também o `$uri.html`: com ele cada página tinha duas URLs (/x e /x.html)
    # e /404 servia a página de erro com 200. Os links do site já usam `.html`.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # ── A API, só a vitrine ──
    # O site pergunta, não calcula (docs/unificacao-site-crm.md §3): catálogo,
    # calendário e orçamento vêm de /api/v1/public/*, servidos pela MESMA API do
    # painel. Pela mesma origem, para não abrir CORS nem expor a API num nome
    # próprio do DNS. SÓ o prefixo público: /api/v1/auth, /api/v1/reservations e
    # o resto da API continuam inalcançáveis por aqui (caem no 404 de baixo).
    #
    # `resolver` + variável: o nome `api` é resolvido por pedido, no DNS do
    # Docker, e não na subida. Sem isso o nginx não sobe quando a API ainda não
    # está de pé (ou não existe, como na fumaça isolada da imagem do site) — e
    # o site inteiro cairia por causa do orçamento.
    location ^~ /api/v1/public/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $whv_api http://api:8080;
        proxy_pass $whv_api;
        # O IP do visitante segue na cadeia: a API o lê da direita para a
        # esquerda (httpx.RealIP) e é por ele que o limitador da vitrine conta.
        # Sem esta linha todo visitante seria o IP deste container, e 120
        # pedidos por minuto valeriam para o site inteiro.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    # ── Fotos e vídeos do site (docs/site-cms.md §5) ──
    # Mesma API, mesmo prefixo público, mas location PRÓPRIA por três motivos:
    # - Cache: o bloco de cima ACRESCENTA `Cache-Control: no-store`, e add_header
    #   não substitui o cabeçalho da API, soma um segundo — o navegador fica com o
    #   mais restritivo e nunca guardaria a foto. Aqui vale o da API
    #   (`public, max-age=31536000, immutable`: o id do arquivo nunca muda).
    #   O `add_header` abaixo existe também para isso: com qualquer add_header na
    #   location, os do `server` (o no-store) deixam de ser herdados.
    # - Vídeo é pedido em Range (206). nginx repassa `Range` e `If-Range` como
    #   qualquer cabeçalho do pedido, e com buffering desligado não aplica o
    #   próprio filtro de range: o 206 e o `Content-Range` são os da API.
    # - Arquivo grande (vídeo até 300 MB): sem buffer, o nginx do site não
    #   copia o arquivo para disco/memória do container — passa em fluxo. Na
    #   VPS quem segura cliente lento é o nginx do host (buffer padrão ligado).
    location ^~ /api/v1/public/media/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $whv_api http://api:8080;
        proxy_pass $whv_api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        # Prazo entre DUAS leituras da API, não para o arquivo inteiro.
        proxy_read_timeout 60s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Qualquer outro caminho da API pelo site é 404 — explícito, para um
    # arquivo `api/...` esquecido em public/ nunca ser servido no lugar.
    location ^~ /api/ {
        return 404;
    }

    # O back-office mocado foi apagado (passo D1). Esta é a segunda trava: se uma
    # pasta public/admin/ voltar (merge antigo, cópia esquecida no volume de dev),
    # ela responde 404 em vez de ir ao ar sem autenticação nenhuma.
    # `^~` vence as regex abaixo, então /admin/qualquer.png também é 404.
    location ^~ /admin {
        return 404;
    }

    location ~* \.(mp4|webm|jpe?g|png|woff2?)$ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
