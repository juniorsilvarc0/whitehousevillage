openapi: 3.1.0
info:
  title: White House Village Manager API
  version: 0.1.0
  description: |
    Contrato da API de gestão da White House Village.

    Este arquivo é a **fonte da verdade**: é mergeado antes da implementação, e é
    contra ele que o painel e os testes são escritos. Pertence ao agente
    `tech-lead`; os demais propõem alterações, não editam.

    ## Campo desconhecido no corpo é erro, nunca silêncio

    Toda requisição com corpo **recusa** propriedade que o schema não declara,
    com `422 VALIDATION_ERROR` e o nome do campo em `details`. Não é purismo: um
    corpo com campo errado que responde `200` é a pior resposta possível — o
    cliente acha que gravou, o servidor não gravou nada, e não há erro em lugar
    nenhum para alguém investigar. Foi exatamente assim que
    `PATCH /reservations/{id}` com `{"guests": 6}` respondeu `200` e manteve
    `guests_count` em 4 (medido, 26/08/2026).

    A regra vale para `POST`, `PUT` e `PATCH`. Em `PATCH`, campo **ausente** não
    muda nada e campo com `null` limpa — ausência é silêncio combinado; nome
    desconhecido não é.

    ## Um dado, um nome

    Uma informação tem **um** nome em todo o contrato: o mesmo na entrada, na
    saída e na coluna do banco. Número de hóspedes é `guests_count` em pedido de
    orçamento, criação, edição, remarcação e resposta — não `guests` em metade
    delas.

    ## Dado pessoal na resposta: coleção mascara, ficha deixa rastro

    Uma regra só para toda rota que devolve dado de uma pessoa — `contacts` e
    tudo que o embute (lead, oportunidade, hóspede da reserva). Fixada em
    02/10/2026 pelo item F2-23, depois desta medida, autenticado como
    `corretor@wh.local`: `GET /contacts?per_page=100` devolveu as 11 fichas com
    CPF e telefone completos, e `pii_access_log` ficou em 43 → 43 linhas; uma
    única leitura de ficha levou a contagem a 44. A trilha de LGPD era
    contornável por um parâmetro de paginação.

    1. **Coleção não serve documento, telefone nem e-mail cheios.** Lista
       paginada, quadro e kanban devolvem a máscara da tabela abaixo, e nunca
       `birth_date` nem `notes` (texto livre não tem máscara possível). Por
       isso coleção **não** grava `pii_access_log`: ela não entrega o dado que
       a trilha protege.
    2. **Leitura de UM registro que devolve o valor cheio grava
       `pii_access_log`** — uma linha por contato exibido (`actor_id`,
       `contact_id`, `reason`), gravada **antes** de a resposta sair. Falha
       fechada: não conseguir gravar a linha aborta a leitura com erro, nunca
       serve sem rastro.
    3. **Filtro continua comparando o valor cheio, no servidor.** `doc_number`,
       `phone` e `q` acham a pessoa exatamente como antes; a máscara é só da
       resposta. Quem procura pelo CPF no balcão acha a linha, vê o documento
       mascarado e abre a ficha — que registra.

    Não há terceira opção. Coleção nova da Fase 2 entra mascarando (regra 1)
    ou registrando cada pessoa exibida (regra 2): recebível com titular e
    comissão com corretor são listas paginadas e mascaram; a rooming list é a
    lista de UMA reserva, é tela de trabalho da recepção e registra. O teste
    que aceita cada uma repete a medida acima: falha se um `doc_number`
    completo aparecer numa resposta sem linha nova em `pii_access_log`.

    | Campo | Máscara | Valor cheio → resposta |
    |---|---|---|
    | `doc_number`, `doc_type: cpf` com 11 dígitos | `***.***.` + dígitos 7–9 + `-` + os 2 verificadores | `12345677735` → `***.***.777-35` |
    | `doc_number`, `doc_type: cnpj` com 14 dígitos | `**.***.***/` + dígitos 9–12 + `-` + os 2 verificadores | `11222333000181` → `**.***.***/0001-81` |
    | `doc_number` em qualquer outro caso (passaporte, tipo nulo, tamanho fora do tipo) | `*` em todo caractere menos os 3 últimos; com 3 caracteres ou menos, `***` | `FX1234567` → `******567` |
    | `phone_e164` | `+` e `*` em todo dígito menos os 4 últimos | `+5585999990000` → `+*********0000` |
    | `email` | primeiro caractere antes do `@`, `***`, `@` e o domínio inteiro; sem `@`, `***` | `fernanda.lima@gmail.com` → `f***@gmail.com` |

    `null` continua `null` — a máscara não inventa dado. E o valor mascarado
    **nunca** é aceito de volta: num `POST`/`PUT`/`PATCH` ele é
    `422 VALIDATION_ERROR`. Documento e telefone já caem nos validadores de
    formato (`*` não é dígito de CPF nem pontuação de telefone); o e-mail não
    cairia — `f***@gmail.com` é endereço válido pela RFC, conferido contra o
    validador em uso —, e por isso `email` com `*` é recusado explicitamente
    (ver `ContatoCriar.email`). Sem essa recusa, um formulário preenchido a
    partir da lista gravaria a máscara por cima do endereço verdadeiro, com
    `200` e sem erro nenhum.

    **O e-mail é mascarado, e não por excesso de zelo.** Telefone e e-mail são
    o mesmo tipo de dado — canal para alcançar a pessoa —, e mascarar só um
    deixaria a lista exportável como mala direta da clientela da casa, página a
    página e sem rastro: é a mesma "base inteira" que o F2-23 mediu, trocada de
    coluna. A busca `q` continua achando por e-mail; o que se perde é copiar
    endereços da tela, que não é uso de quem atende. O domínio fica visível
    porque distingue `@gmail.com` de endereço corporativo sem identificar
    ninguém sozinho.

    **O nome não é mascarado**, em coleção nenhuma. É como a operação se refere
    ao hóspede — no mapa, no kanban, na lista de reservas —, e uma lista de
    nomes sem documento nem canal não alcança a pessoa. Mascará-lo inutilizaria
    as telas de trabalho sem proteger o que esta regra protege.

    **Usuário do sistema não é contato.** `GET /users` devolve `email` e `phone`
    de quem opera o painel, cheios: na matriz semeada o recurso `users` só é
    concedido ao perfil `admin` (e quem concede a outro perfil decide isso na
    tela de perfis, com trilha), a lista é a tela de administração de acesso e
    o e-mail é o login — mascará-lo impediria o administrador de saber de quem
    é a conta que está desativando.

    **Vocabulário de `pii_access_log.reason`**, fechado — motivo novo entra aqui
    e em `internal/platform/pii` na mesma mudança, porque "quantas vezes leram
    esta pessoa, e para quê?" só tem resposta com vocabulário fechado:

    | `reason` | Quem grava |
    |---|---|
    | `detail` | `GET /contacts/{id}` e `PATCH /contacts/{id}` |
    | `export` | `GET /contacts/{id}/export` |
    | `rooming_list` | `GET /reservations/{id}/full` — uma linha por hóspede listado |
    | `opportunity` | `GET /crm/opportunities/{id}/full` — o contato da oportunidade |

    **Versionamento.** `docs/api.md` §8 trata como quebra mudar o que um campo
    devolve, e mascarar `doc_number` em `/api/v1` é isso. A exceção é deliberada
    e fica escrita: é correção de vazamento, e o único consumidor da v1 é o
    painel deste repositório, publicado junto com a API. Abrir `/api/v2` para a
    v1 seguir servindo CPF em texto puro seria manter o vazamento aberto.
servers:
  - url: http://localhost:8080/api/v1
    description: Desenvolvimento

tags:
  - name: Saúde
  - name: Autenticação
  - name: Usuários
  - name: Perfis
  - name: Inventário
    description: Propriedade, produtos (o que se vende) e unidades físicas (o que se ocupa).
  - name: Tarifário
    description: Tarifas, calendário comercial e políticas — tudo dado versionado, e nada reescreve o passado.
  - name: Contatos
    description: |
      A pessoa. **Uma pessoa, um registro** (spec §6): lead, hóspede, corretor e
      proprietário apontam todos para `contacts`, e é por isso que não existe
      "cadastro de hóspede" separado do de lead — seriam duas fichas do mesmo ser
      humano, e no dia em que ela trocasse de telefone só uma seria corrigida.
      Deduplicação por telefone E.164 e por documento, e os deveres de LGPD
      (base legal, opt-in datado, eliminação e portabilidade) moram aqui.
  - name: Disponibilidade
    description: |
      Mapa de ocupação e orçamento. **Nada aqui bloqueia data** — nem a consulta,
      nem o orçamento salvo. Quem insere em `stay_blocks` é a pré-reserva
      (`POST /reservations`), e só ela.
  - name: Reservas
    description: O ciclo de vida da venda e o bloqueio operacional do calendário.
  - name: CRM
    description: |
      Funis, leads, oportunidades e atividades. Duas regras atravessam o módulo
      inteiro: **escopo `own`** — o corretor enxerga só as próprias oportunidades,
      leads e atividades, e o filtro é `AND owner_id = $usuario` no SQL, nunca
      peneira em memória — e **estado só muda por ação nomeada**, porque cada
      transição carrega efeito colateral obrigatório (histórico de etapa, tarefa
      automática, motivo de perda, reserva).
  - name: Vitrine
    description: |
      Superfície **pública** do site de vendas (`apps/site`), sem token — passo A1
      de `docs/unificacao-site-crm.md`. O site pergunta, não calcula: tudo aqui
      sai do mesmo motor e das mesmas consultas do painel. Três invariantes:
      nenhuma resposta carrega dado de terceiro nem de operação (dia ocupado é só
      `available: false`); nada aqui grava nem segura data; toda rota é limitada
      por IP (120/min, `RATE_LIMITED`). O público não negocia: não existe campo
      de desconto, e a resposta não carrega alçada, versão de política nem tabela.
  - name: Tempo real
    description: |
      O barramento de eventos que faz o mapa de ocupação e o kanban se atualizarem
      sozinhos. O evento diz **que** algo mudou, nunca **o que** mudou.

paths:
  # As duas sondas declaram `servers` próprio porque NÃO moram sob `/api/v1`:
  # sonda de saúde não é contrato de negócio. Quem as chama é o healthcheck do
  # Compose, o proxy da frente e o orquestrador, com um caminho fixo escrito na
  # configuração de infraestrutura — e no dia do `/api/v2` esse caminho não pode
  # ter de ser reescrito junto, nem passar a existir em duas versões.
  #
  # Elas já nasceram sob o prefixo uma vez, e o efeito foi medido:
  # `curl localhost:8080/readyz` devolvia 404. `router.Rota.NaRaiz` é o que as
  # tira do prefixo, e `TestSondasSoExistemNaRaiz` cobra que existam na raiz e
  # SÓ nela.
  /healthz:
    servers:
      - url: http://localhost:8080
        description: Desenvolvimento (raiz, fora do prefixo da API)
    get:
      tags: [Saúde]
      summary: Processo vivo
      security: []
      responses:
        "200": { description: OK }

  /readyz:
    servers:
      - url: http://localhost:8080
        description: Desenvolvimento (raiz, fora do prefixo da API)
    get:
      tags: [Saúde]
      summary: Pronto para servir (banco acessível e schema na versão esperada)
      security: []
      responses:
        "200": { description: Pronto }
        "503": { description: Banco inacessível ou migration pendente }

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica e devolve o par de tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Autenticado
          headers:
            Set-Cookie:
              description: |
                `wh_refresh=<token>; HttpOnly; SameSite=Lax; Path=/api/v1/auth`
                (+ `Secure` em produção), válido por 30 dias. O refresh nunca vai
                no corpo por padrão — fora do cookie `httpOnly` ele fica ao
                alcance de qualquer XSS.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token: { type: string }
                      expires_in: { type: integer, example: 900 }
                      user: { $ref: "#/components/schemas/Usuario" }
        "401":
          description: |
            `INVALID_CREDENTIALS` — a resposta é **idêntica** para e-mail
            inexistente, senha errada e e-mail bloqueado por tentativas
            (5 erros em 15 min bloqueiam por 15 min). Diferenciar aqui seria
            entregar de graça a lista de quem tem conta.
          $ref: "#/components/responses/Erro"

  /auth/refresh:
    post:
      tags: [Autenticação]
      summary: Rotaciona o refresh token e devolve um novo par
      security: []
      description: |
        O refresh chega no cookie `httpOnly` `wh_refresh` — o caminho do painel —
        ou, para cliente que não guarda cookie, no corpo. Se vierem os dois, o
        cookie vence.

        **A rotação é obrigatória**: toda chamada bem-sucedida revoga o token
        apresentado e emite outro na mesma família (`family_id`). Reapresentar um
        token **já rotacionado** só acontece em dois casos — cliente com bug ou
        token roubado — e o contrato trata os dois como roubo: responde
        `401 TOKEN_REUSED` e **revoga a família inteira de sessões**, derrubando
        ladrão e dono legítimo juntos. O dono refaz o login; o ladrão fica com um
        token morto.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Alternativa ao cookie, para cliente sem cookie jar.
      responses:
        "200":
          description: Novo par emitido e cookie de refresh substituído
          headers:
            Set-Cookie:
              description: "`wh_refresh=<novo>; HttpOnly; SameSite=Lax; Path=/api/v1/auth` (+ `Secure` em produção)."
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token: { type: string }
                      expires_in: { type: integer, example: 900 }
                      user: { $ref: "#/components/schemas/Usuario" }
        "401":
          description: |
            `TOKEN_INVALID` — ausente, expirado, desconhecido ou de família já
            revogada. `TOKEN_REUSED` — já rotacionado: a família inteira acabou
            de ser revogada; o cliente deve limpar o estado e mandar logar.
          $ref: "#/components/responses/Erro"

  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão revogando a família inteira
      description: |
        Revoga o refresh apresentado **e toda a sua família**, então nenhum
        descendente daquele login continua válido. O access token já emitido
        segue valendo até expirar (15 min) — é o preço de não manter lista negra
        de JWT, e o motivo de o access ser curto.

        Idempotente: sessão inexistente ou já revogada também responde 204.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "204":
          description: Sessão encerrada e cookie de refresh apagado
          headers:
            Set-Cookie:
              description: "`wh_refresh=; Max-Age=0; Path=/api/v1/auth`."
              schema: { type: string }

  /auth/password/forgot:
    post:
      tags: [Autenticação]
      summary: Dispara o e-mail de recuperação de senha
      security: []
      description: |
        Responde **sempre** 202, o e-mail existindo ou não, e no mesmo tempo de
        resposta: revelar qual endereço tem conta é enumeração de usuários. O
        token é de uso único e vale 1 h.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: "Aceito. Se o e-mail existir, a mensagem sai — a resposta é idêntica nos dois casos." }
        "429":
          description: "`RATE_LIMITED` — o disparo é limitado por e-mail e por IP."
          $ref: "#/components/responses/Erro"

  /auth/password/reset:
    post:
      tags: [Autenticação]
      summary: Troca a senha usando o token de recuperação
      security: []
      description: |
        Consome o token (uso único, 1 h). Trocar a senha revoga **todas** as
        famílias de sessão do usuário — se a recuperação foi feita porque a conta
        estava comprometida, o invasor perde o acesso no mesmo instante.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:    { type: string }
                password: { type: string, format: password, minLength: 8 }
      responses:
        "204": { description: Senha trocada e todas as sessões revogadas }
        "400":
          description: "`TOKEN_INVALID` — token inexistente, expirado ou já usado."
          $ref: "#/components/responses/Erro"
        "422":
          description: "`VALIDATION_ERROR` — senha fora da política (`details.password`)."
          $ref: "#/components/responses/Erro"

  /auth/me:
    get:
      tags: [Autenticação]
      summary: Usuário autenticado e suas permissões
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: "#/components/schemas/Usuario" }
                      permissions:
                        type: array
                        description: |
                          A matriz do perfil, achatada. O painel usa para esconder
                          o que o usuário não pode fazer — é espelho, não barreira:
                          a checagem que vale é a do middleware, a cada requisição.
                        items: { $ref: "#/components/schemas/Permissao" }

  /users:
    get:
      tags: [Usuários]
      summary: Lista usuários
      description: |
        Devolve `email` e `phone` **cheios**, e é a exceção declarada à regra
        "Dado pessoal na resposta" (topo deste arquivo): usuário do sistema não
        é contato. Na matriz semeada, o recurso `users` só é concedido ao
        perfil `admin`; a lista é a tela de administração de acesso, e o e-mail
        é o login —
        mascará-lo impediria o administrador de saber de quem é a conta que
        está desativando. Dado de hóspede, lead ou corretor como **pessoa**
        mora em `contacts` e segue a regra sem exceção.
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - name: sort
          in: query
          schema: { type: string, default: name, enum: [name, -name, email, -email, created_at, -created_at, last_login_at, -last_login_at] }
        - name: q
          in: query
          schema: { type: string }
          description: Busca por nome ou e-mail.
        - name: role
          in: query
          schema: { type: string, example: corretor }
          description: Filtra pelo `code` do perfil — o mesmo de `/roles`, não o uuid.
        - name: active
          in: query
          schema: { type: boolean }
          description: Ausente traz ativos e inativos.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Usuario" }
                  - $ref: "#/components/schemas/Paginacao"
    post:
      tags: [Usuários]
      summary: Cria usuário
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioCriar" }
      responses:
        "201":
          description: Criado
          headers:
            Location:
              description: URI do recurso criado.
              schema: { type: string, example: /api/v1/users/9f1c1e2a-0d3b-4f6a-9a1e-2b7c5d8e0f11 }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Usuario" }
        "403":
          description: |
            `FORBIDDEN` — `role_id` de perfil mais poderoso que o do ator, ou
            ator sem `roles:editar`. Atribuir papel é administrar acesso.
          $ref: "#/components/responses/Erro"
        "409":
          description: |
            `EMAIL_IN_USE` — e-mail já cadastrado. Quem decide é a constraint
            `UNIQUE` do banco (violação `23505` traduzida), não um `SELECT` antes
            do `INSERT`, que perderia a corrida.
          $ref: "#/components/responses/Erro"
        "422": { $ref: "#/components/responses/Erro" }

  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Usuários]
      summary: Detalhe do usuário
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Usuario" }
        "404": { $ref: "#/components/responses/Erro" }
    put:
      tags: [Usuários]
      summary: Substitui o usuário
      description: |
        Substituição integral: campo opcional ausente volta ao padrão
        (`phone` fica nulo, `active` volta a `true`). `password` ausente **mantém
        a senha atual** — PUT não é motivo para derrubar a senha de ninguém.
        Para alteração parcial use `PATCH`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/UsuarioAtualizar"
                - type: object
                  required: [name, email, role_id]
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Usuario" }
        "403":
          description: |
            `FORBIDDEN` — `role_id` de perfil mais poderoso que o do ator, ou
            ator sem `roles:editar`. Atribuir papel é administrar acesso.
          $ref: "#/components/responses/Erro"
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`EMAIL_IN_USE` — o e-mail já pertence a outro usuário."
          $ref: "#/components/responses/Erro"
        "422": { $ref: "#/components/responses/Erro" }
    patch:
      tags: [Usuários]
      summary: Atualiza parcialmente o usuário
      description: |
        Só o que veio no corpo muda. Campo **ausente** não é tocado; campo com
        `null` limpa (vale para `phone`) — a distinção que o `Opt[T]` carrega.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioAtualizar" }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Usuario" }
        "403":
          description: |
            `FORBIDDEN` — `role_id` de perfil mais poderoso que o do ator, ou
            ator sem `roles:editar`. Atribuir papel é administrar acesso.
          $ref: "#/components/responses/Erro"
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`EMAIL_IN_USE` — o e-mail já pertence a outro usuário."
          $ref: "#/components/responses/Erro"
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      tags: [Usuários]
      summary: Desativa o usuário (soft delete)
      description: |
        Marca `active = false` e revoga todas as famílias de sessão. Não apaga a
        linha: reserva, oportunidade e auditoria apontam para o usuário, e
        histórico com autor órfão não é histórico. Reativar é `PATCH` com
        `active: true`.
      responses:
        "204": { description: Desativado }
        "404": { $ref: "#/components/responses/Erro" }
        "422":
          description: |
            `VALIDATION_ERROR` — o usuário autenticado não pode desativar a si
            mesmo, nem o último usuário ativo de perfil `admin` (ficaria uma
            instalação sem ninguém capaz de configurar).
          $ref: "#/components/responses/Erro"

  /roles:
    get:
      tags: [Perfis]
      summary: Lista perfis
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - name: q
          in: query
          schema: { type: string }
          description: Busca por código ou nome.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Perfil" }
                  - $ref: "#/components/schemas/Paginacao"
    post:
      tags: [Perfis]
      summary: Cria perfil
      description: |
        Nasce sem nenhuma permissão — a matriz vem depois, por
        `PUT /roles/{id}/permissions`. `is_system` nunca vem do cliente: só o
        seed marca perfil de sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, pattern: "^[a-z][a-z0-9_]{1,30}$", example: recepcao }
                name: { type: string, example: Recepção }
      responses:
        "201":
          description: Criado
          headers:
            Location:
              description: URI do recurso criado.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Perfil" }
        "422":
          description: "`VALIDATION_ERROR` — `code` fora do padrão ou já em uso (`details.code`)."
          $ref: "#/components/responses/Erro"

  /roles/resources:
    get:
      tags: [Perfis]
      summary: Catálogo de recursos × ações — a matriz de permissão possível
      description: |
        Fonte **única** da tela de perfis: as linhas da grade saem daqui, e
        `PUT /roles/{id}/permissions` recusa qualquer par que não exista neste
        catálogo. Não é paginado — o catálogo é pequeno, versionado por seed, e
        vem inteiro.

        `scopes` diz quais escopos fazem sentido no recurso: onde não existe dono
        (configurações, tarifário) só há `all`, e a tela desabilita "só os meus"
        em vez de oferecer uma opção que o SQL não sabe aplicar.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code:    { type: string, example: crm.opportunities }
                        label:   { type: string, example: Oportunidades }
                        group:   { type: string, example: CRM, description: "Rótulo do agrupamento na tela de perfis." }
                        actions:
                          type: array
                          items: { type: string, enum: [ver, criar, editar, excluir] }
                        scopes:
                          type: array
                          items: { type: string, enum: [all, own] }

  /roles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Perfis]
      summary: Detalhe do perfil, já com a matriz aplicada
      description: A lista não traz `permissions`; o detalhe traz, porque é o que a tela de edição precisa numa chamada.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Perfil"
                      - type: object
                        properties:
                          permissions:
                            type: array
                            items: { $ref: "#/components/schemas/Permissao" }
        "404": { $ref: "#/components/responses/Erro" }
    put:
      tags: [Perfis]
      summary: Substitui o perfil
      description: |
        Substituição integral do cadastro do perfil: `code` e `name` são
        **obrigatórios**, porque o corpo é o estado final e não um remendo. Para
        mudar só um dos dois use `PATCH`.

        **A matriz não vem aqui.** Quem troca permissão é
        `PUT /roles/{id}/permissions`. Um PUT de cadastro que zerasse a matriz
        por omissão tiraria o acesso de todos os usuários do perfil sem ninguém
        ter pedido isso. A resposta traz `permissions` — o mesmo corpo do `GET`,
        para a tela reexibir o perfil inteiro sem uma segunda chamada — mas ela
        sai exatamente como estava.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, pattern: "^[a-z][a-z0-9_]{1,30}$", example: recepcao }
                name: { type: string, example: Recepção }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Perfil"
                      - type: object
                        properties:
                          permissions:
                            type: array
                            items: { $ref: "#/components/schemas/Permissao" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`ROLE_IMMUTABLE` — perfil com `is_system = true` não se altera, nem de nome."
          $ref: "#/components/responses/Erro"
        "422":
          description: "`VALIDATION_ERROR` — `code` fora do padrão, ausente, ou já em uso por outro perfil (`details.code`)."
          $ref: "#/components/responses/Erro"
    patch:
      tags: [Perfis]
      summary: Renomeia o perfil
      description: Só rótulo e código, e só o que vier no corpo muda — para substituição integral use `PUT`. A matriz tem endpoint próprio, para não misturar edição de nome com mudança de acesso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, pattern: "^[a-z][a-z0-9_]{1,30}$" }
                name: { type: string }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Perfil" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`ROLE_IMMUTABLE` — perfil com `is_system = true` não se altera."
          $ref: "#/components/responses/Erro"
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      tags: [Perfis]
      summary: Exclui o perfil
      responses:
        "204": { description: Excluído }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: |
            `ROLE_IMMUTABLE` — perfil de sistema.
            `ROLE_IN_USE` — ainda há usuários no perfil (`details.users_count`);
            mova-os antes. Excluir em cascata deixaria gente sem permissão nenhuma
            e sem aviso.
          $ref: "#/components/responses/Erro"

  /roles/{id}/permissions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Perfis]
      summary: Substitui a matriz de permissões do perfil
      description: |
        **Substitui**, não acumula: o que não vier no corpo deixa de valer. É
        `DELETE` + `INSERT` na mesma transação, então a tela manda o estado
        inteiro da grade sem precisar calcular diferença.

        Perfil com `is_system = true` (o `admin`) responde `409 ROLE_IMMUTABLE`.
        Permitir editar a matriz do admin é deixar alguém trancar a chave dentro
        do carro: bastaria remover `configuracoes:editar` para ninguém mais
        conseguir consertar a instalação.

        Pares fora do catálogo de `GET /roles/resources`, ou `(resource, action)`
        repetido no corpo — a chave é `(role_id, resource_code, action)`, um par
        não pode ter dois escopos — são recusados com `422` apontando o índice em
        `details`. A matriz nova vale na requisição seguinte do usuário: sem
        deploy, sem novo login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/Permissao" }
      responses:
        "200":
          description: Matriz aplicada, como ficou gravada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Permissao" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`ROLE_IMMUTABLE` — a matriz de perfil de sistema é imutável."
          $ref: "#/components/responses/Erro"
        "422":
          description: "`VALIDATION_ERROR` — par fora do catálogo ou duplicado (`details.permissions`)."
          $ref: "#/components/responses/Erro"

  # ════════════════════════════════════════════════════════════════════
  # Inventário — propriedade, produtos (o que se vende) e unidades
  # físicas (o que é ocupado e limpo). Módulo `inventario`.
  # ════════════════════════════════════════════════════════════════════

  /properties:
    get:
      tags: [Inventário]
      summary: Lista as propriedades
      description: |
        Hoje há uma só. O endpoint existe porque `property_id` acompanha todas as
        tabelas desde o começo (db.md §Convenções) — quando a segunda casa
        entrar, nada no painel muda de forma.

        Não há `POST` nem `DELETE`: criar propriedade é ato de instalação, feito
        por migration/seed. Documentar um verbo que ninguém implementa é
        exatamente o que o teste de contrato existe para pegar.
      x-rbac: { recurso: inventory, acao: ver }
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: active,   in: query, schema: { type: boolean }, description: Ausente traz ativas e inativas. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Propriedade" }
                  - $ref: "#/components/schemas/Paginacao"
        "403": { $ref: "#/components/responses/Erro" }

  /properties/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Inventário]
      summary: Detalhe da propriedade
      x-rbac: { recurso: inventory, acao: ver }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Propriedade" }
        "404": { $ref: "#/components/responses/Erro" }
    patch:
      tags: [Inventário]
      summary: Atualiza dados da propriedade
      description: |
        Campo **ausente** não muda nada; campo com `null` limpa — a distinção que
        o `Opt[T]` do Go carrega (CLAUDE.md §6).

        `timezone` é aceito, mas mudá-lo reinterpreta "hoje" no sistema inteiro
        (spec §Convenções: "hoje" tem uma única definição). Vale `America/*`;
        outro valor é `422 VALIDATION_ERROR`.
      x-rbac: { recurso: inventory, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropriedadeAtualizar" }
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Propriedade" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }

  /unit-types:
    get:
      tags: [Inventário]
      summary: Lista os produtos
      description: |
        Produto é o que se vende; unidade é o que se ocupa. São coisas
        diferentes de propósito: sem unidade nominal não existe constraint capaz
        de impedir overbooking, e a operação não saberia qual apartamento
        preparar.
      x-rbac: { recurso: inventory, acao: ver }
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: active,   in: query, schema: { type: boolean } }
        - { name: q,        in: query, schema: { type: string }, description: Busca por `code` ou `name`. }
        - name: sort
          in: query
          schema: { type: string, default: sort_order, enum: [sort_order, -sort_order, code, -code, name, -name] }
          description: O padrão é `sort_order` — a ordem do catálogo comercial é dado, não alfabética.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Produto" }
                  - $ref: "#/components/schemas/Paginacao"
        "403": { $ref: "#/components/responses/Erro" }
    post:
      tags: [Inventário]
      summary: Cria um produto
      description: |
        `consumes` decide quantas linhas de `stay_blocks` uma venda insere:
        `one_member` insere **uma** (a unidade escolhida pelo alocador) e
        `all_members` insere **todas** as unidades da composição — é assim que a
        exclusividade da White House Completa cai de graça da constraint do
        banco, sem nenhum `SELECT` antes do `INSERT`.

        Produto nasce sem composição. Ela é definida em
        `PUT /unit-types/{id}/members`, e sem ela nenhuma venda é possível
        (`422 VALIDATION_ERROR`).
      x-rbac: { recurso: inventory, acao: criar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProdutoCriar" }
      responses:
        "201":
          description: Criado
          headers:
            Location:
              description: URI do recurso criado.
              schema: { type: string, example: /api/v1/unit-types/9f1c1e2a-0d3b-4f6a-9a1e-2b7c5d8e0f11 }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Produto" }
        "409":
          description: |
            `CODE_IN_USE` — já existe produto com esse `code` na propriedade.
            Quem decide é a constraint `UNIQUE (property_id, code)` (violação
            `23505` traduzida), não um `SELECT` antes do `INSERT`, que perderia
            a corrida.
          $ref: "#/components/responses/Erro"
        "422": { $ref: "#/components/responses/Erro" }

  /unit-types/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Inventário]
      summary: Detalhe do produto
      x-rbac: { recurso: inventory, acao: ver }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Produto" }
        "404": { $ref: "#/components/responses/Erro" }
    put:
      tags: [Inventário]
      summary: Substitui o produto
      description: |
        Substituição integral — campo opcional ausente volta ao padrão do schema.

        **`consumes` é guardado aqui exatamente como no `PATCH`.** Um verbo que
        recusa e outro que aceita a mesma mudança não é contrato, é convite:
        quem não troca pelo `PATCH` troca reenviando o cadastro inteiro. Ver o
        `409` abaixo.
      x-rbac: { recurso: inventory, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProdutoCriar" }
      responses:
        "200":
          description: Substituído
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Produto" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: |
            `RESOURCE_IN_USE` — a mudança de `consumes` alcança uma estadia viva
            (`hold`, `confirmed` ou `checked_in`) que ainda não terminou.
            `details` traz `live_reservations[]`, com `code`, `check_in`,
            `check_out` e `unit_codes`.

            Medido em 26/08/2026, antes da guarda: a Completa vendida por
            R$ 20.200,00 teve `consumes` trocado de `all_members` para
            `one_member` com `200`; a venda seguinte da casa inteira saiu com UMA
            unidade pelo preço das oito, e as outras sete foram vendidas a
            terceiros nas mesmas datas. A troca inversa (`one_member` →
            `all_members`) quebra a invariante do outro lado: a estadia passa a
            ocupar 1 unidade num produto que declara consumir 4.

            `CODE_IN_USE` — outro produto da propriedade já usa esse `code`.
          $ref: "#/components/responses/Erro"
        "422": { $ref: "#/components/responses/Erro" }
    patch:
      tags: [Inventário]
      summary: Atualiza o produto
      description: |
        Campo ausente não muda nada; campo com `null` limpa.

        **Mudar `cleaning_fee_cents` ou `capacity` não reescreve o passado**:
        orçamento e reserva já emitidos guardam o valor que usaram
        (`reservations.cleaning_cents`, `reservation_nights.price_cents`). A
        alteração vale do próximo cálculo em diante.
      x-rbac: { recurso: inventory, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProdutoAtualizar" }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Produto" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: |
            `RESOURCE_IN_USE` — a mudança de `consumes` alcança uma estadia viva
            (`hold`, `confirmed` ou `checked_in`) que ainda não terminou.
            `details` traz `live_reservations[]`, com `code`, `check_in`,
            `check_out` e `unit_codes`.

            Medido em 26/08/2026, antes da guarda: a Completa vendida por
            R$ 20.200,00 teve `consumes` trocado de `all_members` para
            `one_member` com `200`; a venda seguinte da casa inteira saiu com UMA
            unidade pelo preço das oito, e as outras sete foram vendidas a
            terceiros nas mesmas datas. A troca inversa (`one_member` →
            `all_members`) quebra a invariante do outro lado: a estadia passa a
            ocupar 1 unidade num produto que declara consumir 4.

            `CODE_IN_USE` — outro produto da propriedade já usa esse `code`.
          $ref: "#/components/responses/Erro"
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      tags: [Inventário]
      summary: Desativa o produto
      description: |
        Desativação (`active = false`), não remoção: produto referenciado por
        reserva ou por tarifa não pode sumir sem levar o histórico junto. Produto
        inativo não aparece na disponibilidade nem aceita venda nova, e as
        reservas antigas continuam legíveis.
      x-rbac: { recurso: inventory, acao: excluir }
      responses:
        "204": { description: Desativado }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: |
            `RESOURCE_IN_USE` — há reserva ativa (`hold`, `confirmed` ou
            `checked_in`) neste produto (`details.reservations_count`). Encerre-as
            antes.
          $ref: "#/components/responses/Erro"

  /unit-types/{id}/members:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Inventário]
      summary: Composição do produto — quais unidades ele consome
      description: |
        Sempre devolvido **ordenado por `units.code`**. Não é estética: é a mesma
        ordem em que o servidor insere as linhas de `stay_blocks`, e ordens
        divergentes entre duas transações concorrentes causam deadlock (db.md §1).
      x-rbac: { recurso: inventory, acao: ver }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UnidadeDaComposicao" }
        "404": { $ref: "#/components/responses/Erro" }
    put:
      tags: [Inventário]
      summary: Substitui a composição do produto
      description: |
        **Substitui**, não acumula: o que não vier no corpo deixa de fazer parte.
        É `DELETE` + `INSERT` na mesma transação, então a tela manda o estado
        inteiro da grade sem precisar calcular diferença — mesma forma do
        `PUT /roles/{id}/permissions`.

        Regras:

        - Lista vazia é recusada (`422`): produto sem composição não pode ser
          vendido, e um produto vendável sem unidade é um overbooking silencioso.
        - Unidade repetida no corpo é recusada (`422`, com o índice em `details`):
          a chave é `(unit_type_id, unit_id)`.
        - Reenviar o **mesmo conjunto** é no-op e responde `200`, inclusive em
          outra ordem. Sem isso um produto vendido ficaria integralmente
          imutável e a tela não conseguiria salvar um formulário que ninguém
          tocou.

        ## A composição É validada contra as reservas vivas (`409`)

        Este parágrafo substitui o que o contrato dizia até 26/08/2026 — que a
        composição "não é validada contra reservas futuras nesta fase", porque
        as reservas antigas apontam para `reservation_units`, que é snapshot. O
        raciocínio estava errado, e foi ele que autorizou por escrito o defeito
        crítico da Fase 1. O perigo nunca foi a reserva antiga PERDER unidades:

        - **Unidade acrescentada** fica livre dentro das datas de uma estadia
          exclusiva já vendida. Medido em 26/08/2026: a Completa vendida de 10 a
          13/05 com 8 unidades, `AP-99` acrescentado à composição, e
          `POST /reservations` do apto-2s conseguiu vender `AP-99` para a noite
          de 11/05 — um estranho dormindo dentro da casa alugada inteira. A
          `EXCLUDE` não impede isso porque não existe linha de `stay_blocks`
          para `AP-99`: constraint não enxerga ausência de linha.
        - **Unidade removida** faz a PRÓXIMA venda do produto entregar a menos
          pelo mesmo preço. Medido: composição encolhida para 7, venda seguinte
          emitida com 7 unidades e o total das 8.

        A regra, por tipo de consumo:

        | `consumes` | acrescentar unidade | remover unidade |
        |---|---|---|
        | `all_members` | **`409 RESOURCE_IN_USE`** | **`409 RESOURCE_IN_USE`** |
        | `one_member` | permitido | **`409`** só se a unidade estiver ocupada por estadia viva do produto |

        Em `one_member` a venda escolheu **uma** unidade no ato e a segurou;
        crescer o pool não muda o que ela segura. Recusar toda adição travaria a
        casa — o apto-2s quase sempre tem venda viva, e ninguém jamais
        conseguiria acrescentar um apartamento. O que se recusa ali é só tirar a
        unidade que a estadia ocupa.

        Recusar, e não propagar: propagar resolveria a adição e não a remoção,
        onde significaria APAGAR bloco de estadia vendida — exatamente o que o
        `ON DELETE RESTRICT` de `stay_blocks` existe para impedir. O custo cai
        sobre o evento raro (cadastro) e não sobre o normal (venda).

        O `409` **nomeia as reservas e as datas** para a saída ser acionável:
        `details` traz `adding_unit_codes`, `removing_unit_codes`,
        `reservations_count` e `live_reservations[]` (com `code`, `check_in`,
        `check_out`, `unit_codes`). Sem isso a recusa vira "tente de novo mais
        tarde" e o operador não sabe qual reserva remarcar.

        A mesma guarda vale para `consumes` em `PATCH /unit-types/{id}` e
        `PUT /unit-types/{id}` — trocar `all_members` → `one_member` com venda
        viva entrega um apartamento a quem pagou pela casa inteira, e a troca
        inversa quebra a invariante ao contrário.
      x-rbac: { recurso: inventory, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unit_ids]
              properties:
                unit_ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Composição aplicada, como ficou gravada (ordenada por `code`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UnidadeDaComposicao" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: |
            `RESOURCE_IN_USE` — a mudança de composição alcança uma estadia viva
            (`hold`, `confirmed` ou `checked_in`) que ainda não terminou. `details`:
            `adding_unit_codes`, `removing_unit_codes`, `reservations_count` e
            `live_reservations[]` com `code`, `check_in`, `check_out` e `unit_codes`.
          $ref: "#/components/responses/Erro"
        "422":
          description: "`VALIDATION_ERROR` — lista vazia, unidade repetida ou unidade de outra propriedade."
          $ref: "#/components/responses/Erro"

  /units:
    get:
      tags: [Inventário]
