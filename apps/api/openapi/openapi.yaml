        o histórico está congelado em `reservation_nights`. Sem a célula, a
        noite daquele tipo passa a devolver `422 RATE_NOT_FOUND` no próximo
        orçamento, que é o comportamento correto: melhor recusar do que vender
        por um valor inventado.
      x-rbac: { recurso: settings, acao: excluir }
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }

  /holidays:
    get:
      tags: [Tarifário]
