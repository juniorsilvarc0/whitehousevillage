                  - $ref: "#/components/schemas/Paginacao"
        "403": { $ref: "#/components/responses/Erro" }
    post:
      tags: [Tarifário]
      summary: Cria uma tarifa
      x-rbac: { recurso: settings, acao: criar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TarifaEntrada" }
      responses:
        "201":
          description: Criada
          headers:
            Location:
              description: URI do recurso criado.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Tarifa" }
        "409":
          description: "`CODE_IN_USE` — já há tarifa para esse `(rate_table_id, unit_type_id, date_type)`. Use `PATCH` ou `POST /rates/bulk`."
          $ref: "#/components/responses/Erro"
        "422": { $ref: "#/components/responses/Erro" }

  /rates/bulk:
    post:
      tags: [Tarifário]
      summary: Substitui a grade dos produtos enviados, numa transação
      description: |
        A tela do tarifário é uma grade produto × tipo de data. Salvar célula a
        célula seriam 24 requisições que podem falhar pela metade e deixar a
        tabela comercial num estado que nunca existiu no papel. Aqui é **uma
        transação**: ou a grade inteira entra, ou nada entra.

        ## O raio de ação é o produto, não a tabela

        A substituição é **escopada aos produtos citados na chamada**. Para cada
        produto em `unit_type_ids`, as células daquele produto nesta tabela
        passam a ser exatamente as que vieram em `rates` — as demais são
        removidas. Produto **fora** de `unit_type_ids` não é tocado: a tarifa
        dele continua exatamente como estava.

        Isto é uma **correção de contrato**, e a redação anterior ("o par que não
        vier no corpo é removido da tabela") era o defeito. Medido em 26/08/2026,
        contra Postgres real: salvar a grade de um único produto (6 células)
        apagou as 18 células dos outros três — `rates` foi de 24 linhas para 6 —
        e a venda deles passou a responder `422 RATE_NOT_FOUND` enquanto
        `GET /availability` continuava anunciando `available: 1` com
        `price_cents: null`. A tela oferecia o que a venda ia recusar, e ninguém
        pediu para apagar nada.

        A tela do tarifário salva um produto por vez ou a grade toda; nos dois
        casos ela manda os produtos que editou, e é esse o escopo. Nenhuma
        chamada apaga preço de produto que o operador não abriu.

        ## Zerar um produto é ato explícito

        Citar o produto em `unit_type_ids` e **não** mandar nenhuma célula dele é
        o jeito — o único — de deixá-lo sem tarifa. É deliberado que apagar exija
        nomear o alvo: remoção nunca deve ser consequência de omissão. Produto
        sem tarifa some da venda (`RATE_NOT_FOUND`) e some da oferta
        (`GET /availability` devolve `available: 0` com
        `unavailable_reason: sem_tarifa`).

        ## O caminho comum continua sem cerimônia

        `unit_type_ids` **ausente** vale como "os produtos distintos que aparecem
        em `rates`". A tela que salva a grade toda manda o mesmo corpo de sempre
        e ganha a semântica nova de graça; só quem zera um produto precisa
        escrever a lista.

        Não reescreve nada já emitido: reservas guardam `rate_table_id` e o preço
        de cada noite em `reservation_nights`.
      x-rbac: { recurso: settings, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GradeParaSalvar" }
      responses:
        "200":
          description: |
            Grade aplicada. `data` é a tabela inteira como ficou gravada
            (inclusive os produtos que esta chamada não tocou — é o estado que a
            tela redesenha), e `meta` diz o que a chamada efetivamente fez.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Tarifa" }
                  meta: { $ref: "#/components/schemas/MetaDaGrade" }
        "404":
          description: "`NOT_FOUND` — `rate_table_id` inexistente nesta propriedade."
          $ref: "#/components/responses/Erro"
        "422":
          description: |
            `VALIDATION_ERROR` — par `(unit_type_id, date_type)` repetido no
            corpo (o índice vem em `details.rates`), `date_type` fora do
            vocabulário, `amount_cents` não positivo, `unit_type_id` que não
            existe nesta propriedade, ou célula cujo `unit_type_id` **não está**
            em `unit_type_ids` (o índice vem em `details.rates`) — mandar preço
            de um produto fora do escopo declarado é erro de cliente, não licença
            para ampliar o escopo em silêncio.
          $ref: "#/components/responses/Erro"

  /rates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
