    post:
      tags: [Tarifário]
      summary: Cria um período especial
      description: |
        `name` carrega o ano (`Réveillon 2026/2027`) porque é chave natural
        (`UNIQUE (property_id, name)`): o Réveillon do ano seguinte é linha nova,
        não edição desta.

        O intervalo é **inclusivo nas duas pontas** (`starts_on`..`ends_on`) —
        diferente da estadia, que é half-open. Período é uma faixa do calendário
        comercial, não uma ocupação: 28/12 a 02/01 classifica as seis datas,
        inclusive 02/01.
      x-rbac: { recurso: settings, acao: criar }
      requestBody:
