      responses:
        "201":
          description: Criada
          headers:
            Location:
              description: URI do recurso criado.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MinimoDeNoites" }
        "409":
          description: "`CODE_IN_USE` — já há regra para esse `(rate_table_id, date_type)`."
          $ref: "#/components/responses/Erro"
        "422": { $ref: "#/components/responses/Erro" }

  /min-nights/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Tarifário]
      summary: Detalhe da regra de estadia mínima
      x-rbac: { recurso: settings, acao: ver }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MinimoDeNoites" }
        "404": { $ref: "#/components/responses/Erro" }
    put:
      tags: [Tarifário]
      summary: Substitui a regra de estadia mínima
      x-rbac: { recurso: settings, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MinimoDeNoitesEntrada" }
      responses:
        "200":
          description: Substituída
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MinimoDeNoites" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    patch:
      tags: [Tarifário]
      summary: Atualiza a regra de estadia mínima
      description: |
        Aumentar o mínimo **não invalida reserva já emitida** — a validação
        acontece na emissão, e a reserva antiga continua válida com as noites que
        tinha.
      x-rbac: { recurso: settings, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MinimoDeNoitesAtualizar" }
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MinimoDeNoites" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      tags: [Tarifário]
      summary: Remove a regra de estadia mínima
      description: Sem regra para o tipo de data, o mínimo daquele tipo é 1 noite.
      x-rbac: { recurso: settings, acao: excluir }
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }

  /policies/commercial:
    get:
      tags: [Tarifário]
      summary: Política comercial vigente
      description: |
        Sem `version`, devolve a **vigente**: maior `version` com
        `valid_from <= hoje`. Com `version`, devolve aquela versão exata — é como
        a tela de uma reserva antiga mostra a política que ela congelou em
        `reservations.policy_version`.
      x-rbac: { recurso: settings, acao: ver }
      parameters:
        - name: version
          in: query
          schema: { type: integer, minimum: 1 }
          description: Lê uma versão específica em vez da vigente.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PoliticaComercial" }
        "404": { $ref: "#/components/responses/Erro" }
    put:
      tags: [Tarifário]
      summary: Publica uma nova versão da política comercial
      description: |
        **`PUT` cria versão nova; nunca edita a vigente.** O servidor atribui
        `version = max(version) + 1` e ignora qualquer `version` que venha no
        corpo. Editar a linha vigente reescreveria a regra sob os pés das
        reservas que congelaram aquele número — que é justamente o que
        `reservations.policy_version` existe para impedir.

        Por isso não há `PATCH` nem `DELETE` aqui: política é histórico, não
        cadastro. Voltar atrás é publicar de novo a versão antiga, que entra como
        versão nova e deixa rastro.
      x-rbac: { recurso: settings, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoliticaComercialEntrada" }
      responses:
        "201":
          description: Versão nova publicada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PoliticaComercial" }
        "409":
          description: |
            `POLICY_IMMUTABLE` — o corpo trouxe `version` de uma política já
            publicada, ou `valid_from` anterior ao da vigente. Versão publicada
            não se reescreve nem se antedata.
          $ref: "#/components/responses/Erro"
        "422":
          description: "`VALIDATION_ERROR` — `discount_approval_pct` menor que `discount_auto_pct`, percentual fora de 0–100 ou `hold_hours` não positivo."
          $ref: "#/components/responses/Erro"

  /policies/cancellation:
    get:
      tags: [Tarifário]
      summary: Política de cancelamento vigente, com as faixas
      description: |
        As faixas vêm ordenadas por `sort_order`, da mais generosa à mais
        restritiva — é nessa ordem que o motor (`booking.CancellationPolicy`)
        procura a primeira faixa aplicável.
      x-rbac: { recurso: settings, acao: ver }
      parameters:
        - name: version
          in: query
          schema: { type: integer, minimum: 1 }
          description: Lê uma versão específica — a que a reserva congelou em `cancellation_policy_id`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PoliticaDeCancelamento" }
        "404": { $ref: "#/components/responses/Erro" }
    put:
      tags: [Tarifário]
      summary: Publica uma nova versão da política de cancelamento
      description: |
        **Cria versão nova com as faixas inteiras; nunca edita a vigente.** As
        faixas vêm no mesmo corpo e substituem integralmente — não existe
        endpoint de faixa avulsa, porque uma faixa sozinha não é uma política:
        deixar um buraco entre `days_before_max` de uma e `days_before_min` da
        seguinte faria o motor cair no caso "sem faixa aplicável" e reter tudo
        por omissão.

        Reserva já emitida não muda: ela aponta para `cancellation_policy_id`, a
        versão que estava vigente quando foi criada.
      x-rbac: { recurso: settings, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoliticaDeCancelamentoEntrada" }
      responses:
        "201":
          description: Versão nova publicada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PoliticaDeCancelamento" }
        "409":
          description: "`POLICY_IMMUTABLE` — tentativa de reescrever versão já publicada."
          $ref: "#/components/responses/Erro"
        "422":
          description: |
            `VALIDATION_ERROR` — lista de faixas vazia, `sort_order` repetido
            (chave natural `UNIQUE (policy_id, sort_order)`), `refund_pct` fora
            de 0–100 ou faixas que se sobrepõem.
          $ref: "#/components/responses/Erro"

  # ════════════════════════════════════════════════════════════════════
  # Disponibilidade e orçamento — módulo `disponibilidade`.
  # ════════════════════════════════════════════════════════════════════

  /availability:
    get:
      tags: [Disponibilidade]
      summary: Por produto, quantas unidades vendáveis em cada dia
      description: |
        A visão comercial: "dá para vender?". E a resposta tem de ser a mesma que
        a venda daria.

        ## `available` conta o que a venda aceita

        Um dia entra na conta quando a unidade está **livre e vendável**: sem
        `stay_block` de status `hold` ou `confirmed` naquele dia, unidade ativa,
        e com tarifa cadastrada para o tipo de data na tabela vigente. Faltando
        qualquer uma das três, `available` é 0 e `unavailable_reason` diz qual.

        **`completed` NÃO entra neste predicado**, e a versão anterior deste
        texto errava duas vezes ao dizer que entrava. Primeiro porque o estado
        terminal do bloco se chama `completed` no banco (o CHECK da migration
        `20260826120000` é `hold|confirmed|completed|cancelled|expired`), e
        `checked_out` é o nome de um estado da RESERVA. Segundo, e mais grave,
        porque somar o estado terminal ao predicado de VENDA fecharia para sempre
        a noite de uma estadia já cumprida: depois do check-out a data volta ao
        estoque, que é a razão de `completed` estar fora do `WHERE` da constraint
        `stay_no_overlap`. Este predicado é o da venda; o do MAPA é outro
        (`hold, confirmed, completed`) e está em `GET /availability/units`.

        A terceira condição é correção medida, não zelo: em 26/08/2026, com a
        tarifa da Cobertura apagada, esta rota devolvia `available: 1` com
        `price_cents: null` para 20, 21 e 22/09 enquanto `POST /quotes` nas
        mesmas datas respondia `422 RATE_NOT_FOUND`. A tela oferecia o que a
        venda recusava — e quem descobre isso é o hóspede ao telefone.

        **A White House Completa só é livre quando TODAS as unidades estão** —
        `available` é 0 ou 1, nunca um número intermediário, porque ela consome
        as oito (`consumes = all_members`). Vender apartamento hoje é fechar a
        Completa nessa data, e o mapa precisa dizer isso antes de a gestão
        prometer a casa a um evento. Composição incompleta (unidade membro
        inativa) zera a Completa em **todos** os dias, com
        `unavailable_reason: composicao_incompleta` — a mesma condição que a
        venda recusa com `422 COMPOSITION_INCOMPLETE`.

        O intervalo é half-open: `from` entra, `to` **não**. Pedir `from=2026-12-20`
        e `to=2026-12-23` devolve as noites 20, 21 e 22 — as mesmas três que
        seriam cobradas.

        Esta rota **não bloqueia nada**. Entre a consulta e a gravação a data
        pode ser tomada; a defesa contra isso é a constraint do banco, não esta
        resposta.
      x-rbac: { recurso: calendar, acao: ver }
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to,   in: query, required: true, schema: { type: string, format: date }, description: "Exclusivo." }
        - name: unit_type_id
          in: query
          schema: { type: string, format: uuid }
          description: Ausente traz todos os produtos ativos.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DisponibilidadeDoProduto" }
        "422":
          description: "`VALIDATION_ERROR` — `to` não é posterior a `from`, ou a janela excede 366 dias."
          $ref: "#/components/responses/Erro"

  /availability/units:
    get:
      tags: [Disponibilidade]
      summary: Matriz unidade × dia — a fonte do mapa de ocupação
      description: |
        A visão operacional: "quem está onde?". Uma linha por unidade física,
        uma célula por dia, na ordem de `units.code`.

        A célula não traz preço: preço é do **produto**, não da unidade — a mesma
        `AP-01` custa uma coisa vendida como Apartamento 2 Suítes e outra dentro
        da White House Completa. Quem quer valor consulta `/availability` ou
        `POST /quotes`.
      x-rbac: { recurso: calendar, acao: ver }
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to,   in: query, required: true, schema: { type: string, format: date }, description: "Exclusivo." }
        - name: unit_id
          in: query
          schema: { type: string, format: uuid }
          description: Ausente traz todas as unidades ativas.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LinhaDoMapa" }
        "422": { $ref: "#/components/responses/Erro" }

  /quotes:
    post:
      tags: [Disponibilidade]
      summary: Calcula o orçamento — não bloqueia data
      description: |
        Roda o motor puro `internal/domain/booking` sobre a tabela de tarifas e a
        política **vigentes na data de hoje**, e devolve o cálculo inteiro aberto:
        cada noite com seu tipo e preço, as linhas agrupadas por tipo de tarifa,
        subtotal, desconto, limpeza, total, sinal, saldo, mínimo de noites e a
        alçada do desconto.

        Três regras que a resposta materializa:

        - **O desconto incide só sobre as diárias**, nunca sobre a limpeza nem
          sobre a caução de evento.
        - **`total = subtotal − desconto + limpeza + caução`**, e o
          arredondamento acontece no total, nunca noite a noite.
        - **`deposit_cents` é o sinal** (`total × deposit_pct` da política) e
          `balance_cents` é o resto, vencendo `balance_due_days` antes do
          check-in.

        Não grava nada e **não segura a data** — só a pré-reserva
        (`POST /reservations`) insere em `stay_blocks`. Por isso um orçamento
        pode virar `409 DATE_CONFLICT` na hora de virar reserva, e isso é
        correto, não um defeito.

        O corpo aceita `rate_table_id` e `policy_version` explícitos para
        reproduzir um orçamento antigo centavo a centavo; ausentes, valem os
        vigentes.
      x-rbac: { recurso: quotes, acao: criar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoDeOrcamento" }
      responses:
        "200":
          description: Orçamento calculado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Orcamento" }
        "404":
          description: "`NOT_FOUND` — produto, tabela de tarifas ou política inexistente."
          $ref: "#/components/responses/Erro"
        "422":
          description: |
            Vem do motor, com o código estável do `booking.RuleError`:

            - `VALIDATION_ERROR` — `check_out` não é posterior a `check_in`, `guests_count < 1`, ou campo desconhecido no corpo.
            - `CAPACITY_EXCEEDED` — hóspedes acima da capacidade do produto (`details.capacity`, `details.requested`).
            - `MIN_STAY_NOT_MET` — noites abaixo do mínimo do período (`details.required`, `details.requested`).
            - `DISCOUNT_ABOVE_LIMIT` — desconto acima da alçada (`details.requested_pct`, `details.max_pct`).
            - `RATE_NOT_FOUND` — a tabela vigente não tem tarifa para algum tipo de data da estadia (`details.date`, `details.date_type`).
            - `COMPOSITION_INCOMPLETE` — a composição do produto não pode ser entregue (veja `POST /reservations`). Orçar o que não se pode vender é prometer.
          $ref: "#/components/responses/Erro"

  # ════════════════════════════════════════════════════════════════════
  # Reservas — módulo `reservas`.
  #
  # MÁQUINA DE ESTADOS
  #
  #   quote → hold → confirmed → checked_in → checked_out → closed
  #             │        │            │
  #             │        │            └─────────────► no_show
  #             ├────────┴──────────────────────────► cancelled
  #             └── 48 h sem sinal (job) ───────────► expired
  #
  # | estado       | como se chega                      | bloqueia calendário |
  # |--------------|------------------------------------|---------------------|
  # | quote        | orçamento salvo, sem data segurada  | não                 |
  # | hold         | POST /reservations                  | SIM                 |
  # | confirmed    | POST /confirm (sinal registrado)    | SIM                 |
  # | checked_in   | POST /check-in                      | SIM                 |
  # | checked_out  | POST /check-out                     | não                 |
  # | closed       | acerto financeiro (fora da Fase 1)  | não                 |
  # | cancelled    | POST /cancel                        | não                 |
  # | expired      | job de expiração do hold            | não                 |
  # | no_show      | POST /cancel com reason=no_show     | não                 |
  #
  # "Bloqueia o calendário" NÃO é um campo da reserva: é o status das linhas de
  # `stay_blocks` (`hold`/`confirmed`), que é o que a constraint parcial
  # `stay_no_overlap` enxerga. Cancelar leva essas linhas a `cancelled`, o job de
  # expiração a `expired` e o check-out a `checked_out` — os três liberam a data,
  # e os três preservam a linha. O check-out tem estado próprio porque estadia
  # cumprida continua no mapa, e ocupação desfeita não.
  #
  # Transição fora do desenho é `409 INVALID_STATE_TRANSITION`, com o estado
  # atual e os permitidos em `details`.
  # ════════════════════════════════════════════════════════════════════

  /reservations:
    get:
      tags: [Reservas]
      summary: Lista reservas
      x-rbac: { recurso: reservations, acao: ver }
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - name: status
          in: query
          schema: { type: string, example: "hold,confirmed" }
          description: Um ou mais estados separados por vírgula. Ausente traz todos.
        - { name: from, in: query, schema: { type: string, format: date }, description: "Reservas que tocam o intervalo `[from, to)`." }
        - { name: to,   in: query, schema: { type: string, format: date } }
        - { name: q,    in: query, schema: { type: string }, description: "Busca por `code` da reserva ou nome do contato." }
        - { name: unit_type_id, in: query, schema: { type: string, format: uuid } }
        - { name: contact_id,   in: query, schema: { type: string, format: uuid } }
        - { name: broker_id,    in: query, schema: { type: string, format: uuid } }
        - name: sort
          in: query
          schema: { type: string, default: -created_at, enum: [check_in, -check_in, created_at, -created_at, code, -code] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Reserva" }
                  - $ref: "#/components/schemas/Paginacao"
        "403": { $ref: "#/components/responses/Erro" }
    post:
      tags: [Reservas]
      summary: Cria a pré-reserva (hold) e aloca a(s) unidade(s)
      description: |
        Recalcula o orçamento do zero — o corpo manda o pedido, nunca os valores.
        Preço que chega do cliente é preço que o cliente escolheu.

        O que a criação congela, e por isso nunca mais muda:

        - `reservation_nights` — uma linha por noite com `date_type` e
          `price_cents` aplicados;
        - `rate_table_id`, `policy_version` e `cancellation_policy_id` na reserva;
        - `subtotal_cents`, `discount_cents`, `cleaning_cents`,
          `event_deposit_cents`, `total_cents` e `deposit_cents`.

        A alocação da unidade é automática: entre as unidades livres da
        composição, vence a que **menos fragmenta o calendário** (menor sobra
        entre as reservas vizinhas), com desempate pelo `code`. Produto
        `all_members` não escolhe — insere as oito.

        ## Exclusividade da Completa: a composição inteira, ou nada

        Vender um produto `all_members` exige **todas** as unidades da composição
        (`unit_type_members`), sem exceção. Se qualquer unidade membro estiver
        **inativa**, a venda é recusada com `422 COMPOSITION_INCOMPLETE` — não se
        entrega 7 de 8 cobrando a casa cheia.

        Sem esta regra o defeito não é "hóspede recebe menos": é **estranho
        dentro da casa alugada inteira**. Medido em 26/08/2026, com `AP-03`
        inativa: `WH-2026-0002` vendeu a White House Completa (capacidade 24,
        R$ 5.500/noite) alocando 7 unidades, e `AP-03` — que não recebeu
        `stay_block` nenhum — foi vendida logo em seguida como Apartamento 2
        Suítes a outro hóspede (`WH-2026-0003`), na mesma noite, dentro da mesma
        casa. A constraint do banco não pega isso: ela impede duas linhas
        sobrepostas na mesma unidade, e aqui a oitava linha simplesmente nunca
        foi inserida.

        Por isso o código é `422` e não `409`: a data não está em disputa, e
        nenhuma outra data resolve. O produto está mal configurado, e quem
        precisa agir é a gestão do inventário, não o hóspede.

        `details` traz `unit_type_code`, `expected_units` (o tamanho da
        composição), `active_units` e `missing_unit_codes` — a tela mostra
        exatamente qual unidade reativar.

        A mesma recusa vale para produto `one_member` cuja composição não tem
        **nenhuma** unidade ativa. Aí também não há o que entregar, e devolver
        `409 DATE_CONFLICT` mandaria o operador tentar outra data para sempre.

        As linhas de `stay_blocks` são inseridas **em ordem de `units.code`**.
        Não é preferência de estilo: duas transações inserindo subconjuntos em
        ordens opostas se travam mutuamente (deadlock).

        Não há `SELECT` de disponibilidade antes do `INSERT`. Quem decide se a
        data está livre é a constraint `stay_no_overlap`; a violação `23P01`
        vira `409 DATE_CONFLICT` — nunca `500`, nunca retry automático.

        O `hold` nasce com `hold_expires_at = now() + hold_hours` da política
        (48 h por padrão). Um job expira o que vencer, libera as unidades e
        registra o evento.
      x-rbac: { recurso: reservations, acao: criar }
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 255 }
          description: |
            Obrigatório: criar reserva é ato irreversível sob concorrência. A
            mesma chave, **do mesmo ator**, com o mesmo corpo devolve a resposta
            original (mesmo `201`, mesma reserva); com corpo diferente devolve
            `409 IDEMPOTENCY_MISMATCH`.

            **A chave é escopada pelo ator.** O registro de idempotência é
            `(usuário autenticado, rota, chave)`, nunca `(rota, chave)`: a chave
            é escolhida pelo cliente, e "reserva-1" é escolha óbvia de dois
            operadores no mesmo dia. Chave repetida por **outro** usuário é
            requisição nova — não é replay, não é `IDEMPOTENCY_MISMATCH`, e
            jamais devolve a resposta guardada do primeiro.

            Sem o escopo, a idempotência vira desvio de autorização de leitura.
            Medido em 26/08/2026: o admin criou `WH-2026-0004` com
            `Idempotency-Key: reserva-1`; o corretor mandou a mesma chave e
            recebeu `200` com a reserva **do admin** por inteiro — id, código,
            unidades e bloco — a mesma reserva que `GET /reservations/{id}`
            devolve a ele como `404`, porque o escopo `own` do perfil dele não
            alcança reserva de outro dono. O cache de idempotência entregou pelo
            `POST` o que o `GET` protege.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservaCriar" }
      responses:
        "201":
          description: Pré-reserva criada
          headers:
            Location:
              description: URI do recurso criado.
              schema: { type: string, example: /api/v1/reservations/9f1c1e2a-0d3b-4f6a-9a1e-2b7c5d8e0f11 }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Reserva" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: |
            `DATE_CONFLICT` — alguma unidade do produto ficou ocupada entre a
            consulta e a gravação; `details.unit_code` e `details.period` dizem
            qual e quando. Vem da constraint de exclusão do banco, que é o que
            torna overbooking impossível mesmo sob concorrência.

            `IDEMPOTENCY_MISMATCH` — a chave já foi usada com outro corpo.
          $ref: "#/components/responses/Erro"
        "422":
          description: |
            `VALIDATION_ERROR`, `CAPACITY_EXCEEDED`, `MIN_STAY_NOT_MET`,
            `DISCOUNT_ABOVE_LIMIT` ou `RATE_NOT_FOUND` — as mesmas regras de
            `POST /quotes`, aplicadas pelo mesmo motor.

            `COMPOSITION_INCOMPLETE` — a composição do produto não pode ser
            entregue inteira: produto `all_members` com unidade membro inativa,
            ou produto sem nenhuma unidade ativa. `details`: `unit_type_code`,
            `expected_units`, `active_units`, `missing_unit_codes`.
          $ref: "#/components/responses/Erro"

  /reservations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Reservas]
      summary: Detalhe da reserva
      x-rbac: { recurso: reservations, acao: ver }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Reserva" }
        "404": { $ref: "#/components/responses/Erro" }
    put:
      tags: [Reservas]
      summary: Substitui os dados editáveis da reserva
      description: |
        Substituição integral do **cadastro** da reserva: campo opcional ausente
        volta ao padrão.

        `PUT` e `PATCH` **não** mexem em datas, produto nem preço. Mudar estadia
        é `POST /reservations/{id}/reschedule`, que recalcula, cobra a diferença
        e preserva o histórico; mudar unidade é `reassign-unit`; mudar estado é a
        ação correspondente. Deixar datas editáveis aqui seria um caminho para
        alterar `stay_blocks` sem passar pela constraint — e sem gravar a
        remarcação em lugar nenhum.
      x-rbac: { recurso: reservations, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservaAtualizar" }
      responses:
        "200":
          description: Substituída
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Reserva" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422":
          description: "`VALIDATION_ERROR` — inclusive `guests_count` acima da capacidade do produto (`CAPACITY_EXCEEDED`)."
          $ref: "#/components/responses/Erro"
    patch:
      tags: [Reservas]
      summary: Atualiza a reserva
      description: Campo ausente não muda nada; campo com `null` limpa. Mesmas restrições do `PUT`.
      x-rbac: { recurso: reservations, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservaAtualizar" }
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Reserva" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      tags: [Reservas]
      summary: Descarta a reserva ainda em `quote`
      description: |
        Só apaga o que nunca existiu comercialmente: reserva em `quote`, que não
        tem `stay_block`, não tem sinal e não entrou no razão.

        A partir de `hold` a resposta é `409 INVALID_STATE_TRANSITION` apontando
        `/cancel`: apagar reserva quebra o razão e some com a prova de quem
        segurou a data (db.md §Convenções — soft delete só onde há histórico).
      x-rbac: { recurso: reservations, acao: excluir }
      responses:
        "204": { description: Descartada }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`INVALID_STATE_TRANSITION` — a reserva já saiu de `quote`; use `POST /reservations/{id}/cancel`."
          $ref: "#/components/responses/Erro"

  /reservations/{id}/full:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Reservas]
      summary: Monta a tela da reserva numa chamada
      description: |
        Reserva + noites + unidades + hóspedes + linha do tempo. Existe pelo
        mesmo motivo do `/full` do CRM: a tela precisa de cinco consultas, e cinco
        chamadas encadeadas do navegador significam cinco chances de mostrar
        meia tela — além de um estado intermediário em que as noites já vieram e
        os totais ainda não.

        A `timeline` é `reservation_events`, que é **append-only**: criação,
        confirmação, extensão de hold, realocação de unidade, remarcação,
        check-in, check-out e cancelamento entram como linhas, ninguém edita.
      x-rbac: { recurso: reservations, acao: ver }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ReservaCompleta" }
        "404": { $ref: "#/components/responses/Erro" }

  /reservations/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Reservas]
      summary: Registra o sinal e confirma a reserva
      description: |
        `hold → confirmed`. Numa transação: grava o evento do sinal, marca
        `confirmed_at`, zera `hold_expires_at` e promove as linhas de
        `stay_blocks` de `hold` para `confirmed`. A data continua bloqueada — o
        que muda é que ela deixa de ter prazo de validade.

        ## `deposit_paid_cents` é validado contra o total da reserva

        Ausente significa "recebeu o sinal cheio" e assume `deposit_cents`.
        Presente, tem de estar em **`1 ≤ deposit_paid_cents ≤ total_cents`** —
        fora disso é `422 VALIDATION_ERROR`, com `details.field`,
        `details.total_cents` e `details.max_cents`.

        O teto é o **total**, e não o sinal: hóspede que paga a estadia inteira
        adiantada é caso comum, e recusar isso obrigaria a gestão a mentir o
        valor. O piso é 1: confirmar com zero é dizer "recebi nada e a data está
        vendida", que é precisamente o que `hold` já faz, com prazo.

        Não é validação decorativa. O valor recebido é a **base da devolução** na
        política de cancelamento, e sem teto ele vira dinheiro inventado. Medido
        em 26/08/2026: `WH-2026-0001`, total R$ 1.880,00, aceitou
        `deposit_paid_cents: 9999999999` (R$ 99.999.999,99) e respondeu `200`;
        `POST /cancel?dry_run=1` na sequência prometeu ao hóspede
        `refund_cents: 5000000000` — **R$ 50.000.000,00 de reembolso** sobre uma
        diária de fim de semana, com a retenção de 50% calculada certinho sobre a
        base errada.

        **Fase 1 não gera recebível nem comissão**: `receivables`, `payables` e
        `commissions` entram com o módulo financeiro. Até lá o pagamento vive em
        `reservation_events`, e é dali que `/cancel` lê o sinal pago.

        Hold vencido responde `409 HOLD_EXPIRED` — as unidades já foram
        liberadas, e confirmar por cima seria vender uma data que talvez já tenha
        outro dono.
      x-rbac: { recurso: reservations, acao: editar }
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 255 }
          description: |
            Obrigatório — confirma dinheiro recebido (CLAUDE.md §Convenções de
            API). Escopada pelo ator, como em `POST /reservations`: o registro é
            `(usuário autenticado, rota, chave)`. Repetir a chave de outro
            usuário é requisição nova, nunca o replay da confirmação alheia.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmacaoDeReserva" }
      responses:
        "200":
          description: Confirmada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Reserva" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: |
            `HOLD_EXPIRED` — a pré-reserva venceu antes do sinal.
            `INVALID_STATE_TRANSITION` — a reserva não está em `hold`.
            `DATE_CONFLICT` — a data foi tomada enquanto o hold estava vencido.
            `IDEMPOTENCY_MISMATCH` — chave reutilizada com outro corpo.
          $ref: "#/components/responses/Erro"
        "422":
          description: |
            `VALIDATION_ERROR` — `deposit_paid_cents` fora de
            `[1, total_cents]` (`details.total_cents`, `details.max_cents`),
            `method` fora do vocabulário, ou campo desconhecido no corpo.
          $ref: "#/components/responses/Erro"

  /reservations/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Reservas]
      summary: Cancela aplicando a política congelada na reserva
      description: |
        Aplica a faixa da **política que a reserva congelou**
        (`cancellation_policy_id`), calculada sobre o sinal efetivamente pago e a
        antecedência em dias até o `check_in`, no fuso `America/Fortaleza`.
        Publicar uma política nova amanhã não altera o cancelamento de hoje.

        `?dry_run=1` calcula e devolve o mesmo corpo **sem executar nada** — é o
        que a tela mostra antes de a gestão confirmar. `dry_run` na resposta diz
        qual dos dois aconteceu.

        Executando: a reserva vai para `cancelled`, as linhas de `stay_blocks`
        vão para `cancelled` (a data libera, o histórico fica) e o evento entra
        na timeline com o motivo.

        `reason: "no_show"` é o caso especial: a reserva termina em **`no_show`**,
        não em `cancelled`, e a faixa aplicada é a de menor antecedência
        (retenção integral). O estado é diferente porque a diferença importa no
        BI — hóspede que avisou e hóspede que não apareceu não são a mesma linha.

        Cancelar reserva já em `cancelled`, `expired`, `no_show`, `checked_out`
        ou `closed` é `409 RESERVATION_NOT_CANCELLABLE`.
      x-rbac: { recurso: reservations, acao: editar }
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
          description: Simula e devolve o valor de devolução sem executar.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoDeCancelamento" }
      responses:
        "200":
          description: Resultado do cancelamento (simulado ou executado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ResultadoDeCancelamento" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`RESERVATION_NOT_CANCELLABLE` — estado atual em `details.status`, estados canceláveis em `details.allowed`."
          $ref: "#/components/responses/Erro"
        "422": { $ref: "#/components/responses/Erro" }

  /reservations/{id}/reschedule:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Reservas]
      summary: Remarca a estadia preservando o histórico
      description: |
        Remarcar **não edita** a reserva: numa transação, a original vai para
        `cancelled` com `cancel_reason = "remarcacao"` e nasce uma reserva nova
        com `rebooked_from_id` apontando para ela. O código antigo continua
        existindo, o cliente continua rastreável, e o BI não perde a venda
        original.

        A nova é recalculada do zero pelo motor, com a tabela e a política
        **vigentes hoje** — e `meta.difference_cents` diz quanto falta cobrar
        (positivo) ou devolver (negativo) em relação ao total antigo.

        A nova reserva herda o estado comercial: original em `confirmed` gera
        nova em `confirmed` (o sinal acompanha); original em `hold` gera nova em
        `hold` com prazo recontado.

        As duas coisas acontecem na mesma transação, e por isso o
        `DATE_CONFLICT` da nova data não deixa a reserva antiga cancelada: ou as
        duas mudanças valem, ou nenhuma vale.
      x-rbac: { recurso: reservations, acao: editar }
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 255 }
          description: |
            Obrigatório — cria reserva e move dinheiro. Escopada pelo ator, como
            em `POST /reservations`: o registro é `(usuário autenticado, rota,
            chave)`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoDeRemarcacao" }
      responses:
        "201":
          description: Reserva nova criada; a anterior foi cancelada com motivo `remarcacao`
          headers:
            Location:
              description: URI da reserva nova.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Reserva" }
                  meta: { $ref: "#/components/schemas/MetaDaRemarcacao" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: |
            `DATE_CONFLICT` — a data nova não está livre (nada foi alterado).
            `INVALID_STATE_TRANSITION` — só `hold` e `confirmed` remarcam.
            `IDEMPOTENCY_MISMATCH` — chave reutilizada com outro corpo.
          $ref: "#/components/responses/Erro"
        "422":
          description: "As mesmas regras do orçamento: `MIN_STAY_NOT_MET`, `CAPACITY_EXCEEDED`, `DISCOUNT_ABOVE_LIMIT`, `RATE_NOT_FOUND`, `COMPOSITION_INCOMPLETE`, `VALIDATION_ERROR`. Remarcar para um produto que a casa não consegue entregar é o mesmo erro de vendê-lo pela primeira vez."
          $ref: "#/components/responses/Erro"

  /reservations/{id}/check-in:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Reservas]
      summary: Registra a entrada do hóspede
      description: |
        `confirmed → checked_in`. As linhas de `stay_blocks` **continuam**
        `confirmed`: o hóspede está dentro, a data segue bloqueada. O que muda é
        o estado comercial, e a operação passa a enxergar a estadia como em
        curso.

        O instante entra em `reservation_events` (o `at` do evento), não numa
        coluna nova de `reservations` — a tabela já nasceu acima do teto de
        colunas de `db.md`, e um evento append-only registra melhor o "quando"
        do que uma coluna que alguém pode sobrescrever.

        ## `at` é validado contra o período da reserva

        A data de `at`, resolvida no fuso da propriedade (`America/Fortaleza`),
        tem de cair em **`[check_in, check_out)`** — a mesma janela half-open das
        noites vendidas. Fora dela é `422 VALIDATION_ERROR`, com
        `details.field: at`, `details.check_in`, `details.check_out` e
        `details.at_date`.

        O limite inferior existe porque entrar antes do `check_in` é ocupar noite
        que ninguém vendeu — a unidade pode estar com outro hóspede na véspera. O
        superior é estrito porque a noite do `check_out` não pertence a esta
        reserva: quem chega nela está fazendo check-in da reserva **seguinte**.

        Sem a validação o registro aceita qualquer coisa e a timeline deixa de
        ser prova. Medido em 26/08/2026: `WH-2026-0001`, estadia de 14 a
        16/09/2026, aceitou `at: 2019-01-01T10:00:00-03:00` com `200` e gravou o
        evento `checked_in` sete anos antes da reserva existir.
      x-rbac: { recurso: reservations, acao: editar }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistroDeEstadia" }
      responses:
        "200":
          description: Check-in registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Reserva" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`INVALID_STATE_TRANSITION` — só reserva `confirmed` faz check-in."
          $ref: "#/components/responses/Erro"
        "422":
          description: "`VALIDATION_ERROR` — a data de `at` (fuso da propriedade) está fora de `[check_in, check_out)`. `details`: `field`, `at_date`, `check_in`, `check_out`."
          $ref: "#/components/responses/Erro"

  /reservations/{id}/check-out:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Reservas]
      summary: Registra a saída do hóspede e libera as unidades
      description: |
        `checked_in → checked_out`. **Aqui o calendário libera**: as linhas de
        `stay_blocks` da reserva deixam de contar para a constraint. É a
        transição em que a unidade volta ao estoque vendável.

        Como o intervalo é half-open, a noite do check-out nunca foi vendida a
        este hóspede: a data já estava livre para um back-to-back, e nada precisa
        ser "devolvido" ao calendário além do fechamento do bloco.

        ## O bloco vai para `completed`, não para `cancelled`

        As linhas de `stay_blocks` da reserva passam ao estado **terminal
        `completed`**: fora da cláusula `WHERE status IN ('hold','confirmed')`
        da constraint (a data libera na hora) e **visível no mapa** (a estadia
        que aconteceu continua lá).

        `completed` é o nome no banco e em `Bloqueio.status`. Na célula do mapa
        o mesmo bloco aparece como `checked_out`, que é vocabulário de
        apresentação — ver `LinhaDoMapa.days[].status`. A reserva, essa, vai para
        o estado `checked_out`.

        `cancelled` seria mentira e apagaria a prova. Estadia cumprida não é
        estadia cancelada, e o mapa esconde bloco `cancelled` de propósito —
        então marcar assim faz a hospedagem sumir do calendário. Medido em
        26/08/2026: depois do check-out de `WH-2026-0001` (14 a 16/09, `AP-01`),
        os blocos ficaram `cancelled` e `GET /availability/units` passou a
        devolver 14 e 15/09 como `livre`, com `reservation_code: null` — quatro
        noites de receita real desapareceram do mapa de ocupação, que é a fonte
        de ocupação, ADR e RevPAR.

        No mapa, o bloco `completed` **nunca esconde uma ocupação viva**: se o
        mesmo dia tem também bloco `hold` ou `confirmed` (back-to-back, ou
        realocação), vence o ativo. O histórico aparece onde não há mais nada por
        cima.

        `completed` é terminal: bloco nesse estado não volta a `confirmed`, e
        `DELETE /blocks/{id}` continua recusando bloco de reserva.

        `closed` (acerto financeiro final e devolução de caução) é passo do
        módulo financeiro e **não** tem endpoint na Fase 1.
      x-rbac: { recurso: reservations, acao: editar }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistroDeEstadia" }
      responses:
        "200":
          description: Check-out registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Reserva" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`INVALID_STATE_TRANSITION` — só reserva `checked_in` faz check-out."
          $ref: "#/components/responses/Erro"
        "422":
          description: |
            `VALIDATION_ERROR` — a data de `at` (fuso da propriedade) está fora
            de `[check_in, check_out]` ou é anterior ao `at` do evento
            `checked_in`. O teto é **inclusivo** aqui, ao contrário do check-in:
            a noite do `check_out` não é vendida, mas é a manhã em que o hóspede
            sai — half-open conta noites, não pessoas na porta.

  /reservations/{id}/reassign-unit:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Reservas]
      summary: Troca a unidade física alocada e, se pedido, trava a escolha
      description: |
        As unidades são nominais, então trocar `AP-02` por `AP-01` sem mexer em
        datas nem em preço é operação legítima — e é o que salva um conflito de
        canal sem cancelar ninguém.

        Numa transação: fecha o `stay_block` da unidade antiga (`cancelled`) e
        insere o da nova no mesmo período. Se a nova estiver ocupada, a constraint
        recusa (`23P01`) e **nada muda** — a reserva continua na unidade antiga.
        Esse caso vira `409 UNIT_NOT_AVAILABLE`, e não `DATE_CONFLICT`, porque a
        estadia não está em disputa: só a unidade está.

        `locked = true` grava `reservation_units.locked` e tira a reserva da
        realocação automática — é o hóspede que pediu aquele apartamento.

        Produto `all_members` (a White House Completa) não realoca: ele já ocupa
        todas as unidades, não há para onde mover.
      x-rbac: { recurso: reservations, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoDeRealocacao" }
      responses:
        "200":
          description: Unidade trocada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Reserva" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: |
            `UNIT_NOT_AVAILABLE` — a unidade de destino está ocupada no período
            (`details.unit_code`, `details.period`).
            `INVALID_STATE_TRANSITION` — reserva sem calendário bloqueado
            (`quote`, `cancelled`, `expired`, `no_show`, `checked_out`,
            `closed`), ou produto `all_members`.
          $ref: "#/components/responses/Erro"
        "422":
          description: "`VALIDATION_ERROR` — a unidade de destino não compõe o produto da reserva."
          $ref: "#/components/responses/Erro"

  /reservations/{id}/extend-hold:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Reservas]
      summary: Estende o prazo da pré-reserva
      description: |
        Ação **explícita e auditada** (spec §5), nunca automática: cada extensão
        entra em `reservation_events` com autor e prazo novo. Pré-reserva que se
        renova sozinha é data morta no calendário.

        `hours` ausente usa `hold_hours` da política congelada na reserva. O novo
        prazo é contado a partir de `now()`, não do vencimento antigo — hold
        vencido não se "conserta" para trás.

        O limite de extensões é configurável; estourá-lo é
        `409 HOLD_LIMIT_REACHED`, com `details.max_extensions` e
        `details.extensions_count`. A decisão passa a ser humana: confirmar com
        sinal ou soltar a data.
      x-rbac: { recurso: reservations, acao: editar }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoDeExtensaoDeHold" }
      responses:
        "200":
          description: Prazo estendido
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ResultadoDeExtensaoDeHold" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: |
            `INVALID_STATE_TRANSITION` — a reserva não está em `hold`.
            `HOLD_EXPIRED` — o prazo já venceu e as unidades foram liberadas; crie outra pré-reserva.
            `HOLD_LIMIT_REACHED` — limite de extensões atingido.
          $ref: "#/components/responses/Erro"
        "422": { $ref: "#/components/responses/Erro" }

  /blocks:
    post:
      tags: [Reservas]
      summary: Bloqueio operacional — manutenção ou uso do proprietário
      description: |
        Ocupação sem reserva. Vive na **mesma** tabela `stay_blocks` que as
        reservas, e não num calendário paralelo: é o que garante que uma
        manutenção impeça uma venda pela mesma constraint que impede duas vendas.

        Uma linha por unidade, inseridas **em ordem de `units.code`** pelo mesmo
        motivo de sempre (deadlock). Qualquer unidade ocupada faz a transação
        inteira falhar com `409 DATE_CONFLICT` — bloqueio parcial não existe: a
        equipe de manutenção não pode achar que reservou a casa e receber metade.

        `period` é half-open: bloquear `[2026-05-10, 2026-05-12)` ocupa 10 e 11, e
        deixa 12 livre para check-in.

        `source` aceita `maintenance` e `owner_hold`. `ota` é criado pelo
        importador de canais (Fase 4), não por esta rota, e `reservation` nasce
        com a reserva.

        ## O bloqueio tem janela máxima

        Dois tetos, os dois em `422 VALIDATION_ERROR`:

        - **Duração ≤ 365 noites**, com o erro em `to` (a data que o operador
          encurta). Manutenção e uso do proprietário se medem em dias ou
          semanas; um ano é folgado para a temporada mais longa que a casa
          consegue justificar.
        - **`from` ≤ hoje + 3 anos**, no fuso da PROPRIEDADE e não do processo,
          com o erro em `from`.

        Medido em 26/08/2026, antes dos tetos: `POST /blocks` de 01/01/2040 a
        01/01/2050 sobre as 8 unidades respondeu `201` — 29.224 noites-unidade a
        catorze anos de distância, onde nem o tarifário nem a política comercial
        alcançam, e tudo isso com uma tecla errada. Com os tetos, o pior caso é
        8 × 365 dentro do horizonte de venda.

        **Não é permissão maior**: a permissão já é simétrica, e exigir `admin`
        só mudaria quem erra de dedo — o administrador digita `2050` tão fácil
        quanto o corretor. Por isso o teto de duração mora no DTO e vale para
        todos.

        `from` **no passado continua livre**: registrar manutenção que já
        aconteceu é legítimo. E quem precisa de mais tem dois caminhos, nenhum
        deles esta rota: reforma de temporada inteira se parte em bloqueios de
        até um ano (cada linha vira decisão revisável e liberável sozinha, que é
        exatamente o que uma linha de dez anos impede), e unidade que sai do
        catálogo é `active = false` no inventário — retirada permanente é decisão
        de inventário, não de calendário.

        ## Quem bloqueia, desbloqueia

        `POST /blocks` (`calendar:criar`) e `DELETE /blocks/{id}`
        (`calendar:excluir`) são um par **simétrico**: a matriz de um perfil
        concede as duas ou nenhuma. Conceder só a criação entrega ao perfil o
        poder de tirar data do estoque sem o poder de devolvê-la, e a única saída
        vira chamar um administrador.

        Não é hipótese. Medido em 26/08/2026 com a matriz semeada, em que
        `corretor` tem `calendar` em `ver+criar` e escopo `own`: o corretor
        bloqueou a `COB-01` de 02/01 a 01/03/2027 — dois meses de alta temporada
        na Cobertura — recebeu `201`, e o `DELETE` do bloco que ele mesmo acabou
        de criar respondeu `403 FORBIDDEN`. A tela dele oferece o cadeado e
        esconde a chave.

        A simetria é regra do **catálogo e da matriz** (`cmd/seed/acesso.go`),
        não do handler: `calendar` já declara as quatro ações, e é o seed que
        precisa parar de conceder `criar` sem `excluir`.

        ## Escopo `own`: o bloqueio tem dono

        `stay_blocks.created_by` é o dono do bloqueio operacional. Com escopo
        `own`, esta rota grava `created_by = ator` (e não aceita gravar em nome
        de outro), e `DELETE` só alcança o que o ator criou. Com escopo `all`, a
        gestão libera qualquer um — que é o que a operação precisa quando o
        autor está de folga.
      x-rbac: { recurso: calendar, acao: criar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BloqueioCriar" }
      responses:
        "201":
          description: Bloqueio criado (uma linha por unidade)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Bloqueio" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`DATE_CONFLICT` — alguma unidade já está ocupada no período (`details.unit_code`, `details.period`). Nenhuma linha foi criada."
          $ref: "#/components/responses/Erro"
        "422":
          description: |
            `VALIDATION_ERROR`. `details.to` — `to` não é posterior a `from`, ou a
            janela passa de 365 noites. `details.from` — o início cai além de
            hoje + 3 anos, no fuso da propriedade. `details.source` — fora de
            `maintenance`/`owner_hold`. `details.unit_ids` — mais de 100 unidades.
          $ref: "#/components/responses/Erro"

  /blocks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Reservas]
      summary: Libera um bloqueio operacional
      description: |
        Marca o bloqueio como `cancelled` — a data volta a ser vendável e o
        registro fica. Uma linha por chamada: liberar só um dos dias/unidades de
        uma manutenção é caso real.

        Bloqueio com `reservation_id` (`source = reservation`) responde
        `409 INVALID_STATE_TRANSITION`: quem solta a data de uma reserva é
        `/cancel`, `/check-out` ou o job de expiração. Apagar o bloco por fora
        deixaria a reserva `confirmed` sem calendário, e ninguém veria.

        **Par simétrico de `POST /blocks`** — a matriz concede `calendar:criar` e
        `calendar:excluir` juntas ou nenhuma. O motivo está escrito na criação:
        quem pode tirar a data do estoque tem de poder devolvê-la.

        **Escopo `own`**: o filtro é `created_by = ator`, aplicado no SQL. Bloco
        de outro dono responde `404 NOT_FOUND`, não `403` — pela mesma razão que
        uma reserva de outro dono responde `404` ao corretor: `403` confirmaria a
        existência do registro para quem não pode enxergá-lo.
      x-rbac: { recurso: calendar, acao: excluir }
      responses:
        "204": { description: Liberado }
        "404":
          description: "`NOT_FOUND` — bloqueio inexistente nesta propriedade, ou de outro dono quando o escopo do ator é `own`."
          $ref: "#/components/responses/Erro"
        "409":
          description: "`INVALID_STATE_TRANSITION` — bloqueio de reserva não se libera por aqui, e bloqueio já em estado terminal (`cancelled`, `expired`, `completed`) não se libera duas vezes."
          $ref: "#/components/responses/Erro"

  /stream:
    get:
      tags: [Tempo real]
      summary: Barramento de eventos (SSE) — "algo mudou", nunca o que mudou
      description: |
        Conexão longa `text/event-stream`. É o que faz o mapa de ocupação e o
        kanban se atualizarem sozinhos, sem *polling*.

        ## O evento é magro de propósito

        ```
        event: calendar
        id: 8412
        data: {"entity":"stay_block","id":"3f1c…","unit_id":"a07b…","v":7}
        ```

        O corpo **não** carrega o dado: carrega a notícia de que ele mudou. O
        cliente recebe o aviso e **refaz o fetch autenticado** da faixa que está
        na tela (`GET /availability/units?from&to`,
        `GET /crm/opportunities/kanban`…).

        São duas consequências, e as duas são o motivo da forma:

        1. **Nada sensível trafega pelo barramento.** Nome de hóspede, valor,
           telefone e desconto continuam saindo só por rota REST.
        2. **O RBAC continua sendo aplicado num lugar só.** Quem decide o que
           cada papel enxerga é o `GET` de sempre, com o mesmo `WHERE` e o mesmo
           escopo. Um segundo caminho de leitura seria uma segunda chance de
           errar a permissão — e a que ninguém testa.

        Por isso também não há verbo de operação (`created`/`deleted`) no
        envelope: refazer o fetch da faixa visível resolve criação, alteração e
        remoção com o mesmo código de cliente.

        ## `id:` e `v` são dois números diferentes

        - **`id:`** é o cursor do barramento — monotônico, global, e é ele que
          volta em `Last-Event-ID`.
        - **`v`** é a versão da **entidade**, incrementada a cada escrita. O
          cliente descarta evento com `v` menor ou igual ao que já desenhou;
          é assim que uma reentrega (reconexão com replay) não faz a tela
          piscar duas vezes.

        ## Tópicos e permissão

        `topics` é a lista, separada por vírgula, do que se quer ouvir. Cada
        tópico é conferido contra a matriz **na abertura**:

        | Tópico | Exige | Entidades |
        |---|---|---|
        | `calendar` | `calendar:ver` | `stay_block`, `reservation` |
        | `crm` | `crm.opportunities:ver` | `opportunity`, `lead`, `activity` |

        Tópico que o requisitante não alcança é **descartado da assinatura**, e a
        conexão abre com o que sobrou. Se não sobrar nada, a resposta é
        `403 FORBIDDEN` — abrir uma conexão muda que nunca entrega nada é o pior
        dos mundos: o cliente fica esperando para sempre um evento que não vem.

        O primeiro evento é sempre `ready`, com os tópicos **efetivamente**
        aceitos, justamente para o cliente saber o que não conseguiu.

        Escopo `own` vale aqui igual: o servidor só publica para a conexão o
        evento que o `GET` correspondente devolveria àquele usuário. O corretor
        não recebe aviso de oportunidade alheia — nem o `id` dela.

        ## Reconexão: `Last-Event-ID` e o `resync` honesto

        Na queda, o navegador reconecta sozinho (o servidor manda `retry: 5000`)
        enviando `Last-Event-ID` com o último `id:` recebido. O servidor
        **repõe** o que passou desde ali, a partir de um buffer limitado
        (últimos 5 min por tópico).

        Cursor mais antigo que o buffer não é reposto com silêncio: o servidor
        manda `event: resync` e o cliente refaz o fetch inteiro. Fingir que nada
        se perdeu é como o mapa de ocupação fica errado sem ninguém perceber.

        ## Token que expira no meio da conexão

        O access token vale 15 min; a conexão vive mais que isso. Não dá para
        responder `401` no meio — o `200` e os cabeçalhos já foram enviados, e
        `EventSource` não deixa o cliente ler status depois disso.

        A regra, então, é explícita:

        1. o token é validado **no handshake** e a conexão herda o `exp` dele;
        2. faltando 60 s para o `exp`, o servidor manda `event: expiring`
           (`data: {"expires_at":"…"}`) — a deixa para o cliente chamar
           `POST /auth/refresh` **antes** de perder o fio;
        3. no `exp`, o servidor manda `event: expired` e **fecha** a conexão
           normalmente (fim de stream, sem erro de transporte);
        4. o cliente reconecta com o token novo e o mesmo `Last-Event-ID`, e o
           replay cobre o intervalo.

        Nada de renovar autorização por dentro do stream: sessão se renova no
        `/auth/refresh`, num lugar só.

        ## Autenticação

        A mesma do resto da API: `Authorization: Bearer <jwt>` ou o cookie
        `httpOnly` pelo BFF do painel. O `EventSource` do navegador **não**
        permite cabeçalho customizado — o caminho do painel é o cookie, servido
        pelo BFF em mesma origem. Token em *query string* não é aceito: ele
        pararia no log de acesso do proxy.

        ## Higiene da conexão

        `: keep-alive` a cada 20 s (comentário SSE, ignorado pelo cliente) para
        proxy nenhum matar a conexão ociosa. Resposta com `Cache-Control:
        no-store` e `X-Accel-Buffering: no` — sem isso o buffer do proxy segura
        os eventos e entrega tudo junto, no fim.
      x-rbac-topicos:
        calendar: { recurso: calendar, acao: ver }
        crm: { recurso: crm.opportunities, acao: ver }
      parameters:
        - name: topics
          in: query
          required: true
          schema: { type: string, example: "calendar,crm" }
          description: |
            Tópicos separados por vírgula. Valores conhecidos hoje: `calendar` e
            `crm`. Nome desconhecido é `422 VALIDATION_ERROR` com a lista em
            `details.topics` — errar o nome do tópico e receber uma conexão
            silenciosa é indistinguível de "não aconteceu nada ainda".
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
          description: |
            Enviado automaticamente pelo `EventSource` na reconexão. Também
            aceito como query param `last_event_id`, para cliente que não é
            navegador.
      responses:
        "200":
          description: |
            Stream aberto. O corpo é uma sequência SSE que só termina quando o
            cliente desconecta ou o token expira — uma conexão completa se parece
            com isto:

            ```
            retry: 5000
            event: ready
            data: {"topics":["calendar","crm"],"server_time":"2026-08-27T10:00:00-03:00"}

            : keep-alive

            event: calendar
            id: 8412
            data: {"entity":"stay_block","id":"3f1c…","unit_id":"a07b…","v":7}

            event: crm
            id: 8413
            data: {"entity":"opportunity","id":"9d2e…","v":3}

            event: expiring
            data: {"expires_at":"2026-08-27T10:15:00-03:00"}
            ```

            Quatro nomes de evento não são mudança de dado e por isso **não têm**
            `id:` (não voltam no replay): `ready` (abertura, com os tópicos
            aceitos), `resync` (o cursor pedido é mais antigo que o buffer — refaça
            o fetch inteiro), `expiring` e `expired` (o token está para vencer /
            venceu). Os eventos de dado são `calendar` e `crm`, e o `data:` deles é
            o `EventoDoStream` abaixo.
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
            X-Accel-Buffering:
              schema: { type: string, example: "no" }
              description: Desliga o buffer do proxy reverso; com ele ligado o tempo real deixa de ser real.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/EventoDoStream" }
        "403":
          description: "`FORBIDDEN` — nenhum dos tópicos pedidos é alcançável pela matriz do requisitante."
          $ref: "#/components/responses/Erro"
        "422":
          description: "`VALIDATION_ERROR` — `topics` ausente ou com nome desconhecido."
          $ref: "#/components/responses/Erro"

  /crm/pipelines:
    get:
      tags: [CRM]
      summary: Lista os funis
      description: |
        Configuração do funil, não carteira: aqui não há escopo `own`. O corretor
        lê (`crm.pipelines` em `ver`/`all` no seed) porque **sem isto o kanban
        dele não sabe desenhar as colunas**; escrever, não pode.
      x-rbac: { recurso: crm.pipelines, acao: ver }
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: active,   in: query, schema: { type: boolean }, description: Ausente traz ativos e inativos. }
        - { name: q,        in: query, schema: { type: string }, description: Busca por nome. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Funil" }
                  - $ref: "#/components/schemas/Paginacao"
        "403": { $ref: "#/components/responses/Erro" }
    post:
      tags: [CRM]
      summary: Cria um funil
      description: |
        Nasce **sem etapas**. Um funil vazio não recebe oportunidade: mover card
        exige etapa, e etapa se cria em `/crm/stages`.

        `is_default: true` desmarca o default anterior na mesma transação — dois
        funis default fariam a criação de oportunidade sem `pipeline_id` escolher
        um dos dois por sorteio da ordenação.
      x-rbac: { recurso: crm.pipelines, acao: criar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FunilEntrada" }
      responses:
        "201":
          description: Criado
          headers:
            Location: { description: URI do recurso criado., schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Funil" }
        "409": { description: "`CODE_IN_USE` — já existe funil com esse nome na propriedade.", $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }

  /crm/pipelines/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [CRM]
      summary: Detalhe do funil, com as etapas na ordem
      x-rbac: { recurso: crm.pipelines, acao: ver }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/FunilComEtapas" }
        "404": { $ref: "#/components/responses/Erro" }
    put:
      tags: [CRM]
      summary: Substitui o funil
      x-rbac: { recurso: crm.pipelines, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FunilEntrada" }
      responses:
        "200":
          description: Substituído
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Funil" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { description: "`CODE_IN_USE` ou `DEFAULT_PIPELINE_REQUIRED` — ver o `PATCH`.", $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    patch:
      tags: [CRM]
      summary: Atualiza o funil
      description: |
        Tirar o `is_default` do último funil default é `409
        DEFAULT_PIPELINE_REQUIRED`: sem default, `POST /crm/opportunities` sem
        `pipeline_id` não tem onde cair, e o erro apareceria longe daqui, na
        criação da oportunidade. O caminho é marcar outro funil como default —
        a troca desmarca este sozinha.
      x-rbac: { recurso: crm.pipelines, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FunilAtualizar" }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Funil" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      tags: [CRM]
      summary: Desativa o funil
      description: |
        **Soft delete** (`active = false`). Funil é histórico: as oportunidades
        ganhas e perdidas apontam para as etapas dele, e é delas que sai a
        conversão por etapa do BI. Apagar de verdade apagaria o passado.

        Funil inativo some do seletor de criação e continua abrindo o card
        antigo. Com oportunidade **aberta** ainda dentro, a desativação é
        recusada (`409 RESOURCE_IN_USE`, com a contagem em `details`): esconder o
        funil deixaria esses cards sem coluna em que aparecer.
      x-rbac: { recurso: crm.pipelines, acao: excluir }
      responses:
        "204": { description: Desativado }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { description: "`RESOURCE_IN_USE` — há oportunidade aberta no funil. `DEFAULT_PIPELINE_REQUIRED` — é o único default.", $ref: "#/components/responses/Erro" }

  /crm/stages:
    get:
      tags: [CRM]
      summary: Lista as etapas
      x-rbac: { recurso: crm.pipelines, acao: ver }
      parameters:
        - { name: page,        in: query, schema: { type: integer, default: 1 } }
        - { name: per_page,    in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: pipeline_id, in: query, schema: { type: string, format: uuid }, description: Ausente traz as etapas de todos os funis. }
        - { name: type,        in: query, schema: { type: string, enum: [aberto, ganho, perdido] } }
      responses:
        "200":
          description: Ordenadas por `pipeline_id` e `position`.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/EtapaDoFunil" }
                  - $ref: "#/components/schemas/Paginacao"
        "403": { $ref: "#/components/responses/Erro" }
    post:
      tags: [CRM]
      summary: Cria uma etapa
      description: |
        `position` ausente coloca a etapa no fim do funil. Posição repetida é
        normalizada na gravação — a ordem canônica se estabelece com
        `POST /crm/stages/reorder`, que reescreve as posições de uma vez.

        Um funil aceita **no máximo uma** etapa de cada tipo terminal (`ganho` e
        `perdido`): são elas que `/win` e `/lose` procuram, e duas candidatas
        transformariam "ganhar" numa escolha ambígua do servidor.
      x-rbac: { recurso: crm.pipelines, acao: criar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EtapaEntrada" }
      responses:
        "201":
          description: Criada
          headers:
            Location: { description: URI do recurso criado., schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EtapaDoFunil" }
        "404": { description: "`NOT_FOUND` — `pipeline_id` inexistente.", $ref: "#/components/responses/Erro" }
        "409": { description: "`CODE_IN_USE` — nome repetido no funil, ou segunda etapa de tipo `ganho`/`perdido`.", $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }

  /crm/stages/reorder:
    post:
      tags: [CRM]
      summary: Reescreve a ordem das etapas de um funil
      description: |
        Recebe o funil e **a lista inteira** das etapas dele, na ordem desejada;
        `position` passa a ser o índice no array, numa transação só.

        A lista tem de ser completa. Reordenar mandando só as duas etapas que se
        moveram deixaria as demais com posição de antes, e o kanban desenharia
        duas colunas na mesma casa — `422 STAGE_ORDER_INCOMPLETE`, com
        `details.missing_stage_ids`. Etapa de outro funil na lista é
        `422 STAGE_NOT_IN_PIPELINE`, com `details.stage_id`.

        Não é o `PATCH` de cada etapa em sequência de propósito: reordenar é um
        ato só, e uma sequência de `PATCH` deixa o funil visivelmente errado
        entre uma chamada e outra.
      x-rbac: { recurso: crm.pipelines, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoDeReordenacao" }
      responses:
        "200":
          description: Ordem gravada — devolve as etapas já reordenadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EtapaDoFunil" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { description: "`STAGE_ORDER_INCOMPLETE` ou `STAGE_NOT_IN_PIPELINE`.", $ref: "#/components/responses/Erro" }

  /crm/stages/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [CRM]
      summary: Detalhe da etapa
      x-rbac: { recurso: crm.pipelines, acao: ver }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EtapaDoFunil" }
        "404": { $ref: "#/components/responses/Erro" }
    put:
      tags: [CRM]
      summary: Substitui a etapa
      x-rbac: { recurso: crm.pipelines, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EtapaEntrada" }
      responses:
        "200":
          description: Substituída
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EtapaDoFunil" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { description: "`STAGE_NOT_IN_PIPELINE` — o corpo tenta mudar a etapa de funil, o que moveria as oportunidades dela junto.", $ref: "#/components/responses/Erro" }
    patch:
      tags: [CRM]
      summary: Atualiza a etapa
      description: |
        Mudar `sla_days` ou a tarefa automática **não** mexe em tarefa já criada:
        a tarefa que existe tem prazo próprio, e reescrevê-lo à distância moveria
        o compromisso de alguém sem aviso. O ajuste vale da próxima entrada na
        etapa em diante.
      x-rbac: { recurso: crm.pipelines, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EtapaAtualizar" }
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EtapaDoFunil" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      tags: [CRM]
      summary: Remove a etapa
      description: |
        Remoção física, e só quando a etapa está vazia. Com oportunidade dentro
        (aberta ou fechada) ou com linha em `crm_stage_history` apontando para
        ela, a resposta é `409 RESOURCE_IN_USE`: `stage_history` é insert-only e
        é a matéria-prima da conversão por etapa — apagar a etapa deixaria o
        histórico apontando para o nada.

        As demais etapas do funil são recompactadas (`position` sem buracos).
      x-rbac: { recurso: crm.pipelines, acao: excluir }
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { description: "`RESOURCE_IN_USE` — `details` traz `opportunity_count` e `history_count`.", $ref: "#/components/responses/Erro" }

  /crm/lost-reasons:
    get:
      tags: [CRM]
      summary: Lista os motivos de perda
      description: |
        Catálogo fechado, e é o que faz o "motivos de perda" do BI (§15) existir.
        Motivo em texto livre daria 200 grafias de "preço" e nenhum gráfico.
      x-rbac: { recurso: crm.pipelines, acao: ver }
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: active,   in: query, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MotivoDePerda" }
                  - $ref: "#/components/schemas/Paginacao"
        "403": { $ref: "#/components/responses/Erro" }
    post:
      tags: [CRM]
      summary: Cria um motivo de perda
      x-rbac: { recurso: crm.pipelines, acao: criar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MotivoDePerdaEntrada" }
      responses:
        "201":
          description: Criado
          headers:
            Location: { description: URI do recurso criado., schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MotivoDePerda" }
        "409": { description: "`CODE_IN_USE` — rótulo repetido.", $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }

  /crm/lost-reasons/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [CRM]
      summary: Detalhe do motivo de perda
      x-rbac: { recurso: crm.pipelines, acao: ver }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MotivoDePerda" }
        "404": { $ref: "#/components/responses/Erro" }
    put:
      tags: [CRM]
      summary: Substitui o motivo de perda
      x-rbac: { recurso: crm.pipelines, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MotivoDePerdaEntrada" }
      responses:
        "200":
          description: Substituído
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MotivoDePerda" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    patch:
      tags: [CRM]
      summary: Atualiza o motivo de perda
      x-rbac: { recurso: crm.pipelines, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MotivoDePerdaAtualizar" }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MotivoDePerda" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      tags: [CRM]
      summary: Desativa o motivo de perda
      description: |
        **Soft delete** (`active = false`): oportunidades perdidas continuam
        apontando para ele, e é isso que o relatório de motivos de perda lê.
        Inativo some do seletor do `/lose` e continua legível no card antigo.
      x-rbac: { recurso: crm.pipelines, acao: excluir }
      responses:
        "204": { description: Desativado }
        "404": { $ref: "#/components/responses/Erro" }
  /crm/leads:
    get:
      tags: [CRM]
      summary: Lista os leads
      description: |
        **Escopo `own`**: o corretor lista só os leads de que é dono
        (`AND owner_id = $usuario` no SQL, nunca peneira em memória). Lead sem
        dono — o que entra por WhatsApp antes de alguém assumir — não aparece
        para quem tem escopo `own`, e é assim que tem de ser: é fila da gestão
        até ser distribuído.
      x-rbac: { recurso: crm.leads, acao: ver }
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: status,   in: query, schema: { type: string, example: "novo,em_atendimento" }, description: Um ou mais estados separados por vírgula. }
        - { name: source,   in: query, schema: { type: string, example: whatsapp } }
        - { name: owner_id, in: query, schema: { type: string, format: uuid }, description: "Ignorado (na prática, sobreposto) para quem tem escopo `own`." }
        - { name: contact_id, in: query, schema: { type: string, format: uuid } }
        - { name: q,        in: query, schema: { type: string }, description: "Busca por nome, e-mail ou telefone do contato." }
        - { name: from,     in: query, schema: { type: string, format: date }, description: "Recorte por `created_at`." }
        - { name: to,       in: query, schema: { type: string, format: date } }
        - { name: sort,     in: query, schema: { type: string, default: -created_at, enum: [created_at, -created_at, score, -score] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Lead" }
                  - $ref: "#/components/schemas/Paginacao"
        "403": { $ref: "#/components/responses/Erro" }
    post:
      tags: [CRM]
      summary: Cria um lead
      description: |
        `contact_id` é obrigatório — uma pessoa, um registro (§6). Lead não
        guarda nome nem telefone: guarda o interesse. Duplicar a pessoa aqui é
        como se perde a deduplicação por telefone que o WhatsApp depende.

        `owner_id` ausente assume o usuário autenticado quando ele tem escopo
        `own` (criar lead órfão seria criar lead que o próprio autor não
        enxerga); com escopo `all`, ausente significa **sem dono**, na fila da
        gestão.
      x-rbac: { recurso: crm.leads, acao: criar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadCriar" }
      responses:
        "201":
          description: Criado
          headers:
            Location: { description: URI do recurso criado., schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Lead" }
        "404": { description: "`NOT_FOUND` — `contact_id` inexistente.", $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }

  /crm/leads/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [CRM]
      summary: Detalhe do lead
      description: "Fora do escopo do requisitante devolve `404`, nunca `403` — responder `403` confirmaria que o lead existe (docs/api.md §1)."
      x-rbac: { recurso: crm.leads, acao: ver }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Lead" }
        "404": { $ref: "#/components/responses/Erro" }
    put:
      tags: [CRM]
      summary: Substitui o lead
      x-rbac: { recurso: crm.leads, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadAtualizar" }
      responses:
        "200":
          description: Substituído
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Lead" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    patch:
      tags: [CRM]
      summary: Atualiza o lead
      description: |
        `status` **não** vira `convertido` por aqui: quem converte é
        `POST /crm/leads/{id}/convert`, que cria a oportunidade na mesma
        transação. Marcar convertido na mão deixaria o lead dizendo que virou
        negócio sem negócio nenhum do outro lado — `422 VALIDATION_ERROR`.
      x-rbac: { recurso: crm.leads, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadAtualizar" }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Lead" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      tags: [CRM]
      summary: Remove o lead
      description: |
        Remoção física, e só do lead que **não** virou oportunidade. Convertido
        responde `409 RESOURCE_IN_USE`: a oportunidade guarda `lead_id` como
        origem, e é dela que sai a conversão por origem no BI.

        Para descartar sem apagar, o caminho é `status: descartado` — é o que
        alimenta o funil de perdas antes mesmo de existir oportunidade.
      x-rbac: { recurso: crm.leads, acao: excluir }
      responses:
        "204": { description: Removido }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }

  /crm/leads/{id}/convert:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [CRM]
      summary: Converte o lead em oportunidade
      description: |
        Numa transação: cria a oportunidade com o contato, o interesse e as datas
        pretendidas do lead, marca o lead como `convertido` com `converted_at`, e
        aciona a entrada na primeira etapa — inclusive a **tarefa automática**
        dela, se houver SLA.

        O que o corpo manda **sobrepõe** o que veio do lead; o que ele omite é
        herdado. Sem `pipeline_id`, cai no funil `is_default`; sem `stage_id`, na
        etapa de menor `position` desse funil.

        `owner_id` ausente herda o dono do lead — trocar de dono na conversão é
        possível, mas explícito.

        Converter duas vezes é `409 LEAD_ALREADY_CONVERTED`, com
        `details.opportunity_id` apontando a oportunidade que já existe: o
        segundo clique do operador abre o card certo em vez de criar um card
        gêmeo no funil.
      x-rbac: { recurso: crm.leads, acao: editar }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoDeConversao" }
      responses:
        "201":
          description: Oportunidade criada — devolve as duas pontas.
          headers:
            Location: { description: "URI da oportunidade criada (`/crm/opportunities/{id}`).", schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ResultadoDeConversao" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { description: "`LEAD_ALREADY_CONVERTED`.", $ref: "#/components/responses/Erro" }
        "422": { description: "`STAGE_NOT_IN_PIPELINE` — `stage_id` não pertence ao `pipeline_id` pedido.", $ref: "#/components/responses/Erro" }
  /crm/opportunities:
    get:
      tags: [CRM]
      summary: Lista as oportunidades
      description: |
        **Escopo `own`**: o corretor lista só as próprias — `AND owner_id =
        $usuario` no SQL do repositório, provado por teste de integração
        (spec §1). O filtro `owner_id` da query não amplia nada: quem tem escopo
        `own` só consegue estreitar o que já é dele.
      x-rbac: { recurso: crm.opportunities, acao: ver }
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: pipeline_id, in: query, schema: { type: string, format: uuid } }
        - { name: stage_id,    in: query, schema: { type: string, format: uuid } }
        - { name: status,      in: query, schema: { type: string, example: "aberta" }, description: "Um ou mais de `aberta,ganha,perdida`, separados por vírgula. Ausente traz todos." }
        - { name: owner_id,    in: query, schema: { type: string, format: uuid } }
        - { name: contact_id,  in: query, schema: { type: string, format: uuid } }
        - { name: unit_type_id, in: query, schema: { type: string, format: uuid } }
        - { name: lost_reason_id, in: query, schema: { type: string, format: uuid } }
        - { name: q,           in: query, schema: { type: string }, description: Busca por título da oportunidade ou nome do contato. }
        - { name: expected_close_from, in: query, schema: { type: string, format: date } }
        - { name: expected_close_to,   in: query, schema: { type: string, format: date } }
        - name: sla
          in: query
          schema: { type: string, enum: [estourado, no_prazo] }
          description: |
            Recorte derivado, calculado no servidor: `estourado` traz o que passou
            de `entered_stage_at + sla_days` sem sair da etapa. É o filtro que o
            painel do corretor usa; calcular isso no front daria uma resposta
            diferente por fuso do navegador.
        - { name: sort, in: query, schema: { type: string, default: -updated_at, enum: [created_at, -created_at, updated_at, -updated_at, amount_cents, -amount_cents, expected_close, -expected_close, entered_stage_at, -entered_stage_at] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Oportunidade" }
                  - $ref: "#/components/schemas/Paginacao"
        "403": { $ref: "#/components/responses/Erro" }
    post:
      tags: [CRM]
      summary: Cria uma oportunidade
      description: |
        `contact_id` é obrigatório (§7): oportunidade sem pessoa não tem com quem
        negociar nem para quem emitir orçamento.

        Sem `pipeline_id`, cai no funil `is_default`; sem `stage_id`, na etapa de
        menor `position` — e a entrada na etapa **já cria a tarefa automática**
        dela, como qualquer outra entrada.

        Não exige `Idempotency-Key`: nada de dinheiro nem de calendário nasce
        aqui. A reserva só aparece em `/win`, e é lá que a chave é obrigatória.
      x-rbac: { recurso: crm.opportunities, acao: criar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OportunidadeCriar" }
      responses:
        "201":
          description: Criada
          headers:
            Location: { description: URI do recurso criado., schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Oportunidade" }
        "404": { description: "`NOT_FOUND` — contato, funil, etapa ou produto inexistente.", $ref: "#/components/responses/Erro" }
        "422": { description: "`STAGE_NOT_IN_PIPELINE` · `VALIDATION_ERROR` (`check_out <= check_in`).", $ref: "#/components/responses/Erro" }

  /crm/opportunities/kanban:
    get:
      tags: [CRM]
      summary: O quadro inteiro — colunas, cards e totais numa chamada
      description: |
        Uma coluna por etapa do funil, na ordem de `position`, cada uma com os
        cards e com o **total da coluna** (`count` e `amount_cents`).

        O total vem do servidor, e não da soma dos cards no cliente, porque a
        coluna é paginada: somar o que veio na tela daria um valor de funil que
        muda conforme se rola a página.

        **Escopo `own`**: o corretor vê no kanban apenas os próprios cards
        (critério de aceite do §7) — as colunas continuam todas lá, com os totais
        já restritos à carteira dele.

        Cada coluna carrega no máximo `per_column` cards, com `has_more` para a
        tela oferecer "carregar mais". Sem isso, uma etapa com 800 cards
        derrubaria o quadro inteiro na primeira abertura.
      x-rbac: { recurso: crm.opportunities, acao: ver }
      parameters:
        - { name: pipeline_id, in: query, schema: { type: string, format: uuid }, description: Ausente usa o funil `is_default`. }
        - { name: per_column,  in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: owner_id,    in: query, schema: { type: string, format: uuid } }
        - { name: q,           in: query, schema: { type: string } }
        - { name: unit_type_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date }, description: "Recorte por `check_in` pretendido." }
        - { name: to,   in: query, schema: { type: string, format: date } }
        - name: include_closed
          in: query
          schema: { type: boolean, default: false }
          description: |
            Por padrão as colunas terminais (`ganho` e `perdido`) trazem só o que
            fechou nos últimos 30 dias. Ligado, trazem tudo — e a coluna "Perdido"
            de um ano de operação vira a coluna mais pesada do quadro.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/QuadroKanban" }
        "403": { $ref: "#/components/responses/Erro" }
        "404": { description: "`NOT_FOUND` — funil inexistente, ou nenhum funil `is_default` configurado.", $ref: "#/components/responses/Erro" }

  /crm/opportunities/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [CRM]
      summary: Detalhe da oportunidade
      description: "Fora do escopo do requisitante devolve `404`, nunca `403`."
      x-rbac: { recurso: crm.opportunities, acao: ver }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Oportunidade" }
        "404": { $ref: "#/components/responses/Erro" }
    put:
      tags: [CRM]
      summary: Substitui a oportunidade
      x-rbac: { recurso: crm.opportunities, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OportunidadeAtualizar" }
      responses:
        "200":
          description: Substituída
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Oportunidade" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    patch:
      tags: [CRM]
      summary: Atualiza a oportunidade
      description: |
        `stage_id`, `status`, `lost_reason_id` e `reservation_id` **não** estão no
        corpo, e é a mesma regra da reserva: quem muda estado é a ação
        correspondente (`/stage`, `/win`, `/lose`), porque cada uma tem efeito
        colateral obrigatório — histórico de etapa, tarefa automática, motivo,
        reserva. Um `PATCH` que mudasse a etapa moveria o card sem gravar
        `crm_stage_history`, e a conversão por etapa do BI passaria a mentir.

        Oportunidade já fechada (`ganha`/`perdida`) recusa edição com
        `409 OPPORTUNITY_ALREADY_CLOSED`: o que está fechado é história.
      x-rbac: { recurso: crm.opportunities, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OportunidadeAtualizar" }
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Oportunidade" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { description: "`OPPORTUNITY_ALREADY_CLOSED`.", $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      tags: [CRM]
      summary: Remove a oportunidade
      description: |
        Remoção física, e só do que está **aberto e sem reserva**. Ganha, perdida
        ou com `reservation_id` responde `409 RESOURCE_IN_USE`: é a origem
        comercial da venda, e é dela que saem conversão, motivos de perda e
        desempenho por corretor.

        Apagar leva junto o histórico de etapas e as atividades da oportunidade —
        é por isso que só se apaga o que ainda não virou história.
      x-rbac: { recurso: crm.opportunities, acao: excluir }
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }

  /crm/opportunities/{id}/full:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [CRM]
      summary: Monta a tela da oportunidade numa chamada
      description: |
        Devolve **tudo** que a `OpportunityPage` desenha: a oportunidade, o
        contato, as etapas do funil (para a trilha), a faixa de SLA, o histórico
        de etapas, as atividades, as notas, os documentos, os alertas derivados e
        a linha do tempo unificada.

        É um agregador de propósito, e não uma economia preguiçosa: a tela
        montada por sete chamadas em paralelo aparece em sete tempos diferentes,
        e cada uma delas é mais uma chance de um pedaço da tela ficar com o
        escopo errado. Aqui o recorte de permissão é resolvido uma vez, na
        entrada.

        `stages` vem do funil da oportunidade, não do funil default: o card
        antigo tem de desenhar a trilha em que ele realmente andou.
      x-rbac: { recurso: crm.opportunities, acao: ver }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OportunidadeCompleta" }
        "404": { $ref: "#/components/responses/Erro" }

  /crm/opportunities/{id}/stage:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [CRM]
      summary: Move a oportunidade de etapa
      description: |
        Numa transação:

        1. grava a linha em `crm_stage_history` (insert-only) com origem, destino,
           autor e motivo;
        2. atualiza `stage_id`, `entered_stage_at` e `probability` (herdada da
           etapa nova, salvo `probability` explícita no corpo);
        3. **cria a tarefa automática da etapa**, se ela tiver
           `auto_task_subject`, com `due_at = agora + auto_task_due_days` (ou
           `sla_days`, se `auto_task_due_days` for nulo) e
           `owner_id = dono da oportunidade`;
        4. publica o evento `crm` no barramento (`entity: opportunity`).

        ## A tarefa automática é idempotente

        A criação é condicionada a **não existir tarefa automática pendente da
        mesma etapa** (`crm_activities` com `opportunity_id`, `stage_id`,
        `auto = true` e `status = pendente`). Mover o card para fora e de volta no
        mesmo dia não empilha dois follow-ups do mesmo assunto — e o kanban com
        arrasto otimista reenvia a mesma transição mais vezes do que se imagina.

        Voltar à etapa depois de a tarefa ter sido **concluída** cria outra: é um
        novo ciclo de SLA, e não uma duplicata.

        ## Etapa terminal não se alcança por aqui

        Etapa de tipo `ganho` ou `perdido` é recusada com
        `409 INVALID_STATE_TRANSITION`, e `details` traz o endpoint certo. Não é
        preciosismo: ganhar cria **reserva** (e por isso exige `Idempotency-Key`)
        e perder exige **motivo**. Deixar `/stage` fazer isso significaria criar
        reserva sem chave de idempotência num arrasto de kanban, que é
        exatamente o gesto que mais se repete por engano.

        No painel, arrastar o card para a coluna "Ganho" abre o diálogo e chama
        `/win`; para "Perdido", pede o motivo e chama `/lose`.
      x-rbac: { recurso: crm.opportunities, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoDeMudancaDeEtapa" }
      responses:
        "200":
          description: Movida — devolve a oportunidade e a tarefa automática, se alguma nasceu.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ResultadoDeMudancaDeEtapa" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: |
            `OPPORTUNITY_ALREADY_CLOSED` — já ganha ou perdida.
            `INVALID_STATE_TRANSITION` — destino terminal (use `/win` ou `/lose`),
            ou `from_stage_id` diferente da etapa atual: alguém moveu o card antes,
            e `details.current_stage_id` diz para onde. É a guarda que impede o
            arrasto otimista de dois corretores sobrescreverem um ao outro.
          $ref: "#/components/responses/Erro"
        "422": { description: "`STAGE_NOT_IN_PIPELINE` — a etapa é de outro funil.", $ref: "#/components/responses/Erro" }

  /crm/opportunities/{id}/win:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [CRM]
      summary: Ganha a oportunidade e cria a reserva a partir do orçamento vigente
      description: |
        O ponto do módulo inteiro: **ganhar não redigita nada** (critério de
        aceite do §7). Numa transação:

        1. lê o **orçamento vigente** da oportunidade (`quote_id`, ou o
           `quote_id` do corpo, que precisa ser da mesma oportunidade);
        2. cria a reserva como `hold` pelo mesmo caminho do
           `POST /reservations` — recalculando pelo motor e congelando
           `reservation_nights`, `rate_table_id`, `policy_version` e
           `cancellation_policy_id` — e aloca a(s) unidade(s);
        3. move a oportunidade para a etapa de tipo `ganho` do funil, gravando
           `crm_stage_history`;
        4. grava `status: ganha`, `reservation_id` e `probability: 100`;
        5. conclui as tarefas automáticas pendentes da oportunidade — cobrar
           follow-up de negócio fechado é ruído que ensina a ignorar o alerta;
        6. publica eventos nos tópicos `crm` **e** `calendar`: o mapa de ocupação
           de quem estiver com a tela aberta ganha o bloco na hora.

        ## Nasce `hold`, não `confirmed`

        Ganhar no CRM é o acordo comercial; `confirmed` é **dinheiro recebido**
        (§5). A reserva sai daqui segurando a data com `hold_expires_at` da
        política vigente, e o sinal continua entrando por
        `POST /reservations/{id}/confirm`. Nascer `confirmed` faria o financeiro
        gerar recebível quitado de um sinal que ninguém pagou.

        ## Idempotência

        `Idempotency-Key` é **obrigatório**: isto cria reserva. A mesma chave, do
        mesmo ator, com o mesmo corpo devolve a resposta original; com corpo
        diferente, `409 IDEMPOTENCY_MISMATCH`.

        ## Se a oportunidade já tem reserva

        Quando ela chegou à etapa "Pré-reserva" o hold já foi criado e
        `reservation_id` já está preenchido. Aí `/win` **não cria outra**: apenas
        fecha a oportunidade e devolve a reserva existente, com `200` (e não
        `201`, porque nada foi criado). Criar uma segunda reserva das mesmas datas
        seria, na melhor das hipóteses, `409 DATE_CONFLICT` contra a própria
        primeira.

        ## Quando não dá

        Sem orçamento vigente e sem `quote_id` no corpo, `422
        QUOTE_REQUIRED_TO_WIN` — sem preço congelado não há o que virar reserva,
        e inventar o preço na hora é exatamente o que o §3 proíbe. As recusas do
        motor de reservas valem inteiras aqui: `409 DATE_CONFLICT` (a data foi
        vendida enquanto se negociava — o caso mais comum e o mais importante de
        mostrar bem na tela), `422 MIN_STAY_NOT_MET`, `422 CAPACITY_EXCEEDED`,
        `422 COMPOSITION_INCOMPLETE`.

        Em qualquer recusa **nada muda**: a oportunidade continua aberta, na
        etapa em que estava. Fechar a oportunidade e falhar a reserva deixaria uma
        venda ganha sem venda.
      x-rbac: { recurso: crm.opportunities, acao: editar }
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 255 }
          description: "Obrigatório porque cria reserva. Escopada pelo ator — `(usuário, rota, chave)`, nunca `(rota, chave)`."
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoDeGanho" }
      responses:
        "200":
          description: Oportunidade fechada usando a reserva que ela já tinha.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ResultadoDeGanho" }
        "201":
          description: Reserva criada e oportunidade ganha.
          headers:
            Location: { description: "URI da reserva criada (`/reservations/{id}`).", schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ResultadoDeGanho" }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: |
            `OPPORTUNITY_ALREADY_CLOSED` · `DATE_CONFLICT` (com o intervalo em
            conflito em `details`) · `IDEMPOTENCY_MISMATCH`.
          $ref: "#/components/responses/Erro"
        "422":
          description: |
            `QUOTE_REQUIRED_TO_WIN` — sem orçamento vigente ·
            `MIN_STAY_NOT_MET` · `CAPACITY_EXCEEDED` · `COMPOSITION_INCOMPLETE` ·
            `VALIDATION_ERROR` — o funil não tem etapa de tipo `ganho`.
          $ref: "#/components/responses/Erro"

  /crm/opportunities/{id}/lose:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [CRM]
      summary: Perde a oportunidade — com motivo obrigatório
      description: |
        `lost_reason_id` é **obrigatório** (§7) e tem de ser um motivo ativo do
        catálogo. Sem ele, `422 LOSS_REASON_REQUIRED`.

        Não é burocracia: "motivos de perda" é um dos indicadores do §15, e é o
        único lugar em que a casa descobre que perdeu doze negócios por estadia
        mínima e não por preço. Motivo em texto livre opcional vira campo vazio
        em 90% dos cards e relatório nenhum. O `note` existe para o detalhe, ao
        lado do motivo — nunca no lugar dele.

        Numa transação: move para a etapa de tipo `perdido`, grava
        `crm_stage_history`, `status: perdida`, `lost_reason_id` e
        `probability: 0`, e **cancela** as tarefas automáticas pendentes.

        A oportunidade com pré-reserva atrelada **não** cancela a reserva por
        tabela: perder o negócio e liberar a data são duas decisões, e a segunda
        tem política de cancelamento e possível reembolso. A resposta traz
        `reservation` preenchida para a tela oferecer o
        `POST /reservations/{id}/cancel` logo em seguida.
      x-rbac: { recurso: crm.opportunities, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoDePerda" }
      responses:
        "200":
          description: Perdida
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ResultadoDePerda" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { description: "`OPPORTUNITY_ALREADY_CLOSED`.", $ref: "#/components/responses/Erro" }
        "422": { description: "`LOSS_REASON_REQUIRED` — ausente, desconhecido ou inativo · `VALIDATION_ERROR` — o funil não tem etapa de tipo `perdido`.", $ref: "#/components/responses/Erro" }
  /crm/activities:
    get:
      tags: [CRM]
      summary: Lista atividades e tarefas
      description: |
        Tarefa, ligação, reunião, e-mail, WhatsApp e nota — o mesmo registro,
        distinguido por `type`. Vínculo com lead, oportunidade ou contato.

        **Escopo `own`**: o corretor lista só as atividades de que é dono.
        Atividade sem dono não existe: `owner_id` é quem tem de fazer, e tarefa
        sem responsável é tarefa que ninguém faz.
      x-rbac: { recurso: crm.activities, acao: ver }
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: type,     in: query, schema: { type: string, example: "tarefa,ligacao" }, description: Um ou mais tipos separados por vírgula. }
        - { name: status,   in: query, schema: { type: string, example: pendente }, description: "Um ou mais de `pendente,concluida,cancelada`." }
        - { name: owner_id, in: query, schema: { type: string, format: uuid } }
        - { name: opportunity_id, in: query, schema: { type: string, format: uuid } }
        - { name: lead_id,        in: query, schema: { type: string, format: uuid } }
        - { name: contact_id,     in: query, schema: { type: string, format: uuid } }
        - { name: auto,     in: query, schema: { type: boolean }, description: "Só as automáticas (as que a entrada em etapa criou), ou só as manuais." }
        - { name: due_from, in: query, schema: { type: string, format: date } }
        - { name: due_to,   in: query, schema: { type: string, format: date } }
        - name: overdue
          in: query
          schema: { type: boolean }
          description: |
            `true` traz o que está `pendente` com `due_at < agora`. Derivado no
            servidor, com o "agora" de `America/Fortaleza` — o mesmo "hoje" do
            resto do sistema, e não o do relógio do navegador.
        - { name: sort, in: query, schema: { type: string, default: due_at, enum: [due_at, -due_at, created_at, -created_at, priority, -priority] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Atividade" }
                  - $ref: "#/components/schemas/Paginacao"
        "403": { $ref: "#/components/responses/Erro" }
    post:
      tags: [CRM]
      summary: Cria uma atividade
      description: |
        Pelo menos um vínculo entre `opportunity_id`, `lead_id` e `contact_id` é
        obrigatório — atividade solta não aparece em tela nenhuma e vira dado
        órfão. `owner_id` ausente assume o usuário autenticado.

        `auto` não é aceito no corpo: automática é a tarefa que o **servidor**
        criou ao entrar numa etapa, e deixar o cliente se declarar automática
        quebraria a idempotência dessa criação.
      x-rbac: { recurso: crm.activities, acao: criar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtividadeCriar" }
      responses:
        "201":
          description: Criada
          headers:
            Location: { description: URI do recurso criado., schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Atividade" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }

  /crm/activities/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [CRM]
      summary: Detalhe da atividade
      x-rbac: { recurso: crm.activities, acao: ver }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Atividade" }
        "404": { $ref: "#/components/responses/Erro" }
    put:
      tags: [CRM]
      summary: Substitui a atividade
      x-rbac: { recurso: crm.activities, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtividadeAtualizar" }
      responses:
        "200":
          description: Substituída
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Atividade" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    patch:
      tags: [CRM]
      summary: Atualiza a atividade
      description: |
        `status` e `done_at` ficam de fora: concluir é `POST /{id}/complete`, que
        carimba `done_at` no servidor. Deixar o cliente escrever `done_at`
        entregaria o "tempo médio de resposta" do §15 ao relógio do navegador.
        Cancelar é `status: cancelada`, e esse é o único valor de `status` aceito
        aqui.
      x-rbac: { recurso: crm.activities, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtividadeAtualizar" }
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Atividade" }
        "404": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      tags: [CRM]
      summary: Remove a atividade
      description: |
        Remoção física. Apagar a tarefa automática pendente de uma etapa é
        permitido — o operador que já resolveu por fora não deve ficar com um
        alerta eterno na tela — e ela **não** renasce sozinha: a criação só
        acontece numa nova entrada na etapa.
      x-rbac: { recurso: crm.activities, acao: excluir }
      responses:
        "204": { description: Removida }
        "404": { $ref: "#/components/responses/Erro" }

  /crm/activities/{id}/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [CRM]
      summary: Conclui a atividade
      description: |
        Grava `status: concluida` e `done_at` com o **relógio do servidor**, e
        publica evento no tópico `crm`.

        É **idempotente**: concluir de novo devolve `200` com o mesmo `done_at`,
        sem reescrever nada. O duplo clique no botão "Concluir" é o gesto mais
        comum da tela, e mover `done_at` para a frente falsearia o tempo de
        resposta do §15.

        Atividade `cancelada` recusa a conclusão com
        `409 INVALID_STATE_TRANSITION` — o caminho é reabrir com `PATCH`
        (`status: pendente`) e concluir depois.

        `next_activity` no corpo cria, na mesma transação, a **próxima** ação
        (o "concluir e agendar o próximo passo" da tela): mesma oportunidade,
        mesmo dono, novo prazo. Sem isso, a operação conclui e esquece — e o
        alerta de "cliente parado há N dias" vira o único lembrete.
      x-rbac: { recurso: crm.activities, acao: editar }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoDeConclusao" }
      responses:
        "200":
          description: Concluída — devolve a atividade e, se pedida, a próxima.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ResultadoDeConclusao" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { description: "`INVALID_STATE_TRANSITION` — atividade cancelada.", $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  responses:
    Erro:
      description: Erro com código estável
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    description: |
                      Vocabulário fechado e estável — o front reage ao `code`,
                      nunca ao texto de `message`. Espelhado em
                      `internal/platform/apperr`: acrescentar código aqui obriga
                      a acrescentar lá, e o contrário também.
                    enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, DATE_CONFLICT,
                           MIN_STAY_NOT_MET, CAPACITY_EXCEEDED, DISCOUNT_ABOVE_LIMIT, HOLD_EXPIRED,
                           IDEMPOTENCY_MISMATCH, RATE_LIMITED, INVALID_CREDENTIALS, TOKEN_INVALID,
                           TOKEN_REUSED, EMAIL_IN_USE, ROLE_IMMUTABLE, ROLE_IN_USE,
                           RATE_NOT_FOUND, POLICY_IMMUTABLE, CODE_IN_USE, RESOURCE_IN_USE,
                           INVALID_STATE_TRANSITION, RESERVATION_NOT_CANCELLABLE,
                           UNIT_NOT_AVAILABLE, COMPOSITION_INCOMPLETE, HOLD_LIMIT_REACHED,
                           STAGE_NOT_IN_PIPELINE, STAGE_ORDER_INCOMPLETE, DEFAULT_PIPELINE_REQUIRED,
                           OPPORTUNITY_ALREADY_CLOSED, LOSS_REASON_REQUIRED, QUOTE_REQUIRED_TO_WIN,
                           LEAD_ALREADY_CONVERTED,
                           INTERNAL]
                  message: { type: string }
                  details: { type: object, additionalProperties: true }

  schemas:
    Paginacao:
      type: object
      properties:
        meta:
          type: object
          properties:
            page:        { type: integer }
            per_page:    { type: integer }
            total:       { type: integer, format: int64 }
            total_pages: { type: integer }

    TipoDeData:
      type: string
      enum: [normal, fds, feriado, alta, reveillon, carnaval]
      description: Resolvido por precedência — réveillon/carnaval > feriado > alta > fds > normal.

    Permissao:
      type: object
      required: [resource, action, scope]
      properties:
        resource: { type: string, example: reservations, description: "Código vindo de `GET /roles/resources`." }
        action:   { type: string, enum: [ver, criar, editar, excluir] }
        scope:
          type: string
          enum: [all, own]
          default: all
          description: |
            `own` vira `AND owner_id = <usuário>` no SQL do repositório. Filtrar
            em memória depois da consulta faria a paginação mentir — `total` de
            uma página que o usuário nem pode ver.

    Perfil:
      type: object
      properties:
        id:        { type: string, format: uuid }
        code:      { type: string, example: corretor, description: "Estável: é por ele que seed, filtros e testes referenciam o perfil." }
        name:      { type: string, example: Corretor }
        is_system: { type: boolean, description: "Perfil de sistema (`admin`): não se renomeia, não se exclui e a matriz não se altera." }

    Usuario:
      type: object
      properties:
        id:      { type: string, format: uuid }
        name:    { type: string }
        email:   { type: string, format: email }
        phone:   { type: [string, "null"], example: "+5585999990000" }
        role_id: { type: string, format: uuid }
        role:
          type: string
          example: corretor
          description: |
            `code` do perfil. **Não é enum fechado** — perfil é dado, criável em
            `/roles`; front que faça `switch` por este valor quebra no primeiro
            perfil novo. Para decidir o que mostrar, use `permissions`.
        role_name: { type: string, example: Corretor }
        broker_id:
          type: [string, "null"]
          format: uuid
          description: Só leitura. Preenchido quando a conta é a de um corretor.
        active:  { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at:    { type: string, format: date-time }

    UsuarioCriar:
      type: object
      required: [name, email, password, role_id]
      properties:
        name:     { type: string, minLength: 2 }
        email:    { type: string, format: email, description: "Único. Colisão devolve 409 `EMAIL_IN_USE`." }
        password: { type: string, format: password, minLength: 8, description: "Guardado em argon2id; nunca volta em resposta nenhuma." }
        role_id:  { type: string, format: uuid, description: "Vale a mesma regra do `UsuarioAtualizar`: exige `roles:editar` e papel subconjunto do ator." }
        phone:    { type: [string, "null"], example: "+5585999990000" }
        active:   { type: boolean, default: true }

    UsuarioAtualizar:
      type: object
      description: |
        Corpo do `PATCH` (tudo opcional) e base do `PUT`. Campo **ausente** não
        muda nada; campo com `null` limpa — é a distinção que o `Opt[T]` do Go
        carrega e que um `map[string]any` perderia.
      properties:
        name:     { type: string, minLength: 2 }
        email:    { type: string, format: email }
        password: { type: string, format: password, minLength: 8, description: "Trocar a senha revoga todas as sessões do usuário." }
        role_id:
          type: string
          format: uuid
          description: |
            Muda o perfil; passa a valer na requisição seguinte, sem novo login.

            Atribuir papel é ato de administração de acesso: exige
            `roles:editar` (não basta `usuarios:editar`), e o papel alvo só é
            aceito se a matriz dele for **subconjunto** da do ator — ninguém
            concede o que não tem, senão editar usuário vira escalada de
            privilégio em um passo. Fora disso: `403 FORBIDDEN`.

            Trocar o **próprio** `role_id` é recusado com `422
            VALIDATION_ERROR`, pela mesma razão que ninguém se desativa: o
            caminho para uma instalação sem administrador não pode passar por
            um clique distraído.
        phone:    { type: [string, "null"] }
        active:   { type: boolean, description: "`false` bloqueia o login e revoga as sessões — mesmo efeito do `DELETE`." }


    # ─────────────────────────── Inventário ───────────────────────────

    Propriedade:
      type: object
      properties:
        id:       { type: string, format: uuid }
        name:     { type: string, example: White House Village }
        slug:     { type: string, example: white-house-village, description: "Estável: chave natural do seed." }
        timezone: { type: string, example: America/Fortaleza, description: "Define o \"hoje\" do sistema inteiro — antecedência de cancelamento, expiração de hold e classificação de noite saem daqui." }
        address:  { type: [string, "null"] }
        city:     { type: [string, "null"] }
        state:    { type: [string, "null"] }
        active:   { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PropriedadeAtualizar:
      type: object
      description: Corpo do `PATCH` — tudo opcional. Campo ausente não muda nada; `null` limpa.
      properties:
        name:     { type: string, minLength: 2 }
        timezone: { type: string, example: America/Fortaleza }
        address:  { type: [string, "null"] }
        city:     { type: [string, "null"] }
        state:    { type: [string, "null"] }
        active:   { type: boolean }

    Consumo:
      type: string
      enum: [one_member, all_members]
      description: |
        Quantas unidades da composição uma venda deste produto ocupa.

        `one_member` — uma unidade, escolhida pelo alocador (apto 2 suítes,
        suíte da piscina, cobertura).

        `all_members` — **todas** (a White House Completa). A venda insere uma
        linha de `stay_blocks` por unidade, e é daí que a exclusividade vem de
        graça: qualquer unidade ocupada estoura a constraint.

    Produto:
      type: object
      description: O que se vende (`unit_types`). Não confundir com `Unidade`, que é o que se ocupa e se limpa.
      properties:
        id:   { type: string, format: uuid }
        code: { type: string, example: COMPLETA, description: "Estável dentro da propriedade — é por ele que seed, filtros e testes referenciam o produto." }
        name: { type: string, example: White House Completa }
        capacity:
          type: integer
          minimum: 1
          example: 24
          description: |
            Limite operacional **declarado**, não somado. A Completa acomoda 24
            embora a soma das unidades dê 40: é decisão dos proprietários sobre
            evento, e o sistema não a recalcula.
        consumes: { $ref: "#/components/schemas/Consumo" }
        cleaning_fee_cents:
          type: integer
          format: int64
          minimum: 0
          example: 90000
          description: Cobrada **uma vez por estadia**, nunca por noite, e o desconto nunca incide sobre ela.
        description: { type: [string, "null"] }
        sort_order:  { type: integer, description: "Ordem do catálogo comercial na tela. É dado, não alfabética." }
        active:      { type: boolean }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    ProdutoCriar:
      type: object
      description: Corpo do `POST` e do `PUT` (substituição integral).
      required: [code, name, capacity, consumes]
      properties:
        code:     { type: string, minLength: 2, example: AP2S }
        name:     { type: string, minLength: 2 }
        capacity: { type: integer, minimum: 1 }
        consumes: { $ref: "#/components/schemas/Consumo" }
        cleaning_fee_cents: { type: integer, format: int64, minimum: 0, default: 0 }
        description: { type: [string, "null"] }
        sort_order:  { type: integer, default: 0 }
        active:      { type: boolean, default: true }

    ProdutoAtualizar:
      type: object
      description: Corpo do `PATCH` — tudo opcional. Campo ausente não muda nada; `null` limpa.
      properties:
        code:     { type: string, minLength: 2 }
        name:     { type: string, minLength: 2 }
        capacity: { type: integer, minimum: 1 }
        consumes: { $ref: "#/components/schemas/Consumo" }
        cleaning_fee_cents: { type: integer, format: int64, minimum: 0 }
        description: { type: [string, "null"] }
        sort_order:  { type: integer }
        active:      { type: boolean }

    Unidade:
      type: object
      description: |
        A unidade física (`units`) — o que é efetivamente ocupado e limpo, e o
        que a constraint `stay_no_overlap` protege.

        Não carrega produto: o vínculo é a composição (`unit_type_members`), e é
        muitos-para-muitos de propósito — `AP-01` pertence ao Apartamento 2
        Suítes **e** à White House Completa.
      properties:
        id:   { type: string, format: uuid }
        code: { type: string, example: AP-01, description: "Identidade operacional e chave de ordenação. Toda inserção em lote ordena por ele — ordens divergentes causam deadlock." }
        name: { type: string, example: Apartamento 01 }
        floor: { type: [string, "null"], example: Térreo }
        notes: { type: [string, "null"] }
        sort_order: { type: integer }
        active:     { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UnidadeCriar:
      type: object
      description: Corpo do `POST` e do `PUT` (substituição integral).
      required: [code, name]
      properties:
        code:  { type: string, minLength: 2, example: AP-01 }
        name:  { type: string, minLength: 2 }
        floor: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        sort_order: { type: integer, default: 0 }
        active:     { type: boolean, default: true }

    UnidadeAtualizar:
      type: object
      description: Corpo do `PATCH` — tudo opcional.
      properties:
        code:  { type: string, minLength: 2 }
        name:  { type: string, minLength: 2 }
        floor: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        sort_order: { type: integer }
        active:     { type: boolean }

    UnidadeDaComposicao:
      type: object
      description: Item de `unit_type_members`, sempre ordenado por `code`.
      properties:
        unit_id:   { type: string, format: uuid }
        unit_code: { type: string, example: AP-01 }
        unit_name: { type: string }
        active:    { type: boolean, description: "Unidade inativa continua na composição, mas não é alocada nem contada como livre." }

    # ─────────────────────── Tarifário e política ─────────────────────

    TabelaDeTarifas:
      type: object
      properties:
        id:   { type: string, format: uuid }
        name: { type: string, example: Tabela Comercial V1, description: "Chave natural `UNIQUE (property_id, name)` — é por ela que o seed reencontra a própria linha." }
        valid_from: { type: string, format: date }
        valid_to:   { type: [string, "null"], format: date, description: "`null` = sem fim." }
        active:     { type: boolean }
        created_at: { type: string, format: date-time }

    TabelaDeTarifasEntrada:
      type: object
      required: [name, valid_from]
      properties:
        name:       { type: string, minLength: 2 }
        valid_from: { type: string, format: date }
        valid_to:   { type: [string, "null"], format: date }
        active:     { type: boolean, default: true }

    TabelaDeTarifasAtualizar:
      type: object
      description: Corpo do `PATCH` — tudo opcional.
      properties:
        name:       { type: string, minLength: 2 }
        valid_from: { type: string, format: date }
        valid_to:   { type: [string, "null"], format: date }
        active:     { type: boolean }

    Tarifa:
      type: object
      description: Uma célula da grade produto × tipo de data. Chave `UNIQUE (rate_table_id, unit_type_id, date_type)`.
      properties:
        id:            { type: string, format: uuid }
        rate_table_id: { type: string, format: uuid }
        unit_type_id:  { type: string, format: uuid }
        unit_type_code: { type: string, example: AP2S, description: "Só leitura, para a grade não precisar de outra consulta." }
        date_type:     { $ref: "#/components/schemas/TipoDeData" }
        amount_cents:  { type: integer, format: int64, minimum: 1, example: 85000, description: "Valor da diária, em centavos. Nunca float." }

    TarifaEntrada:
      type: object
      required: [rate_table_id, unit_type_id, date_type, amount_cents]
      properties:
        rate_table_id: { type: string, format: uuid }
        unit_type_id:  { type: string, format: uuid }
        date_type:     { $ref: "#/components/schemas/TipoDeData" }
        amount_cents:  { type: integer, format: int64, minimum: 1 }

    TarifaAtualizar:
      type: object
      description: Corpo do `PATCH` — tudo opcional.
      properties:
        amount_cents: { type: integer, format: int64, minimum: 1 }
        date_type:    { $ref: "#/components/schemas/TipoDeData" }
        unit_type_id: { type: string, format: uuid }

    TarifaDaGrade:
      type: object
      description: Célula no corpo de `POST /rates/bulk`. A tabela vem uma vez só, no nível de cima.
      required: [unit_type_id, date_type, amount_cents]
      properties:
        unit_type_id: { type: string, format: uuid }
        date_type:    { $ref: "#/components/schemas/TipoDeData" }
        amount_cents: { type: integer, format: int64, minimum: 1 }

    GradeParaSalvar:
      type: object
      description: |
        Corpo do `POST /rates/bulk`. Duas coisas, e a distinção é o coração da
        rota: **`unit_type_ids` é o escopo** (quais produtos esta chamada
        reescreve) e **`rates` é o conteúdo** (as células que ficam).
      required: [rate_table_id]
      properties:
        rate_table_id: { type: string, format: uuid }
        unit_type_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Os produtos que esta chamada substitui. Ausente, vale o conjunto de
            `unit_type_id` distintos que aparecem em `rates` — o caminho comum da
            tela.

            Presente, é o **escopo declarado**: todo produto da lista tem a grade
            reescrita, e produto da lista **sem nenhuma célula em `rates` é
            zerado**. É por isso que a lista existe separada: apagar tarifa passa
            a exigir nomear o produto, em vez de acontecer por omissão.

            Vazia (`[]`) com `rates` vazio não faz nada e responde `200` com
            `meta` zerado — chamada sem efeito não é erro, é a tela salvando um
            formulário que ninguém alterou.
        rates:
          type: array
          default: []
          description: |
            As células que ficam, para os produtos do escopo. Um produto pode
            aparecer com todas as suas células, com algumas (as ausentes são
            removidas) ou com nenhuma (é zerado).
          items: { $ref: "#/components/schemas/TarifaDaGrade" }

    MetaDaGrade:
      type: object
      description: |
        O que a chamada fez, em números. A tela mostra "18 células mantidas, 6
        atualizadas, 0 removidas" — e é assim que um `removed` inesperado aparece
        para quem salvou, em vez de ser descoberto quando a venda falha.
      properties:
        unit_type_ids:
          type: array
          items: { type: string, format: uuid }
          description: O escopo efetivamente aplicado — útil quando o cliente não mandou a lista e quer conferir o que a API deduziu de `rates`.
        created: { type: integer, description: Células que não existiam e passaram a existir. }
        updated: { type: integer, description: "Células que existiam e mudaram de `amount_cents`. Célula reenviada com o mesmo valor não conta aqui — ela é `unchanged`." }
        unchanged: { type: integer, description: Células reenviadas idênticas ao que já estava gravado. }
        removed:  { type: integer, description: "Células que existiam nos produtos do escopo e não vieram no corpo. **Só produto do escopo entra nesta conta** — é este número que a semântica antiga inflava com as células de quem nem foi citado." }

    Feriado:
      type: object
      properties:
        id:     { type: string, format: uuid }
        date:   { type: string, format: date, description: "Chave natural `UNIQUE (property_id, date)`." }
        name:   { type: string, example: Independência }
        active: { type: boolean, description: Feriado inativo deixa de classificar a noite como `feriado` nos cálculos seguintes. }

    FeriadoEntrada:
      type: object
      required: [date, name]
      properties:
        date:   { type: string, format: date }
        name:   { type: string, minLength: 2 }
        active: { type: boolean, default: true }

    FeriadoAtualizar:
      type: object
      description: Corpo do `PATCH` — tudo opcional.
      properties:
        date:   { type: string, format: date }
        name:   { type: string, minLength: 2 }
        active: { type: boolean }

    PeriodoEspecial:
      type: object
      description: |
        Faixa do calendário comercial, **inclusiva nas duas pontas**
        (`starts_on`..`ends_on`) — ao contrário da estadia, que é half-open.
        Períodos podem se sobrepor; a precedência resolve.
      properties:
        id:   { type: string, format: uuid }
        name: { type: string, example: Réveillon 2026/2027, description: "Chave natural `UNIQUE (property_id, name)` — por isso carrega o ano: o Réveillon do ano seguinte é linha nova, não edição desta." }
        kind: { type: string, enum: [reveillon, carnaval, alta, evento] }
        starts_on: { type: string, format: date }
        ends_on:   { type: string, format: date, description: "Inclusivo." }
        active:    { type: boolean }

    PeriodoEspecialEntrada:
      type: object
      required: [name, kind, starts_on, ends_on]
      properties:
        name: { type: string, minLength: 2 }
        kind: { type: string, enum: [reveillon, carnaval, alta, evento] }
        starts_on: { type: string, format: date }
        ends_on:   { type: string, format: date }
        active:    { type: boolean, default: true }

    PeriodoEspecialAtualizar:
      type: object
      description: Corpo do `PATCH` — tudo opcional.
      properties:
        name: { type: string, minLength: 2 }
        kind: { type: string, enum: [reveillon, carnaval, alta, evento] }
        starts_on: { type: string, format: date }
        ends_on:   { type: string, format: date }
        active:    { type: boolean }

    MinimoDeNoites:
      type: object
      properties:
        id:            { type: string, format: uuid }
        rate_table_id: { type: string, format: uuid }
        date_type:     { $ref: "#/components/schemas/TipoDeData" }
        nights:        { type: integer, minimum: 1, example: 4, description: "Vale o **maior** mínimo entre as noites da estadia." }

    MinimoDeNoitesEntrada:
      type: object
      required: [rate_table_id, date_type, nights]
      properties:
        rate_table_id: { type: string, format: uuid }
        date_type:     { $ref: "#/components/schemas/TipoDeData" }
        nights:        { type: integer, minimum: 1 }

    MinimoDeNoitesAtualizar:
      type: object
      description: Corpo do `PATCH` — tudo opcional.
      properties:
        date_type: { $ref: "#/components/schemas/TipoDeData" }
        nights:    { type: integer, minimum: 1 }

    PoliticaComercial:
      type: object
      description: |
        Versionada. A reserva grava `policy_version` na criação, e é essa versão
        que vale para ela até o fim — publicar uma política nova não reprecifica
        nem re-arbitra nada que já foi emitido.
      properties:
        id:      { type: string, format: uuid }
        version: { type: integer, description: "Só leitura. O servidor atribui `max(version) + 1` em cada `PUT`." }
        deposit_pct:      { type: number, example: 50, description: "Sinal para confirmar, em % do total." }
        balance_due_days: { type: integer, example: 7, description: "Saldo vence N dias antes do check-in." }
        hold_hours:       { type: integer, example: 48, description: "Validade da pré-reserva sem pagamento." }
        discount_auto_pct:     { type: number, example: 5,  description: "Até aqui a gestão fecha sozinha (`discount_authority = gestao`)." }
        discount_approval_pct: { type: number, example: 10, description: "Até aqui, com aprovação do proprietário (`proprietario`). Acima, `negado` — e o orçamento não sai." }
        event_deposit_cents:   { type: integer, format: int64, example: 200000, description: "Caução de evento, cobrada como recebível reembolsável." }
        valid_from: { type: string, format: date }
        created_at: { type: string, format: date-time }

    PoliticaComercialEntrada:
      type: object
      description: |
        Corpo do `PUT`. `version` **não** é aceito: quem numera é o servidor.
      required: [deposit_pct, balance_due_days, hold_hours, discount_auto_pct, discount_approval_pct, valid_from]
      properties:
        deposit_pct:      { type: number, minimum: 0, maximum: 100 }
        balance_due_days: { type: integer, minimum: 0 }
        hold_hours:       { type: integer, minimum: 1 }
        discount_auto_pct:     { type: number, minimum: 0, maximum: 100 }
        discount_approval_pct: { type: number, minimum: 0, maximum: 100, description: "Precisa ser `>= discount_auto_pct` — a faixa de aprovação não pode ser menor que a automática." }
        event_deposit_cents:   { type: integer, format: int64, minimum: 0, default: 0 }
        valid_from: { type: string, format: date, description: "Não pode ser anterior ao `valid_from` da vigente." }

    FaixaDeCancelamento:
      type: object
      description: |
        Faixa por antecedência, em dias até o `check_in`. `null` nos limites é
        "sem piso" / "sem teto" — é o `-1` do `booking.Tier` traduzido para SQL.
      properties:
        days_before_min: { type: [integer, "null"], example: 7,  description: "Inclusivo. `null` = sem piso." }
        days_before_max: { type: [integer, "null"], example: 29, description: "Inclusivo. `null` = sem teto." }
        refund_pct:      { type: number, example: 50, description: "Percentual **do sinal** devolvido." }
        label:           { type: string, example: Retenção de 50% do sinal, description: É este texto que a tela mostra e que volta em `/cancel`. }
        sort_order:      { type: integer, description: "Ordem de avaliação, da mais generosa à mais restritiva. Chave natural `UNIQUE (policy_id, sort_order)`." }

    PoliticaDeCancelamento:
      type: object
      properties:
        id:      { type: string, format: uuid }
        version: { type: integer, description: Só leitura — atribuída pelo servidor. }
        name:    { type: string, example: Padrão White House }
        valid_from: { type: string, format: date }
        tiers:
          type: array
          description: Ordenadas por `sort_order`.
          items: { $ref: "#/components/schemas/FaixaDeCancelamento" }

    PoliticaDeCancelamentoEntrada:
      type: object
      description: Corpo do `PUT`. Cria versão nova com as faixas inteiras; `version` é do servidor.
      required: [name, valid_from, tiers]
      properties:
        name:       { type: string, minLength: 2 }
        valid_from: { type: string, format: date }
        tiers:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/FaixaDeCancelamento" }

    # ────────────────── Disponibilidade e orçamento ───────────────────

    PedidoDeOrcamento:
      type: object
      description: |
        O pedido. Nenhum valor entra por aqui: o servidor recalcula tudo pelo
        motor `internal/domain/booking`.
      required: [unit_type_id, check_in, check_out, guests_count]
      properties:
        unit_type_id: { type: string, format: uuid }
        check_in:     { type: string, format: date }
        check_out:    { type: string, format: date, description: "Exclusivo: a noite do check-out não é cobrada." }
        guests_count:
          type: integer
          minimum: 1
          description: |
            Número de hóspedes. **Era `guests` até 26/08/2026** — o mesmo dado
            tinha dois nomes, `guests` na criação e `guests_count` na edição e em
            toda resposta. Quem escrevia o cliente acertava a criação e errava a
            edição sem receber erro nenhum: medido, `PATCH` com `{"guests": 6}`
            respondia `200` e mantinha 4.
        discount_pct: { type: number, default: 0, minimum: 0, maximum: 100 }
        is_event:     { type: boolean, default: false, description: "`true` acrescenta a caução de evento da política ao total." }
        rate_table_id:
          type: string
          format: uuid
          description: |
            Força uma tabela específica em vez da vigente. Existe para reproduzir
            um orçamento antigo centavo a centavo — não para escolher preço na
            venda.
        policy_version:
          type: integer
          description: Idem, para a política comercial.

    LinhaDoOrcamento:
      type: object
      description: As noites agrupadas por tipo de tarifa, na ordem em que o hóspede vive a estadia.
      properties:
        date_type: { $ref: "#/components/schemas/TipoDeData" }
        label:     { type: string, example: Fim de semana }
        nights:    { type: integer, example: 2 }
        unit_price_cents: { type: integer, format: int64 }
        subtotal_cents:   { type: integer, format: int64 }

    NoiteDoOrcamento:
      type: object
      properties:
        date:        { type: string, format: date }
        date_type:   { $ref: "#/components/schemas/TipoDeData" }
        label:       { type: string, example: Réveillon }
        price_cents: { type: integer, format: int64 }

    Orcamento:
      type: object
      description: |
        Saída de `booking.Build`. O cálculo vem aberto de propósito: a gestão
        precisa explicar o número ao hóspede, e o front nunca recalcula nada.

        `total = subtotal − desconto + limpeza + caução`. O arredondamento
        acontece **no total**, nunca noite a noite.
      properties:
        night_count:    { type: integer }
        subtotal_cents: { type: integer, format: int64, description: Soma das noites. }
        discount_pct:   { type: number }
        discount_cents: { type: integer, format: int64, description: "Incide **só** sobre as diárias — nunca sobre limpeza nem sobre caução." }
        cleaning_cents: { type: integer, format: int64, description: Cobrada uma vez por estadia. }
        event_deposit_cents: { type: integer, format: int64, description: "Caução de evento, reembolsável. Zero quando `is_event = false`." }
        total_cents:    { type: integer, format: int64 }
        deposit_cents:  { type: integer, format: int64, description: "Sinal para confirmar (`total × deposit_pct`)." }
        balance_cents:  { type: integer, format: int64, description: "`total − sinal`, vencendo `balance_due_days` antes do check-in." }
        avg_nightly_cents: { type: integer, format: int64, description: "`total / noites` — a diária média que a tela mostra." }
        min_nights:     { type: integer, description: "O **maior** mínimo entre as noites da estadia." }
        discount_authority:
          type: string
          enum: [gestao, proprietario, negado]
          description: |
            Alçada do desconto pedido, pela política vigente: `gestao` fecha
            agora, `proprietario` exige aprovação, `negado` não sai (a resposta
            é `422 DISCOUNT_ABOVE_LIMIT`).
        policy_version: { type: integer, description: A versão que este cálculo usou — a mesma que a reserva congelaria. }
        rate_table_id:  { type: string, format: uuid, description: A tabela de tarifas usada. }
        lines:
          type: array
          items: { $ref: "#/components/schemas/LinhaDoOrcamento" }
        nights:
          type: array
          description: Noite a noite — é exatamente o que vira `reservation_nights` se o orçamento virar reserva.
          items: { $ref: "#/components/schemas/NoiteDoOrcamento" }

    DisponibilidadeDoProduto:
      type: object
      properties:
        unit_type_id:   { type: string, format: uuid }
        unit_type_code: { type: string, example: AP2S }
        name:           { type: string, example: Apartamento 2 Suítes }
        consumes:       { $ref: "#/components/schemas/Consumo" }
        total_units:
          type: integer
          example: 3
          description: |
            Unidades na composição (`unit_type_members`), ativas ou não. É o
            tamanho **declarado** do produto, e não muda porque alguém desativou
            uma unidade.
        active_units:
          type: integer
          example: 3
          description: |
            Quantas dessas unidades estão ativas. Para `all_members`,
            `active_units < total_units` significa produto que **não pode ser
            entregue**: a Completa é a casa inteira, e 7 de 8 não é a casa
            inteira. Nesse caso `available` é 0 em todos os dias.
        days:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              available:
                type: integer
                description: |
                  Quantas unidades da composição estão livres **e vendáveis**
                  nesse dia — unidade ativa, sem bloqueio que conte, e com tarifa
                  na tabela vigente. É o número que a venda honra: `available > 0`
                  e `POST /quotes` recusando a mesma data é defeito, não
                  concorrência.

                  Para `all_members` é **0 ou 1**: a White House Completa só é
                  livre quando todas estão.
              unavailable_reason:
                type: [string, "null"]
                enum: [ocupado, sem_tarifa, composicao_incompleta, unidade_inativa, null]
                description: |
                  Por que `available` é 0 — `null` quando é maior que zero. A
                  tela usa no tooltip da célula cinza, e é o que separa "já
                  vendido" (avisar o hóspede) de "sem tarifa cadastrada"
                  (avisar a gestão, que tem uma configuração pela metade).

                  Quando mais de um motivo se aplica, vale o que a gestão precisa
                  agir primeiro: `composicao_incompleta` > `sem_tarifa` >
                  `unidade_inativa` > `ocupado`.
              date_type:   { $ref: "#/components/schemas/TipoDeData" }
              price_cents: { type: integer, format: int64, description: "Tarifa da noite na tabela vigente. `null` quando não há tarifa cadastrada — e então `available` é 0 com `unavailable_reason: sem_tarifa`, porque é a mesma condição que geraria `RATE_NOT_FOUND` no orçamento." }
              min_nights:  { type: integer, description: "Mínimo do tipo de data dessa noite, na tabela vigente." }

    LinhaDoMapa:
      type: object
      description: Uma unidade física e seus dias, na ordem de `units.code`.
      properties:
        unit_id:   { type: string, format: uuid }
        unit_code: { type: string, example: COB-01 }
        unit_name: { type: string }
        days:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              status:
                type: string
                enum: [livre, hold, confirmed, checked_out, maintenance, owner_hold, ota]
                description: |
                  **Vocabulário de APRESENTAÇÃO, e não o de `stay_blocks`.** A
                  metade dele nem existe como status de bloco: `livre` é ausência
                  de linha, e `maintenance`, `owner_hold` e `ota` vêm do `source`,
                  não do `status`. A célula `checked_out` é o nome de tela do
                  bloco **`completed`** — o mesmo dado que `Bloqueio.status`
                  publica pelo nome do banco.

                  A tradução, escrita por inteiro para ninguém precisar deduzi-la:
                  bloco `hold` → `hold`; bloco `confirmed` → `confirmed`; bloco
                  `completed` → **`checked_out`**; bloco `cancelled` ou `expired`
                  → a célula some e o dia volta a `livre`, sem que o histórico
                  desapareça da tabela.

                  `checked_out` é estadia **cumprida**: não conta para a
                  constraint, a data é vendável de novo, e mesmo assim a célula
                  continua nomeando a reserva e o hóspede. É o que impede a
                  ocupação realizada de evaporar do mapa depois do check-out.

                  Quando o mesmo dia tem um bloco ativo e um `completed`
                  (back-to-back, realocação), **vence o ativo**: o mapa mostra
                  quem está na casa, nunca quem já saiu. É um dia com DUAS linhas
                  em `stay_blocks` — legítimo, porque `completed` está fora da
                  `EXCLUDE` — e a rota devolve UMA célula por (unidade, dia).
                  Sem esse desempate a grade da tela recebia 91 células para uma
                  janela de 90 dias e saía desalinhada.
              date_type:        { $ref: "#/components/schemas/TipoDeData" }
              stay_block_id:    { type: [string, "null"], format: uuid }
              reservation_id:   { type: [string, "null"], format: uuid }
              reservation_code: { type: [string, "null"], example: WH-2026-0001 }
              guest_name:       { type: [string, "null"], description: "Nome do hóspede titular, para o mapa não precisar de outra consulta." }

    # ─────────────────────────── Reservas ─────────────────────────────

    EstadoDaReserva:
      type: string
      enum: [quote, hold, confirmed, checked_in, checked_out, closed, cancelled, expired, no_show]
      description: |
        `quote → hold → confirmed → checked_in → checked_out → closed`, com
        `cancelled`, `expired` e `no_show` como saídas.

        Bloqueiam o calendário: `hold`, `confirmed` e `checked_in`. Não bloqueiam:
        `quote`, `checked_out`, `closed`, `cancelled`, `expired` e `no_show`.

        O bloqueio em si não é este campo — é o status das linhas de
        `stay_blocks`, que é o que a constraint `stay_no_overlap` enxerga. O
        mapeamento é: `hold` → bloco `hold`; `confirmed` e `checked_in` → bloco
        `confirmed`; `checked_out` e `closed` → bloco **`completed`**; `cancelled`
        e `no_show` → bloco `cancelled`; `expired` → bloco `expired`.

        **Os dois vocabulários não são o mesmo, e a diferença de nome é
        deliberada.** Este enum é o estado COMERCIAL da venda; `Bloqueio.status`
        é o estado da linha de calendário. `checked_out` (a venda) e `completed`
        (o bloco) são a mesma estadia vista de dois lados, e o contrato dizia
        `checked_out` nos dois lugares enquanto o banco gravava `completed` —
        contradição corrigida em 26/08/2026, na direção do banco, que é quem
        recusa o valor errado.

    Reserva:
      type: object
      properties:
        id:     { type: string, format: uuid }
        code:   { type: string, example: WH-2026-0001, description: "Legível, sequencial por ano e **imutável** — é por ele que a gestão fala da reserva ao telefone." }
        status: { $ref: "#/components/schemas/EstadoDaReserva" }
        unit_type_id:   { type: string, format: uuid }
        unit_type_name: { type: string, example: White House Completa }
        contact_id:     { type: string, format: uuid }
        contact_name:   { type: string }
        broker_id:      { type: [string, "null"], format: uuid }
        source:         { type: string, default: direto, example: direto }
        check_in:  { type: string, format: date }
        check_out: { type: string, format: date, description: "Exclusivo: a noite do check-out não é cobrada e a data já fica livre para outro hóspede (back-to-back)." }
        night_count:   { type: integer, description: "`check_out − check_in`, o número de linhas em `reservation_nights`." }
        guests_count:  { type: integer, minimum: 1 }
        is_event:      { type: boolean }
        event_type:    { type: [string, "null"] }
        subtotal_cents:      { type: integer, format: int64, description: "Soma das noites, como foram congeladas." }
        discount_pct:        { type: number }
        discount_cents:      { type: integer, format: int64, description: Incide só sobre as diárias. }
        cleaning_cents:      { type: integer, format: int64, description: Uma vez por estadia. }
        event_deposit_cents: { type: integer, format: int64 }
        total_cents:   { type: integer, format: int64 }
        deposit_cents: { type: integer, format: int64, description: Sinal para confirmar. }
        balance_cents: { type: integer, format: int64, description: "`total − sinal`, vencendo `balance_due_days` antes do check-in." }
        rate_table_id:
          type: [string, "null"]
          format: uuid
          description: |
            **Snapshot.** A tabela de tarifas usada no cálculo. Congelada aqui
            para que mudar o tarifário amanhã não reescreva esta reserva.
        policy_version:
          type: [integer, "null"]
          description: "**Snapshot** da política comercial (sinal, prazo de saldo, hold, alçada) vigente na criação."
        cancellation_policy_id:
          type: [string, "null"]
          format: uuid
          description: "**Snapshot** da política de cancelamento. É a versão que `/cancel` aplica, não a vigente hoje."
        hold_expires_at: { type: [string, "null"], format: date-time, description: "Preenchido só em `hold`. Vencido, o job libera as unidades." }
        confirmed_at:    { type: [string, "null"], format: date-time }
        cancelled_at:    { type: [string, "null"], format: date-time }
        cancel_reason:   { type: [string, "null"], example: remarcacao }
        rebooked_from_id: { type: [string, "null"], format: uuid, description: Preenchido quando a reserva nasceu de uma remarcação. }
        notes:      { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        units:
          type: array
          description: Unidades físicas alocadas, na ordem de `code`. A White House Completa aloca todas as oito.
          items: { $ref: "#/components/schemas/UnidadeAlocada" }

    UnidadeAlocada:
      type: object
      description: Linha de `reservation_units`.
      properties:
        unit_id:       { type: string, format: uuid }
        unit_code:     { type: string, example: AP-02 }
        unit_name:     { type: string }
        stay_block_id: { type: [string, "null"], format: uuid, description: A linha de `stay_blocks` que segura a data desta unidade. }
        locked:
          type: boolean
          description: |
            `true` quando a escolha foi travada pela gestão (o hóspede pediu
            aquele apartamento). Unidade travada sai da realocação automática.

    NoiteDaReserva:
      type: object
      description: |
        Linha de `reservation_nights` — o snapshot que faz auditoria, financeiro
        e BI funcionarem. É o preço que **foi** aplicado, não o que a tabela diz
        hoje.
      properties:
        night:       { type: string, format: date }
        date_type:   { $ref: "#/components/schemas/TipoDeData" }
        price_cents: { type: integer, format: int64 }

    HospedeDaReserva:
      type: object
      description: Rooming list — titular e acompanhantes (`reservation_guests`).
      properties:
        contact_id:    { type: string, format: uuid }
        name:          { type: string }
        phone_e164:    { type: [string, "null"], example: "+5585999990000" }
        is_lead_guest: { type: boolean, description: O titular da estadia. }

    EventoDaReserva:
      type: object
      description: |
        Linha de `reservation_events` — **append-only**. Nada aqui é editado nem
        apagado: é a prova de quem fez o quê e quando.
      properties:
        id:   { type: string, format: uuid }
        type:
          type: string
          example: confirmed
          description: |
            Vocabulário aberto, gravado pelo módulo: `created`, `confirmed`,
            `hold_extended`, `unit_reassigned`, `rescheduled`, `credit_issued`,
            `checked_in`, `checked_out`, `cancelled`, `expired`, `no_show`.

            `credit_issued` é o dinheiro do hóspede que a reserva nova não
            consumiu numa remarcação para estadia mais barata. `payload`:
            `credit_cents`, `paid_cents`, `applied_cents`, `reason` e
            `from_reservation_id`. É append-only e é o único registro que a
            Fase 1 tem desse saldo — `payables`/`receivables` são de outra fase.

            O evento `confirmed` de uma reserva herdada carrega, além de
            `deposit_paid_cents`, os campos `inherited: true`,
            `inherited_from_cents` (o valor BRUTO, sem o qual a trilha não
            permite refazer a conta) e `credit_cents`.
        payload:  { type: [object, "null"], additionalProperties: true, description: "Dados do evento — valor pago, prazo novo, unidade anterior, motivo." }
        actor_id: { type: [string, "null"], format: uuid, description: "`null` quando o autor é o job de expiração, não uma pessoa." }
        at:       { type: string, format: date-time }

    ReservaCompleta:
      type: object
      description: |
        Tudo o que a tela da reserva precisa, numa chamada. Os totais e as
        noites vêm do snapshot da reserva — não são recalculados na leitura,
        senão a tela mostraria o preço de hoje para uma venda de ontem.
      properties:
        reservation: { $ref: "#/components/schemas/Reserva" }
        nights:
          type: array
          items: { $ref: "#/components/schemas/NoiteDaReserva" }
        lines:
          type: array
          description: As noites agrupadas por tipo de tarifa, como no orçamento ("Fim de semana 2× R$ 4.800").
          items: { $ref: "#/components/schemas/LinhaDoOrcamento" }
        units:
          type: array
          items: { $ref: "#/components/schemas/UnidadeAlocada" }
        guests:
          type: array
          description: |
            A rooming list — as **pessoas**. Não confundir com
            `reservation.guests_count`, que é **quantas** foram vendidas. Os dois
            podem divergir de propósito: a reserva é de 6 hóspedes e só 2 nomes
            foram informados até agora.
          items: { $ref: "#/components/schemas/HospedeDaReserva" }
        timeline:
          type: array
          description: Ordenada do mais recente para o mais antigo.
          items: { $ref: "#/components/schemas/EventoDaReserva" }
        cancellation_preview:
          description: |
            O que aconteceria se a reserva fosse cancelada agora, pela política
            congelada nela — o mesmo cálculo do `?dry_run=1`. `null` quando a
            reserva não é mais cancelável.
          oneOf:
            - { $ref: "#/components/schemas/ResultadoDeCancelamento" }
            - { type: "null" }

    ReservaCriar:
      type: object
      description: |
        Corpo do `POST /reservations`. É o pedido de orçamento mais o cliente —
        os valores **não** vêm daqui: o servidor recalcula tudo pelo motor e
        congela o resultado.
      required: [unit_type_id, check_in, check_out, guests_count, contact_id]
      properties:
        unit_type_id: { type: string, format: uuid }
        check_in:     { type: string, format: date }
        check_out:    { type: string, format: date, description: "Exclusivo." }
        guests_count:
          type: integer
          minimum: 1
          description: |
            Número de hóspedes. **Era `guests` até 26/08/2026** — o mesmo dado
            tinha dois nomes, `guests` na criação e `guests_count` na edição e em
            toda resposta. Quem escrevia o cliente acertava a criação e errava a
            edição sem receber erro nenhum: medido, `PATCH` com `{"guests": 6}`
            respondia `200` e mantinha 4.
        discount_pct: { type: number, default: 0, description: "Sujeito à alçada da política: acima de `discount_approval_pct` a criação é recusada." }
        is_event:     { type: boolean, default: false }
        event_type:   { type: [string, "null"] }
        contact_id:   { type: string, format: uuid, description: "Obrigatório: reserva sem contato não tem a quem cobrar." }
        broker_id:    { type: [string, "null"], format: uuid }
        source:       { type: string, default: direto }
        notes:        { type: [string, "null"] }

    ReservaAtualizar:
      type: object
      description: |
        Corpo do `PUT` (substituição integral dos campos editáveis) e do `PATCH`
        (tudo opcional; ausente não muda, `null` limpa).

        Datas, produto e preço **não** estão aqui de propósito: quem muda estadia
        é `/reschedule`, quem muda unidade é `/reassign-unit`, quem muda estado é
        a ação correspondente.
      properties:
        contact_id:   { type: string, format: uuid }
        broker_id:    { type: [string, "null"], format: uuid }
        guests_count: { type: integer, minimum: 1, description: "Validado contra a capacidade do produto — acima dela, `CAPACITY_EXCEEDED`." }
        is_event:     { type: boolean }
        event_type:   { type: [string, "null"] }
        source:       { type: string }
        notes:        { type: [string, "null"] }

    ConfirmacaoDeReserva:
      type: object
      description: Corpo opcional do `POST /confirm`. Sem corpo, assume sinal cheio.
      properties:
        deposit_paid_cents:
          type: integer
          format: int64
          minimum: 1
          description: |
            Sinal efetivamente recebido, em centavos. Ausente assume
            `deposit_cents` da reserva.

            **Validado contra o total**: `1 ≤ deposit_paid_cents ≤ total_cents`.
            O teto é o total (e não o sinal) porque pagar a estadia inteira
            adiantado é legítimo; o piso é 1 porque confirmar sem dinheiro é o
            que `hold` já faz.

            É esta a base que a política de cancelamento usa depois — sem teto,
            um dígito a mais aqui vira reembolso inventado lá.
        method:       { type: string, enum: [pix, cartao, transferencia, dinheiro] }
        paid_at:      { type: string, format: date-time }
        external_ref: { type: [string, "null"], description: Identificador do pagamento no meio usado. }
        note:         { type: [string, "null"] }

    PedidoDeCancelamento:
      type: object
      description: Corpo opcional do `POST /cancel`.
      properties:
        reason:
          type: string
          example: desistencia
          description: |
            Texto livre, gravado em `reservations.cancel_reason` e na timeline.
            Dois valores têm significado no sistema: `no_show` leva a reserva ao
            estado `no_show` (e não a `cancelled`), e `remarcacao` é o que a
            própria API grava ao remarcar.

    ResultadoDeCancelamento:
      type: object
      description: Saída do motor `booking.CancellationPolicy.Simulate`, com o contexto que a tela precisa mostrar.
      properties:
        label:  { type: string, example: Retenção de 50% do sinal, description: "O texto da faixa aplicada, vindo da política congelada." }
        refund_cents:   { type: integer, format: int64 }
        retained_cents: { type: integer, format: int64 }
        deposit_paid_cents: { type: integer, format: int64, description: Base do cálculo — o sinal efetivamente recebido. }
        days_before:    { type: integer, description: "Antecedência em dias até o `check_in`, no fuso da propriedade. Pode ser negativa se o check-in já passou." }
        policy_version: { type: integer, description: "A versão congelada na reserva, não a vigente hoje." }
        credit_cents:
          type: integer
          format: int64
          description: |
            Dinheiro do hóspede que este cancelamento **não liquida**: os
            créditos já registrados na timeline (evento `credit_issued`, do
            excedente de uma remarcação para estadia mais barata) somados ao que
            uma confirmação antiga gravou acima do total e que a base do cálculo
            teve de truncar. **Zero é o caso normal.**

            Existe porque sem ele a tela lê `refund` + `retained` como "conta
            encerrada". Medido em 26/08/2026: reserva paga integralmente por
            R$ 3.580,00, remarcada para R$ 1.030,00, cancelada — a resposta dizia
            `refund_cents: 103000, retained_cents: 0, deposit_paid_cents: 103000`
            e R$ 2.550,00 sumiam sem nenhum registro os cobrando, com o próprio
            documento afirmando um valor pago que não foi o que entrou.

            A invariante que a soma fecha:
            `refund_cents + retained_cents + credit_cents == o que o hóspede pagou`.
        dry_run:        { type: boolean, description: "`true` quando nada foi executado." }
        status:         { $ref: "#/components/schemas/EstadoDaReserva" }

    PedidoDeRemarcacao:
      type: object
      description: |
        Corpo do `POST /reschedule`. O que não vier é herdado da reserva
        original — remarcar normalmente só muda datas.
      required: [check_in, check_out]
      properties:
        check_in:     { type: string, format: date }
        check_out:    { type: string, format: date, description: "Exclusivo." }
        unit_type_id: { type: string, format: uuid, description: "Permite remarcar trocando de produto. Ausente, mantém o da original." }
        guests_count: { type: integer, minimum: 1, description: "Ausente, mantém o da original. Mesmo nome da criação, da edição e da resposta." }
        discount_pct: { type: number, description: "Ausente, mantém o desconto da original — e a alçada é reavaliada de qualquer forma." }
        reason:       { type: [string, "null"] }

    MetaDaRemarcacao:
      type: object
      properties:
        previous_reservation_id: { type: string, format: uuid }
        previous_code:           { type: string, example: WH-2026-0001 }
        previous_total_cents:    { type: integer, format: int64 }
        difference_cents:
          type: integer
          format: int64
          description: |
            `total novo − total antigo`. Positivo é o que falta cobrar; negativo
            é o que há a devolver. Fase 1 apenas informa o valor — gerar o
            recebível ou o pagável é do módulo financeiro.
        credit_cents:
          type: integer
          format: int64
          description: |
            Sinal já pago que **não coube** na reserva nova, virado crédito a
            favor do hóspede. Zero na esmagadora maioria das remarcações: só
            aparece quando a estadia nova custa menos do que o hóspede já tinha
            adiantado.

            O sinal herdado é aplicado com o mesmo teto que o `POST /confirm`
            exige (`min(pago, total_novo)`) — sem ele a reserva nova nascia num
            estado que a própria API recusaria com `422`. O excedente vira o
            evento `credit_issued` na timeline da reserva NOVA, e `credit_cents`
            também aparece no evento `rescheduled` das **duas** reservas: quem
            abre a antiga para entender a reclamação do hóspede precisa ver ali
            que sobrou dinheiro dele.

            O crédito **acompanha a cadeia**: o que uma remarcação seguinte
            herda é o saldo do hóspede com a casa (sinal aplicado + crédito em
            aberto), e não só o sinal aplicado — senão em `A → B → C` o crédito
            gerado em `B` ficaria órfão numa reserva cancelada.

    RegistroDeEstadia:
      type: object
      description: Corpo opcional de `/check-in` e `/check-out`.
      properties:
        at:
          type: string
          format: date-time
          description: |
            Instante do registro. Ausente, `now()`. Vai para a timeline, não para
            uma coluna de `reservations`.

            **Validado contra o período da reserva**, com a data resolvida no
            fuso da propriedade: no check-in, `[check_in, check_out)`; no
            check-out, `[check_in, check_out]` e nunca antes do `at` do
            `checked_in`. Fora disso, `422 VALIDATION_ERROR`.

            O registro é prova de quando a estadia aconteceu; sem faixa, aceita
            qualquer data e deixa de ser prova.
        note: { type: [string, "null"] }

    PedidoDeRealocacao:
      type: object
      required: [to_unit_id]
      properties:
        from_unit_id:
          type: [string, "null"]
          format: uuid
          description: |
            Qual unidade sai. Pode ser omitido quando a reserva ocupa uma só
            unidade — que é o caso de todo produto `one_member`.
        to_unit_id: { type: string, format: uuid, description: Precisa compor o produto da reserva. }
        locked:     { type: boolean, default: true, description: "Trava a escolha (`reservation_units.locked`): a realocação automática deixa de mexer nesta reserva." }
        reason:     { type: [string, "null"] }

    PedidoDeExtensaoDeHold:
      type: object
      description: Corpo opcional do `POST /extend-hold`.
      properties:
        hours:  { type: integer, minimum: 1, description: "Ausente usa `hold_hours` da política congelada na reserva. Contado a partir de agora, não do vencimento antigo." }
        reason: { type: [string, "null"] }

    ResultadoDeExtensaoDeHold:
      type: object
      properties:
        id:              { type: string, format: uuid }
        hold_expires_at: { type: string, format: date-time }
        extensions_count: { type: integer, description: Quantas vezes esta pré-reserva já foi estendida. }
        max_extensions:   { type: integer, description: "Limite configurável; atingido, a resposta é `409 HOLD_LIMIT_REACHED`." }

    BloqueioCriar:
      type: object
      description: |
        Corpo do `POST /blocks`. Uma linha de `stay_blocks` por unidade, todas na
        mesma transação e inseridas em ordem de `units.code`.
      required: [unit_ids, from, to, source]
      properties:
        unit_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        from:   { type: string, format: date }
        to:     { type: string, format: date, description: "Exclusivo — `[from, to)`, como toda estadia." }
        source: { type: string, enum: [maintenance, owner_hold], description: "`ota` é do importador de canais e `reservation` nasce com a reserva; nenhum dos dois se cria por aqui." }
        note:   { type: [string, "null"] }

    Bloqueio:
      type: object
      description: Linha de `stay_blocks`.
      properties:
        id:      { type: string, format: uuid }
        unit_id:   { type: string, format: uuid }
        unit_code: { type: string, example: SP-02 }
        source:  { type: string, enum: [reservation, maintenance, owner_hold, ota] }
        status:
          type: string
          enum: [hold, confirmed, completed, cancelled, expired]
          description: |
            Estes cinco valores são, palavra por palavra, o `CHECK` de
            `stay_blocks.status` na migration `20260826120000`. Até 26/08/2026 o
            contrato declarava `checked_out` no lugar de `completed`: o banco e o
            código escrevem `completed`, então a API devolveria valor **fora do
            enum publicado** assim que a rota expusesse um bloco encerrado. O
            enum foi alinhado ao banco, e não o contrário, porque é o banco quem
            recusa o valor errado.

            `checked_out` continua existindo — como estado da RESERVA
            (`EstadoDaReserva`) e como nome de célula em `LinhaDoMapa`, que é
            vocabulário de apresentação. Aqui, que é a linha de calendário, o
            nome é `completed`.

            Só `hold` e `confirmed` contam para a constraint — é a cláusula
            `WHERE` dela. Os outros três são terminais e liberam a data:
            `completed` (a estadia aconteceu e terminou), `cancelled` (a
            ocupação foi desfeita) e `expired` (o hold venceu sem sinal).

            A diferença entre `completed` e `cancelled` é o que o mapa mostra:
            estadia cumprida continua desenhada no calendário, ocupação desfeita
            não. Somar as duas em `cancelled` apagaria a receita realizada do
            mapa de ocupação, e com ela ADR e RevPAR.
        from:    { type: string, format: date, description: "`lower(period)`." }
        to:      { type: string, format: date, description: "`upper(period)`, exclusivo." }
        reservation_id: { type: [string, "null"], format: uuid }
        expires_at:     { type: [string, "null"], format: date-time }
        note:       { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    EventoDoStream:
      type: object
      description: |
        O objeto que vai em `data:` de cada evento de `GET /stream`. **Só isto** —
        quem quiser o dado refaz o fetch autenticado.
      required: [entity, id, v]
      properties:
        entity:
          type: string
          enum: [stay_block, reservation, opportunity, lead, activity]
          description: "Que tipo de coisa mudou. `stay_block` e `reservation` chegam no tópico `calendar`; as outras três, no `crm`."
        id: { type: string, format: uuid }
        unit_id:
          type: [string, "null"]
          format: uuid
          description: |
            Presente só em `stay_block`. É o que permite ao mapa repintar **uma
            linha** em vez de recarregar a matriz inteira de 8 unidades × 90 dias.
        v:
          type: integer
          format: int64
          description: |
            Versão da entidade, incrementada a cada escrita. O cliente guarda o
            último `v` visto por `id` e descarta o que vier igual ou menor — é o
            que faz o replay de uma reconexão não repintar a tela duas vezes.

            Não confundir com o `id:` do envelope SSE, que é o cursor do
            barramento e é o que volta em `Last-Event-ID`.

    Funil:
      type: object
      description: "`crm_pipelines`. Configuração comercial: é dado, e mudar o funil não exige deploy."
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string, example: Funil de temporada }
        is_default:
          type: boolean
          description: "O funil em que cai a oportunidade criada sem `pipeline_id`. Exatamente **um** funil ativo é default."
        active:     { type: boolean }
        stage_count: { type: integer, description: Derivado — quantas etapas o funil tem. }
        open_opportunity_count: { type: integer, description: "Derivado, já restrito ao escopo do requisitante." }

    FunilComEtapas:
      allOf:
        - $ref: "#/components/schemas/Funil"
        - type: object
          properties:
            stages:
              type: array
              description: Ordenadas por `position`.
              items: { $ref: "#/components/schemas/EtapaDoFunil" }

    FunilEntrada:
      type: object
      description: Corpo do `POST` e do `PUT`.
      required: [name]
      properties:
        name:       { type: string, minLength: 1, maxLength: 120 }
        is_default: { type: boolean, default: false, description: "`true` desmarca o default anterior na mesma transação." }
        active:     { type: boolean, default: true }

    FunilAtualizar:
      type: object
      description: "Corpo do `PATCH` — ausente não muda, `null` limpa."
      properties:
        name:       { type: string, minLength: 1, maxLength: 120 }
        is_default: { type: boolean }
        active:     { type: boolean }

    TipoDeEtapa:
      type: string
      enum: [aberto, ganho, perdido]
      description: |
        `aberto` é etapa de negociação. `ganho` e `perdido` são **terminais**, e
        cada funil tem no máximo uma de cada: são elas que `/win` e `/lose`
        procuram. Só se chega nelas por esses dois endpoints, nunca por
        `/stage`.

    EtapaDoFunil:
      type: object
      description: "`crm_stages`. É aqui que moram o SLA e a tarefa automática — a parte do CRM que faz o follow-up acontecer sem ninguém lembrar."
      properties:
        id:          { type: string, format: uuid }
        pipeline_id: { type: string, format: uuid }
        name:        { type: string, example: Orçamento enviado }
        position:    { type: integer, description: "Ordem no funil, base 0. Reescrita em bloco por `POST /crm/stages/reorder`." }
        probability: { type: integer, minimum: 0, maximum: 100, description: "Probabilidade sugerida ao entrar na etapa. Copiada para a oportunidade na transição, e editável nela depois." }
        color:       { type: string, example: "#8FA36B", description: "Tinge a **coluna** do kanban; o card fica neutro (docs/ui.md §9)." }
        type:        { $ref: "#/components/schemas/TipoDeEtapa" }
        sla_days:
          type: [integer, "null"]
          minimum: 0
          description: |
            Dias que a oportunidade pode ficar nesta etapa antes de virar
            alerta. `null` desliga o SLA da etapa. O estouro é **derivado**
            (`entered_stage_at + sla_days < agora`), nunca uma coluna gravada:
            coluna gravada precisaria de um job para envelhecer sozinha, e
            envelheceria errado no dia em que o job falhasse.
        auto_task_subject:
          type: [string, "null"]
          description: |
            Assunto da tarefa criada ao **entrar** nesta etapa. `null` significa
            etapa sem tarefa automática. É este campo que liga o mecanismo: o
            resto (`type`, `due_days`) só é lido quando ele existe.
        auto_task_type:
          type: [string, "null"]
          description: "Tipo da tarefa automática — `tarefa`, `ligacao`, `email`, `whatsapp`… Ausente assume `tarefa`."
        auto_task_due_days:
          type: [integer, "null"]
          minimum: 0
          description: "Prazo da tarefa, em dias a partir da entrada. Ausente usa `sla_days` — o prazo da tarefa e o do SLA são a mesma promessa."
        auto_notify:
          type: boolean
          description: Se o dono da oportunidade é notificado quando a tarefa nasce.

    EtapaEntrada:
      type: object
      description: Corpo do `POST` e do `PUT`.
      required: [pipeline_id, name]
      properties:
        pipeline_id: { type: string, format: uuid, description: "No `PUT`, tem de ser o mesmo funil da etapa: mudar de funil por aqui arrastaria as oportunidades dela junto, sem histórico." }
        name:        { type: string, minLength: 1, maxLength: 120 }
        position:    { type: integer, minimum: 0, description: Ausente coloca no fim do funil. }
        probability: { type: integer, minimum: 0, maximum: 100, default: 0 }
        color:       { type: string, default: "#8FA36B" }
        type:        { $ref: "#/components/schemas/TipoDeEtapa" }
        sla_days:           { type: [integer, "null"], minimum: 0 }
        auto_task_subject:  { type: [string, "null"], maxLength: 200 }
        auto_task_type:     { type: [string, "null"] }
        auto_task_due_days: { type: [integer, "null"], minimum: 0 }
        auto_notify:        { type: boolean, default: true }

    EtapaAtualizar:
      type: object
      description: "Corpo do `PATCH`. `pipeline_id` fica de fora: etapa não troca de funil."
      properties:
        name:        { type: string, minLength: 1, maxLength: 120 }
        position:    { type: integer, minimum: 0 }
        probability: { type: integer, minimum: 0, maximum: 100 }
        color:       { type: string }
        type:        { $ref: "#/components/schemas/TipoDeEtapa" }
        sla_days:           { type: [integer, "null"], minimum: 0 }
        auto_task_subject:  { type: [string, "null"], maxLength: 200 }
        auto_task_type:     { type: [string, "null"] }
        auto_task_due_days: { type: [integer, "null"], minimum: 0 }
        auto_notify:        { type: boolean }

    PedidoDeReordenacao:
      type: object
      description: "Corpo do `POST /crm/stages/reorder`."
      required: [pipeline_id, stage_ids]
      properties:
        pipeline_id: { type: string, format: uuid }
        stage_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
          description: |
            **Todas** as etapas do funil, na ordem desejada. `position` passa a
            ser o índice no array. Lista incompleta é `422
            STAGE_ORDER_INCOMPLETE`; etapa de outro funil é `422
            STAGE_NOT_IN_PIPELINE`.

    MotivoDePerda:
      type: object
      description: "`crm_lost_reasons`. Catálogo fechado — é o que faz o relatório de motivos de perda (§15) existir."
      properties:
        id:     { type: string, format: uuid }
        label:  { type: string, example: Preço acima do orçamento do cliente }
        active: { type: boolean }
        usage_count: { type: integer, description: "Derivado — quantas oportunidades perdidas apontam para ele." }

    MotivoDePerdaEntrada:
      type: object
      required: [label]
      properties:
        label:  { type: string, minLength: 1, maxLength: 200 }
        active: { type: boolean, default: true }

    MotivoDePerdaAtualizar:
      type: object
      properties:
        label:  { type: string, minLength: 1, maxLength: 200 }
        active: { type: boolean }

    ContatoResumo:
      type: object
      description: |
        O contato como o CRM precisa dele — o suficiente para ligar, escrever e
        identificar. O cadastro completo é de `/contacts`, de outra fase; expor
        aqui só o resumo evita que a tela de oportunidade vire uma segunda porta
        de leitura de dado pessoal.
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        email:      { type: [string, "null"], format: email }
        phone_e164: { type: [string, "null"], example: "+5585999990000" }
        city:       { type: [string, "null"] }
        state:      { type: [string, "null"] }

    EstadoDoLead:
      type: string
      enum: [novo, em_atendimento, qualificado, convertido, descartado]
      description: |
        `convertido` **não** é escrito pelo cliente: só
        `POST /crm/leads/{id}/convert` chega nele, e na mesma transação em que a
        oportunidade nasce. `descartado` é o fim de linha sem oportunidade — e é
        o que alimenta a perda anterior ao funil.

    Lead:
      type: object
      description: |
        `crm_leads`. Guarda o **interesse**, não a pessoa: nome, telefone e
        e-mail vivem em `contacts`, um registro por pessoa (§6). É essa separação
        que deixa o WhatsApp reconhecer quem já existe em vez de criar um segundo
        cadastro a cada mensagem.
      properties:
        id:           { type: string, format: uuid }
        contact_id:   { type: string, format: uuid }
        contact_name: { type: string }
        contact_phone_e164: { type: [string, "null"] }
        source:       { type: string, example: whatsapp, description: "Vocabulário aberto: `whatsapp`, `site`, `indicacao`, `ota`, `telefone`, `instagram`…" }
        campaign_id:  { type: [string, "null"], format: uuid }
        status:       { $ref: "#/components/schemas/EstadoDoLead" }
        score:        { type: integer, minimum: 0, maximum: 100 }
        interest_unit_type_id:   { type: [string, "null"], format: uuid }
        interest_unit_type_name: { type: [string, "null"] }
        desired_check_in:  { type: [string, "null"], format: date }
        desired_check_out: { type: [string, "null"], format: date, description: "Exclusivo, como toda data de saída no sistema." }
        owner_id:     { type: [string, "null"], format: uuid, description: "Nulo é lead na fila da gestão. Quem tem escopo `own` não enxerga lead sem dono — e é o comportamento correto: ainda não é de ninguém." }
        owner_name:   { type: [string, "null"] }
        converted_at: { type: [string, "null"], format: date-time }
        opportunity_id: { type: [string, "null"], format: uuid, description: "Derivado — a oportunidade que nasceu da conversão." }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }

    LeadCriar:
      type: object
      required: [contact_id]
      properties:
        contact_id:   { type: string, format: uuid, description: "Obrigatório: uma pessoa, um registro." }
        source:       { type: string, default: direto }
        campaign_id:  { type: [string, "null"], format: uuid }
        status:       { $ref: "#/components/schemas/EstadoDoLead" }
        score:        { type: integer, minimum: 0, maximum: 100, default: 0 }
        interest_unit_type_id: { type: [string, "null"], format: uuid }
        desired_check_in:  { type: [string, "null"], format: date }
        desired_check_out: { type: [string, "null"], format: date }
        owner_id:     { type: [string, "null"], format: uuid, description: "Ausente assume o requisitante quando ele tem escopo `own`; com escopo `all`, ausente é sem dono." }

    LeadAtualizar:
      type: object
      description: |
        Corpo do `PUT` (substituição integral dos campos editáveis) e do `PATCH`
        (ausente não muda, `null` limpa). `status: convertido` é recusado — quem
        converte é `/convert`.
      properties:
        contact_id:   { type: string, format: uuid }
        source:       { type: string }
        campaign_id:  { type: [string, "null"], format: uuid }
        status:       { type: string, enum: [novo, em_atendimento, qualificado, descartado] }
        score:        { type: integer, minimum: 0, maximum: 100 }
        interest_unit_type_id: { type: [string, "null"], format: uuid }
        desired_check_in:  { type: [string, "null"], format: date }
        desired_check_out: { type: [string, "null"], format: date }
        owner_id:     { type: [string, "null"], format: uuid }

    PedidoDeConversao:
      type: object
      description: |
        Corpo opcional do `POST /crm/leads/{id}/convert`. O que vier aqui
        **sobrepõe** o que o lead trazia; o que faltar é herdado dele.
      properties:
        pipeline_id:  { type: string, format: uuid, description: Ausente usa o funil `is_default`. }
        stage_id:     { type: string, format: uuid, description: "Ausente usa a etapa de menor `position` do funil." }
        unit_type_id: { type: [string, "null"], format: uuid, description: "Ausente herda `interest_unit_type_id` do lead." }
        check_in:     { type: [string, "null"], format: date, description: "Ausente herda `desired_check_in`." }
        check_out:    { type: [string, "null"], format: date, description: "Ausente herda `desired_check_out`." }
        amount_cents: { type: [integer, "null"], format: int64 }
        expected_close: { type: [string, "null"], format: date }
        owner_id:     { type: [string, "null"], format: uuid, description: Ausente herda o dono do lead. }

    ResultadoDeConversao:
      type: object
      description: As duas pontas da conversão, para a tela seguir direto ao card sem um segundo `GET`.
      properties:
        lead:        { $ref: "#/components/schemas/Lead" }
        opportunity: { $ref: "#/components/schemas/Oportunidade" }
        auto_task:
          description: "A tarefa automática da etapa de entrada, se a etapa tiver uma. `null` quando não tem."
          oneOf:
            - { $ref: "#/components/schemas/Atividade" }
            - { type: "null" }

    EstadoDaOportunidade:
      type: string
      enum: [aberta, ganha, perdida]
      description: |
        Espelha o `type` da etapa em que o card está, e existe como coluna
        própria porque é por ela que o BI filtra sem ter de passar por
        `crm_stages` em toda consulta.

        `ganha` e `perdida` são finais: oportunidade fechada não volta a ser
        editada (`409 OPPORTUNITY_ALREADY_CLOSED`). Negócio que renasce é
        oportunidade nova, com o mesmo contato — assim a conversão do funil não
        conta a mesma venda duas vezes.

    Oportunidade:
      type: object
      description: |
        `crm_opportunities`. O negócio em andamento: contato (obrigatório),
        produto pretendido, datas pretendidas, orçamento vigente e — quando
        ganha — a reserva.

        **Não existe campo `title`**, de propósito. O card se identifica pelo que
        a casa vende: contato, produto e datas. Um título livre viraria
        "Fernanda – dezembro" digitado de vinte maneiras, e mais uma coluna numa
        tabela cujo antiexemplo declarado tinha 118 (docs/db.md).
      properties:
        id:            { type: string, format: uuid }
        contact_id:    { type: string, format: uuid }
        contact_name:  { type: string }
        lead_id:       { type: [string, "null"], format: uuid, description: "A origem, quando nasceu de `/convert`. É por ele que o BI mede conversão por origem." }
        pipeline_id:   { type: string, format: uuid }
        pipeline_name: { type: string }
        stage_id:      { type: string, format: uuid }
        stage_name:    { type: string }
        stage_type:    { $ref: "#/components/schemas/TipoDeEtapa" }
        unit_type_id:   { type: [string, "null"], format: uuid }
        unit_type_name: { type: [string, "null"] }
        check_in:      { type: [string, "null"], format: date, description: Data pretendida — ainda não bloqueia nada. }
        check_out:     { type: [string, "null"], format: date, description: Exclusivo. }
        quote_id:
          type: [string, "null"]
          format: uuid
          description: |
            O **orçamento vigente**: o último emitido para esta oportunidade, e o
            que `/win` transforma em reserva. Emitir outro substitui este —
            os anteriores continuam existindo em `/quotes`, mas só um está de pé.
        reservation_id:   { type: [string, "null"], format: uuid }
        reservation_code: { type: [string, "null"], example: WH-2026-0001 }
        amount_cents:
          type: integer
          format: int64
          description: |
            Valor esperado do negócio, em centavos. Nasce do orçamento vigente
            quando existe um, e pode ser estimado à mão antes disso — é o que soma
            no total da coluna do kanban.
        probability:   { type: integer, minimum: 0, maximum: 100 }
        expected_close: { type: [string, "null"], format: date }
        owner_id:      { type: [string, "null"], format: uuid, description: "O dono comercial. É ele que o escopo `own` compara com o usuário autenticado, no SQL." }
        owner_name:    { type: [string, "null"] }
        status:        { $ref: "#/components/schemas/EstadoDaOportunidade" }
        lost_reason_id:    { type: [string, "null"], format: uuid }
        lost_reason_label: { type: [string, "null"] }
        entered_stage_at:  { type: string, format: date-time, description: "Quando entrou na etapa atual. É a base do SLA e do alerta de card parado." }
        sla_days:    { type: [integer, "null"], description: "Copiado da etapa atual, para a tela não precisar de um segundo `GET`." }
        sla_due_at:  { type: [string, "null"], format: date-time, description: "`entered_stage_at + sla_days`. `null` quando a etapa não tem SLA." }
        sla_breached: { type: boolean, description: "Derivado: `sla_due_at < agora` (em `America/Fortaleza`) e a oportunidade ainda aberta." }
        pending_task_count: { type: integer, description: Tarefas pendentes vinculadas — o número que vira a faixa vermelha no card. }
        event:
          description: "Detalhe de evento (`crm_opportunity_event_details`), quando a negociação é de evento. `null` quando é estadia comum — tabela satélite justamente para não engordar a principal."
          oneOf:
            - { $ref: "#/components/schemas/DetalheDeEvento" }
            - { type: "null" }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DetalheDeEvento:
      type: object
      description: "`crm_opportunity_event_details` — satélite de 1:1 com a oportunidade."
      properties:
        event_type:      { type: [string, "null"], example: casamento }
        guests_expected: { type: [integer, "null"], minimum: 0 }
        needs_catering:  { type: boolean }
        notes:           { type: [string, "null"] }

    OportunidadeCriar:
      type: object
      required: [contact_id]
      properties:
        contact_id:   { type: string, format: uuid, description: "Obrigatório (§7): negócio sem pessoa não tem com quem negociar." }
        lead_id:      { type: [string, "null"], format: uuid }
        pipeline_id:  { type: string, format: uuid, description: Ausente usa o funil `is_default`. }
        stage_id:     { type: string, format: uuid, description: "Ausente usa a etapa de menor `position`. A entrada na etapa já dispara a tarefa automática dela." }
        unit_type_id: { type: [string, "null"], format: uuid }
        check_in:     { type: [string, "null"], format: date }
        check_out:    { type: [string, "null"], format: date, description: "Exclusivo. `check_out <= check_in` é `422 VALIDATION_ERROR`." }
        amount_cents: { type: integer, format: int64, default: 0, minimum: 0 }
        probability:  { type: integer, minimum: 0, maximum: 100, description: Ausente herda a probabilidade da etapa. }
        expected_close: { type: [string, "null"], format: date }
        owner_id:     { type: [string, "null"], format: uuid, description: "Ausente assume o requisitante quando ele tem escopo `own`." }
        event:
          description: "Detalhe de evento, opcional."
          oneOf:
            - { $ref: "#/components/schemas/DetalheDeEvento" }
            - { type: "null" }

    OportunidadeAtualizar:
      type: object
      description: |
        Corpo do `PUT` e do `PATCH`.

        `stage_id`, `status`, `lost_reason_id`, `quote_id` e `reservation_id`
        **não** estão aqui: cada um deles tem uma ação com efeito colateral
        obrigatório (`/stage`, `/win`, `/lose`, `POST /quotes`). Escrever esses
        campos por `PATCH` moveria o card sem gravar `crm_stage_history`.
      properties:
        contact_id:   { type: string, format: uuid }
        lead_id:      { type: [string, "null"], format: uuid }
        unit_type_id: { type: [string, "null"], format: uuid }
        check_in:     { type: [string, "null"], format: date }
        check_out:    { type: [string, "null"], format: date }
        amount_cents: { type: integer, format: int64, minimum: 0 }
        probability:  { type: integer, minimum: 0, maximum: 100 }
        expected_close: { type: [string, "null"], format: date }
        owner_id:     { type: [string, "null"], format: uuid }
        event:
          oneOf:
            - { $ref: "#/components/schemas/DetalheDeEvento" }
            - { type: "null" }

    QuadroKanban:
      type: object
      description: O quadro inteiro numa resposta — funil, colunas, cards e totais.
      properties:
        pipeline: { $ref: "#/components/schemas/Funil" }
        columns:
          type: array
          description: Uma por etapa, na ordem de `position`. Etapa vazia vem na lista, com contagem zero — coluna que some quando esvazia faz o quadro mudar de forma sozinho.
          items: { $ref: "#/components/schemas/ColunaDoKanban" }
        totals:
          type: object
          description: O funil somado, já dentro do escopo do requisitante.
          properties:
            count:        { type: integer }
            amount_cents: { type: integer, format: int64 }

    ColunaDoKanban:
      type: object
      properties:
        stage: { $ref: "#/components/schemas/EtapaDoFunil" }
        count:
          type: integer
          description: "Total de cards **na etapa**, não na página. É o número que a coluna exibe."
        amount_cents:
          type: integer
          format: int64
          description: "Soma de `amount_cents` de toda a coluna — vinda do servidor, e não da soma dos cards carregados."
        has_more: { type: boolean, description: Há mais cards do que os que vieram em `cards`. }
        cards:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/CardDaOportunidade" }

    CardDaOportunidade:
      type: object
      description: |
        O card do kanban — o mínimo para desenhar, arrastar e decidir. Detalhe
        completo é `GET /crm/opportunities/{id}/full`; mandar tudo aqui faria o
        quadro carregar oito etapas de dados que ninguém leu.
      properties:
        id:            { type: string, format: uuid }
        contact_id:    { type: string, format: uuid }
        contact_name:  { type: string }
        unit_type_name: { type: [string, "null"] }
        check_in:      { type: [string, "null"], format: date }
        check_out:     { type: [string, "null"], format: date }
        amount_cents:  { type: integer, format: int64 }
        probability:   { type: integer }
        expected_close: { type: [string, "null"], format: date }
        owner_id:      { type: [string, "null"], format: uuid }
        owner_name:    { type: [string, "null"] }
        status:        { $ref: "#/components/schemas/EstadoDaOportunidade" }
        entered_stage_at: { type: string, format: date-time }
        sla_due_at:    { type: [string, "null"], format: date-time }
        sla_breached:  { type: boolean, description: "A faixa de SLA estourado do card (docs/ui.md §9)." }
        pending_task_count: { type: integer }
        next_due_at:   { type: [string, "null"], format: date-time, description: O prazo da próxima tarefa pendente. }
        reservation_code: { type: [string, "null"], example: WH-2026-0001 }

    FaixaDeSLA:
      type: object
      description: |
        A faixa de SLA da tela da oportunidade. Tudo derivado, calculado no
        servidor com o "hoje" de `America/Fortaleza` — a mesma conta feita no
        navegador daria uma resposta por fuso de quem abriu a tela.
      properties:
        stage_id:   { type: string, format: uuid }
        stage_name: { type: string }
        sla_days:   { type: [integer, "null"] }
        entered_stage_at: { type: string, format: date-time }
        due_at:     { type: [string, "null"], format: date-time }
        days_left:  { type: [integer, "null"], description: "Negativo quando estourou. `null` quando a etapa não tem SLA." }
        breached:   { type: boolean }

    EventoDeEtapa:
      type: object
      description: "Linha de `crm_stage_history` — **insert-only**. É a matéria-prima da conversão por etapa do §15, e por isso nada aqui é editado nem apagado."
      properties:
        id:              { type: string, format: uuid }
        from_stage_id:   { type: [string, "null"], format: uuid, description: "`null` na primeira entrada (a criação da oportunidade)." }
        from_stage_name: { type: [string, "null"] }
        to_stage_id:     { type: string, format: uuid }
        to_stage_name:   { type: string }
        user_id:         { type: [string, "null"], format: uuid, description: "`null` quando quem moveu foi um job, e não uma pessoa." }
        user_name:       { type: [string, "null"] }
        reason:          { type: [string, "null"] }
        at:              { type: string, format: date-time }
        days_in_stage:   { type: [number, "null"], description: "Derivado: quanto tempo o card ficou na etapa anterior. É o que mede gargalo de funil." }

    NotaDaOportunidade:
      type: object
      description: |
        Nota é **atividade de tipo `nota`** (`crm_activities`), projetada aqui
        para a aba de notas da tela. Não há tabela separada nem CRUD próprio:
        criar nota é `POST /crm/activities` com `type: nota`, e assim ela entra
        na linha do tempo pelo mesmo caminho de todo o resto.
      properties:
        id:          { type: string, format: uuid }
        body:        { type: string, description: "O `description` da atividade." }
        author_id:   { type: [string, "null"], format: uuid }
        author_name: { type: [string, "null"] }
        created_at:  { type: string, format: date-time }

    DocumentoDaOportunidade:
      type: object
      description: |
        Anexo da oportunidade (`crm_documents`).

        **Vem vazio nesta rodada** e está declarado assim mesmo: o módulo de
        anexos (com storage próprio e guarda contra SSRF, §8) é de outra fase, e
        a tela precisa nascer com o formato final. Acrescentar a chave depois
        obrigaria o painel a tratar `documents` como opcional para sempre.
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        mime:       { type: string }
        size_bytes: { type: integer, format: int64 }
        url:        { type: string, description: URL assinada e de vida curta. }
        uploaded_by:      { type: [string, "null"], format: uuid }
        uploaded_by_name: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    AlertaDaOportunidade:
      type: object
      description: |
        Alerta **derivado**, calculado na leitura (§7). Não há tabela de alertas:
        alerta gravado precisa de um job para nascer e de outro para morrer, e
        erra em silêncio nos dois casos.
      properties:
        code:
          type: string
          enum: [sla_estourado, tarefa_vencida, parado_ha_n_dias, hold_expirando, saldo_a_vencer]
        severity: { type: string, enum: [info, atencao, critico] }
        message:  { type: string, example: "SLA da etapa Orçamento enviado estourou há 2 dias." }
        due_at:   { type: [string, "null"], format: date-time }
        entity_id: { type: [string, "null"], format: uuid, description: "A atividade, a reserva ou o recebível a que o alerta se refere." }

    EventoDaOportunidade:
      type: object
      description: |
        Linha da **linha do tempo unificada**: mudança de etapa, atividade,
        nota, orçamento, reserva e — quando o módulo de chat existir — mensagem
        de WhatsApp, tudo na mesma ordem cronológica. É o registro que responde
        "o que já foi falado com essa pessoa" sem trocar de tela.
      properties:
        id:   { type: string, format: uuid }
        type:
          type: string
          example: stage_changed
          description: |
            Vocabulário aberto, montado na leitura: `created`, `stage_changed`,
            `activity_created`, `activity_completed`, `note_added`,
            `quote_issued`, `reservation_created`, `won`, `lost`.
            `chat_message` entra quando o módulo de chat existir.
        at:         { type: string, format: date-time }
        actor_id:   { type: [string, "null"], format: uuid }
        actor_name: { type: [string, "null"] }
        title:      { type: string, description: A frase já montada para a tela. }
        payload:    { type: [object, "null"], additionalProperties: true }

    OportunidadeCompleta:
      type: object
      description: |
        Tudo o que a tela da oportunidade desenha, numa chamada
        (`GET /crm/opportunities/{id}/full`).
      properties:
        opportunity: { $ref: "#/components/schemas/Oportunidade" }
        contact:     { $ref: "#/components/schemas/ContatoResumo" }
        stages:
          type: array
          description: "As etapas do funil **da oportunidade** — a trilha que a tela desenha, incluindo as que ela ainda não alcançou."
          items: { $ref: "#/components/schemas/EtapaDoFunil" }
        sla: { $ref: "#/components/schemas/FaixaDeSLA" }
        stage_history:
          type: array
          description: Do mais recente para o mais antigo.
          items: { $ref: "#/components/schemas/EventoDeEtapa" }
        activities:
          type: array
          description: "Tudo que **não** é nota — tarefa, ligação, reunião, e-mail e WhatsApp. Pendentes primeiro, por prazo."
          items: { $ref: "#/components/schemas/Atividade" }
        notes:
          type: array
          description: As atividades de tipo `nota`, separadas porque a tela as mostra numa aba própria.
          items: { $ref: "#/components/schemas/NotaDaOportunidade" }
        documents:
          type: array
          description: "Vazio nesta rodada — ver `DocumentoDaOportunidade`."
          items: { $ref: "#/components/schemas/DocumentoDaOportunidade" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/AlertaDaOportunidade" }
        timeline:
          type: array
          description: Ordenada do mais recente para o mais antigo.
          items: { $ref: "#/components/schemas/EventoDaOportunidade" }
        quote:
          description: "O orçamento vigente, aberto noite a noite — é o que a tela mostra e o que `/win` converteria em reserva. `null` quando ainda não há orçamento."
          oneOf:
            - { $ref: "#/components/schemas/Orcamento" }
            - { type: "null" }
        reservation:
          description: "A reserva vinculada, quando existe (pré-reserva criada antes do fechamento, ou a reserva que `/win` criou)."
          oneOf:
            - { $ref: "#/components/schemas/Reserva" }
            - { type: "null" }

    PedidoDeMudancaDeEtapa:
      type: object
      description: "Corpo do `POST /crm/opportunities/{id}/stage`."
      required: [stage_id]
      properties:
        stage_id:
          type: string
          format: uuid
          description: "Etapa destino, do **mesmo funil** da oportunidade. Etapa de tipo `ganho` ou `perdido` é recusada aqui — use `/win` ou `/lose`."
        from_stage_id:
          type: string
          format: uuid
          description: |
            Guarda de concorrência, opcional mas recomendada no kanban: se
            informada e diferente da etapa atual, a resposta é
            `409 INVALID_STATE_TRANSITION` com `details.current_stage_id`.

            É o que impede o arrasto otimista de dois corretores no mesmo card
            de terminar com o último clique vencendo em silêncio.
        reason:      { type: [string, "null"], maxLength: 500, description: "Gravado em `crm_stage_history.reason` — o porquê da mudança, que a linha do tempo mostra." }
        probability: { type: [integer, "null"], minimum: 0, maximum: 100, description: Ausente herda a probabilidade da etapa destino. }

    ResultadoDeMudancaDeEtapa:
      type: object
      properties:
        opportunity: { $ref: "#/components/schemas/Oportunidade" }
        auto_task:
          description: |
            A tarefa automática criada por esta entrada. `null` quando a etapa
            não tem tarefa configurada **ou** quando já existia uma pendente da
            mesma etapa — a idempotência não cria a segunda, e devolver `null`
            diz exatamente isso à tela.
          oneOf:
            - { $ref: "#/components/schemas/Atividade" }
            - { type: "null" }
        sla: { $ref: "#/components/schemas/FaixaDeSLA" }

    PedidoDeGanho:
      type: object
      description: "Corpo opcional do `POST /crm/opportunities/{id}/win`."
      properties:
        quote_id:
          type: string
          format: uuid
          description: |
            Ausente usa o orçamento vigente da oportunidade (`quote_id`).
            Informado, tem de ser um orçamento **desta** oportunidade — senão
            `422 VALIDATION_ERROR`. Sem nenhum dos dois,
            `422 QUOTE_REQUIRED_TO_WIN`.
        note: { type: [string, "null"], maxLength: 500, description: "Gravado no histórico de etapa e na linha do tempo." }

    ResultadoDeGanho:
      type: object
      description: |
        A oportunidade fechada e a reserva, juntas — é o "sem redigitar nada" do
        critério de aceite do §7.
      properties:
        opportunity: { $ref: "#/components/schemas/Oportunidade" }
        reservation:
          $ref: "#/components/schemas/Reserva"
          description: "Criada como `hold`, com as unidades já alocadas. O sinal continua entrando por `POST /reservations/{id}/confirm`."
        reservation_created:
          type: boolean
          description: |
            `false` quando a oportunidade já tinha reserva (a pré-reserva feita
            na etapa anterior) e `/win` apenas a vinculou — a mesma informação
            que o `200` em vez de `201` carrega, para o cliente que não olha o
            status.

    PedidoDePerda:
      type: object
      description: "Corpo do `POST /crm/opportunities/{id}/lose`."
      required: [lost_reason_id]
      properties:
        lost_reason_id:
          type: string
          format: uuid
          description: |
            **Obrigatório** (§7), e tem de ser um motivo **ativo** do catálogo.
            Ausente, desconhecido ou inativo é `422 LOSS_REASON_REQUIRED`.
        note: { type: [string, "null"], maxLength: 500, description: "O detalhe, ao lado do motivo — nunca no lugar dele." }

    ResultadoDePerda:
      type: object
      properties:
        opportunity: { $ref: "#/components/schemas/Oportunidade" }
        reservation:
          description: |
            A pré-reserva ainda de pé, quando havia uma. Perder o negócio **não**
            cancela a reserva: liberar a data tem política congelada e possível
            reembolso, e é decisão separada. Vem preenchida para a tela oferecer
            `POST /reservations/{id}/cancel` em seguida.
          oneOf:
            - { $ref: "#/components/schemas/Reserva" }
            - { type: "null" }

    TipoDeAtividade:
      type: string
      enum: [tarefa, ligacao, reuniao, email, whatsapp, nota]
      description: "`nota` é o registro sem prazo — não tem `due_at` nem conclusão, e aparece na aba de notas da tela em vez da lista de tarefas."

    EstadoDaAtividade:
      type: string
      enum: [pendente, concluida, cancelada]

    Atividade:
      type: object
      description: |
        `crm_activities`. Tarefa, ligação, reunião, e-mail, WhatsApp e nota são o
        **mesmo** registro com `type` diferente: a linha do tempo da oportunidade
        é uma leitura só, e não a costura de seis tabelas.
      properties:
        id:          { type: string, format: uuid }
        type:        { $ref: "#/components/schemas/TipoDeAtividade" }
        subject:     { type: string }
        description: { type: [string, "null"] }
        due_at:      { type: [string, "null"], format: date-time }
        done_at:     { type: [string, "null"], format: date-time, description: "Carimbado pelo servidor em `POST /{id}/complete`. Nunca escrito pelo cliente." }
        status:      { $ref: "#/components/schemas/EstadoDaAtividade" }
        overdue:     { type: boolean, description: "Derivado: `pendente` com `due_at` no passado, pelo relógio de `America/Fortaleza`." }
        priority:    { type: string, enum: [baixa, normal, alta] }
        lead_id:        { type: [string, "null"], format: uuid }
        opportunity_id: { type: [string, "null"], format: uuid }
        contact_id:     { type: [string, "null"], format: uuid }
        contact_name:   { type: [string, "null"] }
        owner_id:    { type: string, format: uuid, description: "Quem tem de fazer. É o que o escopo `own` compara — e tarefa sem responsável é tarefa que ninguém faz." }
        owner_name:  { type: [string, "null"] }
        stage_id:
          type: [string, "null"]
          format: uuid
          description: |
            A etapa que originou a tarefa automática. É a chave da
            idempotência: não se cria outra enquanto existir tarefa `auto`
            **pendente** com o mesmo `(opportunity_id, stage_id)`.
        auto:
          type: boolean
          description: "`true` quando foi o servidor que criou, ao entrar na etapa. Não é aceito no corpo de criação."
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    AtividadeCriar:
      type: object
      description: "Corpo do `POST /crm/activities`. Pelo menos um entre `opportunity_id`, `lead_id` e `contact_id` é obrigatório."
      required: [type, subject]
      properties:
        type:        { $ref: "#/components/schemas/TipoDeAtividade" }
        subject:     { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"] }
        due_at:      { type: [string, "null"], format: date-time, description: "Ignorado em `type: nota` — nota não tem prazo." }
        priority:    { type: string, enum: [baixa, normal, alta], default: normal }
        lead_id:        { type: [string, "null"], format: uuid }
        opportunity_id: { type: [string, "null"], format: uuid }
        contact_id:     { type: [string, "null"], format: uuid }
        owner_id:       { type: [string, "null"], format: uuid, description: Ausente assume o requisitante. }

    AtividadeAtualizar:
      type: object
      description: |
        Corpo do `PUT` e do `PATCH`. `done_at` fica de fora — concluir é
        `POST /{id}/complete`, com o relógio do servidor.
      properties:
        type:        { $ref: "#/components/schemas/TipoDeAtividade" }
        subject:     { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"] }
        due_at:      { type: [string, "null"], format: date-time }
        priority:    { type: string, enum: [baixa, normal, alta] }
        owner_id:    { type: [string, "null"], format: uuid, description: "Repassar a tarefa a outra pessoa. Quem tem escopo `own` perde a tarefa de vista ao fazer isso — e é o comportamento correto." }
        status:
          type: string
          enum: [pendente, cancelada]
          description: |
            Cancelar, ou reabrir o que foi cancelado. `concluida` é recusado
            aqui (`422 VALIDATION_ERROR`): concluir carimba `done_at`, e
            `done_at` escrito pelo cliente é o tempo médio de resposta do §15
            medido pelo relógio do navegador.

    PedidoDeConclusao:
      type: object
      description: "Corpo opcional do `POST /crm/activities/{id}/complete`."
      properties:
        note:
          type: [string, "null"]
          maxLength: 1000
          description: "O resultado — o que foi dito na ligação. Anexado à `description` e visível na linha do tempo."
        next_activity:
          description: |
            A próxima ação, criada na mesma transação. É o "concluir e agendar o
            próximo passo": sem ele a operação conclui e esquece, e o único
            lembrete passa a ser o alerta de cliente parado.

            Herda `opportunity_id`, `lead_id`, `contact_id` e `owner_id` da
            atividade concluída.
          oneOf:
            - $ref: "#/components/schemas/ProximaAtividade"
            - { type: "null" }

    ProximaAtividade:
      type: object
      required: [type, subject, due_at]
      properties:
        type:     { $ref: "#/components/schemas/TipoDeAtividade" }
        subject:  { type: string, minLength: 1, maxLength: 200 }
        due_at:   { type: string, format: date-time }
        priority: { type: string, enum: [baixa, normal, alta], default: normal }
        owner_id: { type: [string, "null"], format: uuid, description: Ausente herda o dono da atividade concluída. }

    ResultadoDeConclusao:
      type: object
      properties:
        activity: { $ref: "#/components/schemas/Atividade" }
        next_activity:
          description: "A próxima ação, se pedida. `null` quando não."
          oneOf:
            - { $ref: "#/components/schemas/Atividade" }
            - { type: "null" }

security:
  - bearerAuth: []
