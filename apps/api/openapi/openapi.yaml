        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    patch:
      tags: [Tarifário]
      summary: Atualiza a tabela de tarifas
      description: |
        Mudar a vigência de uma tabela **não** mexe em reserva alguma: a reserva
        congelou `rate_table_id` e as noites já estão gravadas com preço.
      x-rbac: { recurso: settings, acao: editar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TabelaDeTarifasAtualizar" }
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TabelaDeTarifas" }
        "404": { $ref: "#/components/responses/Erro" }
        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    delete:
      tags: [Tarifário]
      summary: Desativa a tabela de tarifas
      description: |
        Desativação (`active = false`). Remoção física apagaria em cascata as
        tarifas e os mínimos de noite que reservas antigas referenciam por
        `rate_table_id`.
      x-rbac: { recurso: settings, acao: excluir }
      responses:
        "204": { description: Desativada }
        "404": { $ref: "#/components/responses/Erro" }
        "409":
          description: "`RESOURCE_IN_USE` — é a única tabela vigente hoje; sem ela nenhum orçamento sai (`RATE_NOT_FOUND`)."
          $ref: "#/components/responses/Erro"

  /rates:
    get:
      tags: [Tarifário]
      summary: Lista as tarifas (produto × tipo de data → valor)
      description: |
        `GET /rates?rate_table_id=...` reproduz a grade inteira da tabela — é o
        critério de aceite da spec §3 ("`GET /rates` reproduz a Tabela V1
