        "409": { $ref: "#/components/responses/Erro" }
        "422": { $ref: "#/components/responses/Erro" }
    patch:
      tags: [Tarifário]
      summary: Atualiza a tarifa
      description: |
        Na prática só `amount_cents` muda. **Alterar a tarifa muda o próximo
        orçamento e não muda nenhum orçamento ou reserva já emitidos** — é o
