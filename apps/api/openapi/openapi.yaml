        `code` é a identidade operacional da unidade (`AP-01`, `SP-04`,
        `COB-01`) e é por ele que tudo se ordena. A unidade **não** carrega
        produto: o vínculo é a composição (`unit_type_members`), que é
        muitos-para-muitos — `AP-01` pertence ao Apartamento 2 Suítes **e** à
        White House Completa ao mesmo tempo.
