        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: active,   in: query, schema: { type: boolean } }
        - name: on
          in: query
          schema: { type: string, format: date }
          description: Traz apenas a(s) tabela(s) vigente(s) na data informada.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TabelaDeTarifas" }
                  - $ref: "#/components/schemas/Paginacao"
        "403": { $ref: "#/components/responses/Erro" }
    post:
      tags: [Tarifário]
      summary: Cria uma tabela de tarifas
      x-rbac: { recurso: settings, acao: criar }
