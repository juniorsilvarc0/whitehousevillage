        Períodos **podem se sobrepor de propósito** (Réveillon dentro da alta
        temporada) — por isso a tabela não tem constraint de exclusão. Quem
        resolve o empate é a precedência (`date_type_rules`), que é dado.
      x-rbac: { recurso: settings, acao: ver }
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: from,     in: query, schema: { type: string, format: date } }
        - { name: to,       in: query, schema: { type: string, format: date } }
