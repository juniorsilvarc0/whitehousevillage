          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PeriodoEspecial" }
        "409":
          description: "`CODE_IN_USE` — `name` já usado na propriedade (chave natural do seed)."
          $ref: "#/components/responses/Erro"
