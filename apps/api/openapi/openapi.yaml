  # ════════════════════════════════════════════════════════════════════
  # Tarifário e política comercial — módulo `tarifario`.
  #
  # TUDO aqui é dado versionado, nunca constante em código (spec §Convenções).
  # E nada aqui reescreve o passado: orçamento e reserva já emitidos guardam o
  # que usaram (`reservation_nights.price_cents`, `reservations.rate_table_id`,
  # `policy_version`, `cancellation_policy_id`). Mudar tarifa, feriado, período,
  # mínimo de noites ou política vale **do próximo cálculo em diante**.
  # ════════════════════════════════════════════════════════════════════

  /rate-tables:
    get:
      tags: [Tarifário]
      summary: Lista as tabelas de tarifas
      description: |
        Tabela de tarifas é versionada por vigência (`valid_from`/`valid_to`).
        A vigente numa data é a de maior `valid_from` que cobre a data e está
        `active`; `valid_to` nulo é "sem fim".
      x-rbac: { recurso: settings, acao: ver }
      parameters:
        - { name: page,     in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: active,   in: query, schema: { type: boolean } }
        - name: "on"
          in: query
          schema: { type: string, format: date }
          description: |
            Traz apenas a(s) tabela(s) vigente(s) na data informada.

            O nome vai **entre aspas** de propósito: em YAML 1.1, `on` sem aspas
            é o booleano `true`, e o parâmetro chegava a gerador de cliente e a
            validador como `name: true` — medido com `openapi-spec-validator`
            em 02/10/2026, que reprovava o contrato inteiro por esta linha.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TabelaDeTarifas" }
                  - $ref: "#/components/schemas/Paginacao"
        "403": { $ref: "#/components/responses/Erro" }
    post:
      tags: [Tarifário]
      summary: Cria uma tabela de tarifas
      x-rbac: { recurso: settings, acao: criar }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TabelaDeTarifasEntrada" }
      responses:
        "201":
          description: Criada
          headers:
            Location:
              description: URI do recurso criado.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TabelaDeTarifas" }
        "409":
          description: "`CODE_IN_USE` — `name` já usado na propriedade. É a chave natural `UNIQUE (property_id, name)` que o seed usa para reencontrar a própria linha."
          $ref: "#/components/responses/Erro"
        "422": { $ref: "#/components/responses/Erro" }

  /rate-tables/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Tarifário]
      summary: Detalhe da tabela de tarifas
      x-rbac: { recurso: settings, acao: ver }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TabelaDeTarifas" }
